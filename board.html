<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quadro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #ffffff;
      --paper-2: #f4f1ea;
      --ink: #14120f;
      --body: #44423d;
      --accent: #e0402b;
      --line: #e7e3db;
      --radius: 6px;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --font-display: "Archivo", system-ui, sans-serif;
      --font-body: "Newsreader", Georgia, serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; }

    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 1.05rem;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: var(--accent); color: var(--paper); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .shell {
      width: min(1280px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 1.75rem 0 3rem;
    }

    .top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      padding-bottom: 1.1rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--line);
    }

    .top__left { display: flex; flex-direction: column; gap: 0.55rem; min-width: 0; }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      align-self: flex-start;
      padding: 0.45rem 0.7rem 0.45rem 0.5rem;
      font-family: var(--font-display);
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--ink);
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      transition: border-color 140ms var(--ease), background-color 140ms var(--ease), color 140ms var(--ease);
    }

    .back:hover {
      border-color: var(--ink);
      background: var(--paper-2);
      color: var(--accent);
    }

    .back svg {
      width: 1.1rem;
      height: 1.1rem;
      stroke-width: 1.75;
      flex-shrink: 0;
    }

    h1 {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      letter-spacing: -0.03em;
      line-height: 1.05;
    }

    .blurb { color: var(--body); max-width: 36rem; }

    .count {
      font-family: var(--font-display);
      font-size: 0.78rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--body);
      white-space: nowrap;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.85rem;
      align-items: start;
      min-height: 60vh;
    }

    .col {
      background: var(--paper-2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      min-height: 18rem;
      display: flex;
      flex-direction: column;
    }

    .col.is-over { border-color: var(--ink); }

    .col__head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.9rem 1rem 0.75rem;
      border-bottom: 1px solid var(--line);
    }

    .col__title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: -0.02em;
    }

    .col__n {
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
    }

    .col__list {
      list-style: none;
      padding: 0.65rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      flex: 1;
      min-height: 8rem;
    }

    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0.85rem 0.95rem;
      cursor: grab;
      transition: border-color 140ms var(--ease), background-color 140ms var(--ease);
    }

    .card:hover { border-color: var(--ink); }
    .card:active { cursor: grabbing; }
    .card.is-dragging { opacity: 0.45; }

    .card__title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: -0.01em;
      line-height: 1.35;
      color: var(--ink);
    }

    .empty {
      margin: 2.5rem auto;
      max-width: 28rem;
      text-align: left;
    }

    .empty h1 { margin-bottom: 0.75rem; }
    .empty p { color: var(--body); margin-bottom: 1rem; }

    @media (max-width: 900px) {
      .board { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
    }
  </style>
</head>
<body>
  <div class="shell" id="app">
    <p class="blurb">Carregando quadro…</p>
  </div>

  <script src="https://unpkg.com/lucide@0.468.0"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const slug = params.get("p") || "";
    const storageKey = (s) => `works-board:v5:${s}`;

    async function loadSeed() {
      try {
        const res = await fetch("boards/data.json", { cache: "no-store" });
        if (!res.ok) throw new Error("fetch failed");
        return await res.json();
      } catch (_) {
        // file:// fallback: data was inlined below by build — if missing, empty
        if (window.__BOARDS__) return window.__BOARDS__;
        throw new Error("Sem dados do quadro");
      }
    }

    function countCards(board) {
      return board.columns.reduce((n, c) => n + c.cards.length, 0);
    }

    function persist(slug, board) {
      localStorage.setItem(storageKey(slug), JSON.stringify(board));
    }

    function hydrate(slug, seed) {
      const raw = localStorage.getItem(storageKey(slug));
      if (!raw) return structuredClone(seed);
      try {
        const saved = JSON.parse(raw);
        if (!saved?.columns?.length) return structuredClone(seed);
        return saved;
      } catch {
        return structuredClone(seed);
      }
    }

    function render(slug, board) {
      document.title = board.name + " · Quadro";
      const app = document.getElementById("app");
      const total = countCards(board);

      app.innerHTML = `
        <div class="top">
          <div class="top__left">
            <a class="back" href="index.html" aria-label="Voltar aos projetos">
              <i data-lucide="arrow-left"></i>
              Projetos
            </a>
            <h1>${escapeHtml(board.name)}</h1>
            <p class="blurb">${escapeHtml(board.blurb || "")}</p>
          </div>
          <p class="count">${total} atividades</p>
        </div>
        <div class="board" id="board"></div>
      `;

      if (window.lucide) lucide.createIcons();

      const root = document.getElementById("board");
      board.columns.forEach((col) => {
        const el = document.createElement("section");
        el.className = "col";
        el.dataset.col = col.id;
        el.innerHTML = `
          <div class="col__head">
            <h2 class="col__title">${escapeHtml(col.title)}</h2>
            <span class="col__n">${col.cards.length}</span>
          </div>
          <ul class="col__list" data-col="${col.id}"></ul>
        `;
        const list = el.querySelector(".col__list");
        col.cards.forEach((card) => list.appendChild(cardEl(card)));
        wireColumn(list, slug, board);
        root.appendChild(el);
      });
    }

    function cardEl(card) {
      const li = document.createElement("li");
      li.className = "card";
      li.draggable = true;
      li.dataset.id = card.id;
      li.innerHTML = `<p class="card__title">${escapeHtml(card.title)}</p>`;
      li.addEventListener("dragstart", (e) => {
        li.classList.add("is-dragging");
        e.dataTransfer.setData("text/plain", card.id);
        e.dataTransfer.effectAllowed = "move";
      });
      li.addEventListener("dragend", () => li.classList.remove("is-dragging"));
      return li;
    }

    function wireColumn(list, slug, board) {
      list.addEventListener("dragover", (e) => {
        e.preventDefault();
        list.parentElement.classList.add("is-over");
        e.dataTransfer.dropEffect = "move";
      });
      list.addEventListener("dragleave", () => list.parentElement.classList.remove("is-over"));
      list.addEventListener("drop", (e) => {
        e.preventDefault();
        list.parentElement.classList.remove("is-over");
        const id = e.dataTransfer.getData("text/plain");
        if (!id) return;
        moveCard(slug, board, id, list.dataset.col);
      });
    }

    function moveCard(slug, board, cardId, toColId) {
      let moving = null;
      board.columns.forEach((col) => {
        const i = col.cards.findIndex((c) => c.id === cardId);
        if (i >= 0) moving = col.cards.splice(i, 1)[0];
      });
      if (!moving) return;
      const dest = board.columns.find((c) => c.id === toColId);
      if (!dest) return;
      dest.cards.push(moving);
      persist(slug, board);
      render(slug, board);
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function missing(slug) {
      document.getElementById("app").innerHTML = `
        <div class="empty">
          <a class="back" href="index.html" aria-label="Voltar aos projetos">
            <i data-lucide="arrow-left"></i>
            Projetos
          </a>
          <h1>Quadro não encontrado</h1>
          <p>Não há quadro para <strong>${escapeHtml(slug || "(vazio)")}</strong>.</p>
        </div>`;
      if (window.lucide) lucide.createIcons();
    }

    (async () => {
      if (!slug) return missing("");
      try {
        const all = await loadSeed();
        const seed = all[slug];
        if (!seed) return missing(slug);
        render(slug, hydrate(slug, seed));
      } catch (err) {
        document.getElementById("app").innerHTML = `
          <div class="empty">
            <a class="back" href="index.html" aria-label="Voltar aos projetos">
              <i data-lucide="arrow-left"></i>
              Projetos
            </a>
            <h1>Falha ao carregar</h1>
            <p>${escapeHtml(err.message)}</p>
          </div>`;
        if (window.lucide) lucide.createIcons();
      }
    })();
  </script>
