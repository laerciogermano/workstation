# Contabo: /etc/nginx/sites-available/centralizador
# HTTPS: certbot --nginx -d centralizador.laerciogermano.com

server {
    listen 80;
    listen [::]:80;
    server_name centralizador.laerciogermano.com centralizador.lesgermano.com;

    root /opt/centralizador;
    index index.html;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
