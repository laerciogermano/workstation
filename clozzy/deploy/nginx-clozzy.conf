# Contabo: /etc/nginx/sites-available/clozzy-proto
# HTTPS: certbot --nginx -d clozzy.laerciogermano.com
# Conteúdo: home / · protótipo /prototipo/ · marca /marca/

server {
    listen 80;
    listen [::]:80;
    server_name clozzy.laerciogermano.com;

    root /opt/clozzy;
    index index.html;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        try_files $uri $uri/ =404;
    }
}
