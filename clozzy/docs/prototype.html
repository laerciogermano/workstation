<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>clozzy · protótipo v1</title>
<style>
@font-face{font-family:Gabarito;src:url("../marca/identidade-nova/fonts/Gabarito-Variable.ttf");font-weight:400 900}
@font-face{font-family:Figtree;src:url("../marca/identidade-nova/fonts/Figtree-Variable.ttf");font-weight:300 900}

/* ---------- tokens (marca/uso-da-marca/tokens.css) ---------- */
:root{
  --cz-rosa:#FF0065;--cz-pink-deep:#E0005A;--cz-roxo:#7C48C4;--cz-ink:#14090F;--cz-branco:#FFFFFF;
  --cz-cream:#FFF6F0;--cz-lavanda:#EBE3FA;--cz-rosa-suave:#FFD9E7;--cz-muted:#6B5A62;
  --ok:#2BB673;--r-card:20px;--r-tile:14px;
  --t-display:Gabarito,system-ui,sans-serif;--t-body:Figtree,system-ui,sans-serif;
}
[data-tema="preto"]{--superficie:#14090F;--superficie-2:#241A20;--linha:#3A3035;--titulo:#FFFFFF;--texto:#E8E6E7;--apoio:#B4B0B2;--destaque:#FF0065;--botao:#FFFFFF;--botao-texto:#14090F;--secundario:#959093;--link:#FF0065;--chip:#2C2227;--chip-texto:#FFFFFF;--chip-ativo:#FFFFFF;--chip-ativo-texto:#14090F;
  --lg-ring:#FF0065;--lg-star:#FFFFFF;--lg-word:#FFFFFF;--selo-bg:transparent;--selo-fg:#FF0065;--selo-bd:#FF0065;--campo:#1C1318}
[data-tema="branco"]{--superficie:#FFFFFF;--superficie-2:#FFF6F0;--linha:#DEDDDD;--titulo:#14090F;--texto:#14090F;--apoio:#6B5A62;--destaque:#E0005A;--botao:#E0005A;--botao-texto:#FFFFFF;--secundario:#14090F;--link:#E0005A;--chip:#FFD9E7;--chip-texto:#14090F;--chip-ativo:#14090F;--chip-ativo-texto:#FFFFFF;
  --lg-ring:#E0005A;--lg-star:#E0005A;--lg-word:#14090F;--selo-bg:#E0005A;--selo-fg:#FFFFFF;--selo-bd:#E0005A;--campo:#FFFFFF}
[data-tema="roxo"]{--superficie:#7C48C4;--superficie-2:#8C5ECB;--linha:#A37FD6;--titulo:#FFFFFF;--texto:#FFFFFF;--apoio:#EBE3FA;--destaque:#EBE3FA;--botao:#FFFFFF;--botao-texto:#7C48C4;--secundario:#FFFFFF;--link:#FFFFFF;--chip:#9165CD;--chip-texto:#FFFFFF;--chip-ativo:#FFFFFF;--chip-ativo-texto:#7C48C4;
  --lg-ring:#FFFFFF;--lg-star:#FFFFFF;--lg-word:#FFFFFF;--selo-bg:#FFFFFF;--selo-fg:#7C48C4;--selo-bd:#FFFFFF;--campo:#8C5ECB}
[data-tema="rosa"]{--superficie:#FF0065;--superficie-2:#E0005A;--linha:#FF66A3;--titulo:#FFFFFF;--texto:#FFFFFF;--apoio:#FFFFFF;--destaque:#FFFFFF;--botao:#FFFFFF;--botao-texto:#E0005A;--secundario:#FFFFFF;--link:#FFFFFF;--chip:#FF3384;--chip-texto:#FFFFFF;--chip-ativo:#FFFFFF;--chip-ativo-texto:#E0005A;
  --lg-ring:#FFFFFF;--lg-star:#FFFFFF;--lg-word:#FFFFFF;--selo-bg:#FFFFFF;--selo-fg:#E0005A;--selo-bd:#FFFFFF;--campo:#E0005A}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font:400 16px/1.5 var(--t-body);background:var(--superficie);color:var(--texto);-webkit-font-smoothing:antialiased;min-height:100vh}
[data-tema]{background:var(--superficie);color:var(--texto)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--link);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
img{display:block;max-width:100%}
svg{display:block}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.narrow{max-width:760px}

/* ---------- tipografia ---------- */
.d1,.d2,.d3,.h4{font-family:var(--t-display);color:var(--titulo);letter-spacing:-.035em;line-height:.98}
.d1{font-weight:900;font-size:clamp(48px,7.4vw,96px)}
.d2{font-weight:900;font-size:clamp(36px,4.8vw,60px)}
.d3{font-weight:800;font-size:clamp(26px,3vw,34px);line-height:1.05}
.h4{font-weight:800;font-size:20px;letter-spacing:-.02em;line-height:1.15}
.hl{color:var(--destaque)}
.kicker{font:700 12px/1 var(--t-body);letter-spacing:.14em;text-transform:uppercase;color:var(--apoio)}
.lead{font-size:18px;color:var(--apoio);max-width:52ch}
.apoio{color:var(--apoio)}
.small{font-size:14px}.xs{font-size:12px}
.price{font-family:var(--t-display);font-weight:800;color:var(--destaque);letter-spacing:-.02em;white-space:nowrap}
.num{font-family:var(--t-display);font-weight:900;letter-spacing:-.035em;color:var(--titulo)}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:999px;font:800 16px/1 var(--t-display);letter-spacing:-.01em;background:var(--botao);color:var(--botao-texto);border:2px solid var(--botao);white-space:nowrap;transition:transform .12s,opacity .12s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.lg{height:56px;padding:0 30px;font-size:17px}
.btn.sm{height:36px;padding:0 16px;font-size:14px}
.btn.block{width:100%}
.btn.sec{background:transparent;color:var(--titulo);border-color:var(--secundario)}
.btn.ghost{background:var(--chip);border-color:var(--chip);color:var(--chip-texto)}
.btn[disabled],.btn.off{background:var(--chip);border-color:var(--chip);color:var(--apoio);cursor:not-allowed}
.btn svg{width:18px;height:18px}
.link{background:none;border:0;color:var(--link);font:700 15px/1 var(--t-body);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--titulo)}
.iconbtn:hover{background:var(--chip)}
.iconbtn svg{width:22px;height:22px}

/* ---------- chips, selos ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:34px;padding:0 14px;border-radius:999px;background:var(--chip);color:var(--chip-texto);font:700 14px/34px var(--t-body);white-space:nowrap}
.chip.on{background:var(--chip-ativo);color:var(--chip-ativo-texto)}
.selo{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:999px;font:800 11px/1 var(--t-body);letter-spacing:.01em;background:var(--selo-bg);color:var(--selo-fg);border:1.5px solid var(--selo-bd);white-space:nowrap}
.selo svg{width:10px;height:10px}
.status{display:inline-flex;align-items:center;gap:6px;font:700 13px/1 var(--t-body);color:var(--apoio)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--apoio)}
.status.ativa i{background:var(--ok)}.status.ativa{color:var(--titulo)}
.status.pend i{background:#F5B83D;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}

/* ---------- campos ---------- */
.field{display:grid;gap:6px}
.field label,.lbl{font:700 13px/1.2 var(--t-body);color:var(--titulo)}
.field .hint{font-size:12px;color:var(--apoio)}
.input,select.input,textarea.input{width:100%;height:50px;border-radius:14px;border:1.5px solid var(--linha);background:var(--campo);padding:0 16px;font-size:16px;color:var(--titulo);outline:none;transition:border-color .15s}
textarea.input{height:auto;min-height:96px;padding:12px 16px;resize:vertical;line-height:1.45}
.input:focus{border-color:var(--titulo)}
.input::placeholder{color:var(--apoio);opacity:.8}
.prefix{position:relative}.prefix span{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--apoio);font-weight:600}.prefix .input{padding-left:var(--pl,44px)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--texto);cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--destaque);flex:none;margin-top:1px}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--linha);transition:.2s}
.switch span:after{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+span{background:var(--destaque)}
.switch input:checked+span:after{transform:translateX(18px)}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{height:30px;padding:0 12px;border-radius:999px;font:700 13px/1 var(--t-body);color:var(--chip-texto)}
.seg button.on{background:var(--chip-ativo);color:var(--chip-ativo-texto)}

/* ---------- superfícies ---------- */
.card{background:var(--superficie-2);border-radius:var(--r-card);padding:24px}
.card.line{background:transparent;border:1.5px solid var(--linha)}
.hr{height:1px;background:var(--linha);border:0}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:16px}
.stack>*+*{margin-top:var(--gap,16px)}
.grid{display:grid;gap:20px}
.band{padding:96px 0}
.spacer{height:32px}

/* ---------- logo ---------- */
.logo{display:inline-flex;align-items:center;gap:0;height:28px;cursor:pointer}
.logo svg{height:100%;width:auto}
.sym{display:inline-block}

/* ---------- mídia ---------- */
.ph{position:relative;overflow:hidden;background:#241A20 center/cover no-repeat;border-radius:var(--r-tile)}
.ph .blur{position:absolute;inset:-24px;background:inherit;filter:blur(22px) saturate(1.1);transform:scale(1.1)}
.ph .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,9,15,.15),rgba(20,9,15,.55))}
.ph .lock{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:10px;color:#fff;text-align:center;font:700 14px/1.3 var(--t-body)}
.lockdot{width:46px;height:46px;border-radius:50%;background:rgba(20,9,15,.55);display:grid;place-items:center;margin:0 auto;backdrop-filter:blur(6px)}
.lockdot svg{width:20px;height:20px}
.ph .badge{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;align-items:center;color:#fff;font:700 12px/1 var(--t-body);background:rgba(20,9,15,.6);padding:6px 9px;border-radius:999px;backdrop-filter:blur(6px)}
.ph .badge svg{width:12px;height:12px}
.ar-sq{aspect-ratio:1}.ar-34{aspect-ratio:3/4}.ar-45{aspect-ratio:4/5}

/* avatar com anel (destaque do tema) */
.av{--s:44px;width:var(--s);height:var(--s);border-radius:50%;background:#241A20 center/cover;flex:none;position:relative}
.av.ring{box-shadow:0 0 0 2.5px var(--superficie),0 0 0 5px var(--destaque)}
.av.ini{display:grid;place-items:center;font:800 calc(var(--s)*.38)/1 var(--t-display);color:#fff;background:#3A3035}

/* ---------- header / nav ---------- */
.top{position:sticky;top:0;z-index:40;border-bottom:1px solid var(--linha);backdrop-filter:blur(12px);background:rgba(20,9,15,.88)}
.top .in{height:68px;display:flex;align-items:center;gap:28px}
.top nav{display:flex;gap:24px}
.top nav a{color:var(--texto);text-decoration:none;font:600 15px/1 var(--t-body);opacity:.85}
.top nav a.on,.top nav a:hover{opacity:1;color:var(--titulo)}
.top nav a.on{box-shadow:0 2px 0 var(--destaque);padding-bottom:6px;margin-bottom:-8px}
.top .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.burger{display:none}
.tabbar{display:none}
.mnav{display:none}
@media (max-width:820px){
  .top nav,.top .hide-m{display:none}
  .burger{display:grid}
  .wrap{padding:0 18px}
  .band{padding:64px 0}
  body.has-tabs{padding-bottom:72px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;height:66px;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--linha);background:rgba(20,9,15,.94);backdrop-filter:blur(12px)}
  .tabbar a{flex:1;display:grid;place-items:center;align-content:center;gap:4px;color:var(--apoio);text-decoration:none;font:600 11px/1 var(--t-body)}
  .tabbar a svg{width:22px;height:22px}
  .tabbar a.on{color:var(--destaque)}
  .mnav.open{display:block;position:fixed;inset:68px 0 0;z-index:39;background:var(--superficie);padding:24px 18px}
  .mnav a{display:block;font:800 28px/1 var(--t-display);letter-spacing:-.03em;color:var(--titulo);text-decoration:none;padding:16px 0;border-bottom:1px solid var(--linha)}
}

/* ---------- landing ---------- */
.hero{padding:72px 0 96px;position:relative;overflow:hidden}
.hero .grid{grid-template-columns:1.1fr .9fr;align-items:center;gap:56px}
.hero-art{position:relative;height:560px}
.hero-art .ph{position:absolute;border-radius:24px;box-shadow:0 30px 60px rgba(0,0,0,.45)}
.hero-art .a{width:62%;height:78%;right:0;top:0}
.hero-art .b{width:46%;height:52%;left:0;bottom:0;border:6px solid var(--superficie)}
.hero-card{position:absolute;left:8%;top:12%;width:230px;background:rgba(36,26,32,.92);backdrop-filter:blur(10px);border-radius:18px;padding:14px;color:#fff;box-shadow:0 20px 40px rgba(0,0,0,.4)}
.steps{grid-template-columns:repeat(3,1fr);gap:20px}
.step .n{font:900 56px/1 var(--t-display);color:var(--destaque);letter-spacing:-.04em}
.faq details{border-bottom:1.5px solid var(--linha);padding:20px 0}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:16px;font:800 19px/1.25 var(--t-display);letter-spacing:-.015em;color:var(--titulo)}
.faq summary::-webkit-details-marker{display:none}
.faq summary b{color:var(--destaque);font-size:24px;line-height:1;transition:transform .2s}
.faq details[open] summary b{transform:rotate(45deg)}
.faq details p{margin-top:10px;color:var(--apoio);max-width:68ch}
.foot{padding:56px 0 40px;border-top:1px solid var(--linha)}
.foot .cols{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:32px}
.foot h5{font:800 14px/1 var(--t-display);color:var(--titulo);margin-bottom:14px}
.foot a{display:block;color:var(--apoio);text-decoration:none;font-size:14px;padding:4px 0}
.foot a:hover{color:var(--titulo)}
.age18{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:2px solid var(--apoio);font:800 12px/1 var(--t-display);color:var(--apoio)}
@media (max-width:900px){
  .hero .grid{grid-template-columns:1fr}
  .hero-art{height:420px}
  .steps{grid-template-columns:1fr}
  .foot .cols{grid-template-columns:1fr 1fr}
}

/* ---------- vitrine / cards criador ---------- */
.ccards{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.ccard{cursor:pointer;display:block;text-decoration:none;color:inherit}
.ccard .ph{aspect-ratio:4/5;border-radius:18px}
.ccard .ph:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(20,9,15,.85))}
.ccard .meta{position:absolute;left:14px;right:14px;bottom:14px;z-index:1;color:#fff}
.ccard .meta b{font:800 19px/1.1 var(--t-display);letter-spacing:-.02em;display:flex;gap:6px;align-items:center}
.ccard .meta b svg{width:14px;height:14px;color:#FF0065}
.ccard .meta span{font-size:13px;opacity:.8}
.ccard .ph{transition:transform .25s}
.ccard:hover .ph{transform:translateY(-4px)}
.ccard .row{margin-top:10px}

/* ---------- perfil ---------- */
.cover{height:300px;position:relative;overflow:hidden}
.cover .ph{position:absolute;inset:0;border-radius:0}
.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,9,15,.1),var(--superficie))}
.phead{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:end;margin-top:-80px;position:relative;z-index:2}
.phead .av{--s:132px}
.pgrid{display:grid;grid-template-columns:1fr 380px;gap:40px;align-items:start}
.aside{position:sticky;top:92px}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--linha)}
.tabs button{padding:14px 0;font:800 16px/1 var(--t-display);color:var(--apoio);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--titulo);border-color:var(--destaque)}
.offer{display:grid;grid-template-columns:150px 1fr;gap:18px;background:var(--superficie-2);border-radius:var(--r-card);padding:14px;align-items:center}
.offer .ph{aspect-ratio:4/5}
.incl{display:grid;gap:8px;font-size:14px}
.incl div{display:flex;gap:8px;align-items:center}
.incl svg{width:16px;height:16px;color:var(--destaque);flex:none}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tgrid .ph{aspect-ratio:1;border-radius:10px}
@media (max-width:900px){
  .pgrid{grid-template-columns:1fr}
  .aside{position:static}
  .phead{grid-template-columns:1fr;gap:14px;margin-top:-64px}
  .phead .av{--s:104px}
  .cover{height:200px}
  .offer{grid-template-columns:96px 1fr}
}

/* ---------- checkout ---------- */
.co{display:grid;grid-template-columns:1fr 420px;gap:40px;align-items:start}
.qr{background:#fff;border-radius:20px;padding:16px;width:236px;margin:0 auto}
.qr svg{width:100%;height:auto}
.timer{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--chip);color:var(--titulo);font:700 13px/1 var(--t-body)}
.timer svg{width:14px;height:14px}
.code{font:500 13px/1.4 ui-monospace,Menlo,monospace;color:var(--apoio);word-break:break-all;background:var(--campo);border:1.5px dashed var(--linha);border-radius:12px;padding:12px}
.simbar{border:1.5px dashed var(--linha);border-radius:14px;padding:12px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media (max-width:900px){.co{grid-template-columns:1fr}}

/* ---------- momento rosa ---------- */
.moment{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:28px 24px 36px;text-align:center}
.moment .mid{display:grid;place-items:center;align-content:center;gap:22px;max-width:560px;margin:0 auto}
.moment .ok{width:96px;height:96px;border-radius:50%;background:#fff;color:var(--cz-pink-deep);display:grid;place-items:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.moment .ok svg{width:48px;height:48px;stroke-width:3}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.moment p{font-size:20px;line-height:1.4}
.moment .acts{display:grid;gap:12px;width:min(420px,100%);margin:0 auto}

/* ---------- acesso / viewer ---------- */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.mgrid .ph{aspect-ratio:3/4;cursor:zoom-in;transition:opacity .2s}
.mgrid .ph:hover{opacity:.9}
.viewer{position:fixed;inset:0;z-index:80;background:rgba(10,4,8,.96);display:grid;grid-template-rows:auto 1fr auto;color:#fff}
.viewer .bar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px}
.viewer .stage{position:relative;display:grid;place-items:center;overflow:hidden;padding:0 70px}
.viewer .img{height:min(78vh,900px);aspect-ratio:3/4;border-radius:12px;background:center/cover no-repeat;position:relative;overflow:hidden;max-width:100%}
.wm{position:absolute;inset:-50%;display:flex;flex-wrap:wrap;gap:60px 80px;transform:rotate(-24deg);opacity:.12;font:800 18px/1 var(--t-display);pointer-events:none;align-content:center;justify-content:center}
.viewer .nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;color:#fff}
.viewer .nav svg{width:24px;height:24px}
.viewer .prev{left:14px}.viewer .next{right:14px}
.viewer .play{position:absolute;inset:0;display:grid;place-items:center}
.viewer .play span{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.92);color:#14090F;display:grid;place-items:center}
.viewer .play svg{width:30px;height:30px;margin-left:4px}
.viewer .prog{position:absolute;left:16px;right:16px;bottom:16px;height:4px;border-radius:2px;background:rgba(255,255,255,.25)}
.viewer .prog i{display:block;height:100%;width:0;background:#FF0065;border-radius:2px;transition:width .3s linear}
.viewer .foot2{padding:14px 18px;text-align:center;font-size:13px;opacity:.7}
@media (max-width:700px){.viewer .stage{padding:0 10px}.viewer .nav{display:none}}

/* ---------- biblioteca ---------- */
.lib-row{display:grid;grid-template-columns:76px 1fr auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--linha)}
.lib-row .ph{width:76px;height:76px;border-radius:14px}

/* ---------- auth ---------- */
.auth{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.auth .art{position:relative;overflow:hidden}
.auth .art .ph{position:absolute;inset:0;border-radius:0}
.auth .art:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,9,15,.2),rgba(20,9,15,.85))}
.auth .art .txt{position:absolute;left:48px;right:48px;bottom:48px;z-index:1}
.auth .form{display:grid;align-content:center;padding:48px;max-width:520px;width:100%;margin:0 auto}

/* ---------- painel ---------- */
.dash{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{background:var(--superficie-2);padding:24px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.side a{display:flex;align-items:center;gap:12px;height:46px;padding:0 14px;border-radius:12px;color:var(--texto);text-decoration:none;font:600 15px/1 var(--t-body)}
.side a svg{width:20px;height:20px;opacity:.8}
.side a:hover{background:var(--chip)}
.side a.on{background:var(--chip-ativo);color:var(--chip-ativo-texto)}
.side a.on svg{opacity:1}
.dmain{padding:32px 40px 80px;min-width:0}
.dhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.kpis{grid-template-columns:repeat(4,1fr);gap:16px}
.kpi .num{font-size:clamp(24px,2.6vw,34px);margin-top:10px;white-space:nowrap}
.kpi .d{font-size:13px;margin-top:6px;color:var(--apoio)}
.kpi .d b{color:var(--ok)}
.chart{position:relative}
.chart svg{width:100%;height:240px;overflow:visible}
.chart rect.bar{fill:#FF0065;transition:opacity .15s}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover+rect.bar,.chart rect.bar.on{opacity:1}
.chart.hovering rect.bar{opacity:.45}
.chart.hovering rect.bar.on{opacity:1}
.tip{position:fixed;z-index:90;pointer-events:none;background:#FFFFFF;color:#14090F;border-radius:10px;padding:8px 12px;font:600 13px/1.35 var(--t-body);box-shadow:0 8px 24px rgba(0,0,0,.3);transform:translate(-50%,calc(-100% - 12px));display:none;white-space:nowrap}
.tip b{font:800 15px/1.2 var(--t-display)}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{text-align:left;font:700 12px/1 var(--t-body);letter-spacing:.08em;text-transform:uppercase;color:var(--apoio);padding:12px 10px;border-bottom:1px solid var(--linha)}
.table td b{white-space:nowrap}
.table td{padding:14px 10px;border-bottom:1px solid var(--linha);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.drop{border:2px dashed var(--linha);border-radius:var(--r-card);padding:36px;text-align:center;cursor:pointer;transition:border-color .2s}
.drop:hover{border-color:var(--destaque)}
.drop svg{width:32px;height:32px;margin:0 auto 10px;color:var(--destaque)}
.bar-prog{height:6px;border-radius:3px;background:var(--linha);overflow:hidden}
.bar-prog i{display:block;height:100%;background:var(--destaque);width:0;transition:width .2s}
.mini{border-radius:28px;overflow:hidden;border:8px solid #2C2227;background:var(--superficie);max-width:340px;margin:0 auto}
.dtabs{display:none}
@media (max-width:1000px){.kpis{grid-template-columns:1fr 1fr}}
@media (max-width:860px){
  .dash{grid-template-columns:1fr}
  .side{display:none}
  .dmain{padding:20px 18px 90px}
  .dtabs{display:flex;gap:8px;overflow-x:auto;padding:12px 18px;border-bottom:1px solid var(--linha);position:sticky;top:0;z-index:30;background:var(--superficie)}

  .hide-sm{display:none}
}

/* ---------- onboarding roxo ---------- */
.onb{min-height:100vh;display:grid;grid-template-rows:auto 1fr}
.onb .topo{display:flex;justify-content:space-between;align-items:center;padding:20px 24px}
.onb .body{width:min(560px,100%);margin:0 auto;padding:20px 24px 60px}
.pbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:28px}
.pbar i{height:4px;border-radius:2px;background:var(--linha)}
.pbar i.on{background:#fff}
.upl{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.upl button{border:2px dashed var(--linha);border-radius:18px;padding:22px 12px;display:grid;gap:8px;place-items:center;color:var(--titulo);font:700 14px/1.3 var(--t-body)}
.upl button svg{width:28px;height:28px}
.upl button.done{border-style:solid;border-color:#fff;background:var(--superficie-2)}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:70;background:rgba(10,4,8,.72);display:grid;place-items:center;padding:20px;backdrop-filter:blur(8px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{width:min(520px,100%);max-height:calc(100vh - 40px);overflow:auto;border-radius:24px;padding:28px;position:relative;animation:up .25s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(16px);opacity:0}}
.modal .x{position:absolute;right:14px;top:14px}
.age{width:min(480px,100%);text-align:center;padding:40px 32px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:95;background:#FFFFFF;color:#14090F;border-radius:999px;padding:12px 20px;font:700 14px/1.2 var(--t-body);box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;gap:8px;align-items:center;animation:up .25s}
.toast svg{width:18px;height:18px;color:#E0005A}
body.has-tabs .toast{bottom:90px}

/* ---------- ferramenta do protótipo (fora do produto) ---------- */
.pt-btn{position:fixed;right:16px;bottom:16px;z-index:100;height:40px;padding:0 14px;border-radius:999px;background:#FFFFFF;color:#14090F;font:700 13px/1 var(--t-body);display:flex;gap:8px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.35);border:1px solid #DEDDDD}
body.has-tabs .pt-btn{bottom:82px}
.pt-btn svg{width:16px;height:16px}
.pt{position:fixed;right:16px;bottom:64px;z-index:100;width:320px;max-height:calc(100vh - 90px);overflow:auto;background:#FFFFFF;color:#14090F;border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.45);padding:16px;font-size:13px;display:none}
body.has-tabs .pt{bottom:130px;max-height:calc(100vh - 150px)}
.pt.open{display:block}
.pt h6{font:700 11px/1 var(--t-body);letter-spacing:.12em;text-transform:uppercase;color:#6B5A62;margin:14px 0 6px}
.pt h6:first-child{margin-top:0}
.pt a{display:flex;gap:8px;padding:6px 8px;border-radius:8px;color:#14090F;text-decoration:none;font-weight:600}
.pt a:hover{background:#FFF6F0}
.pt a code{font:700 11px/1.6 ui-monospace,Menlo,monospace;color:#6B5A62;min-width:28px}
.pt .who{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.pt .who button{height:32px;border-radius:8px;background:#F3F1F2;font-weight:700;font-size:12px}
.pt .who button.on{background:#14090F;color:#fff}
.pt .tools{display:flex;gap:6px;flex-wrap:wrap}

.fade-in{animation:fade .25s}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}.mt48{margin-top:48px}
.center{text-align:center}

let pix={id:null,status:'aguardando',fim:0};
function qrSVG(seed){
  let s=0;for(const ch of seed)s=(s*31+ch.charCodeAt(0))>>>0;
  const rnd=()=>(s=(s*1664525+1013904223)>>>0)/4294967296;
  const N=29;let r='';
  const finder=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#14090F"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#14090F"/>`;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const inF=(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);if(!inF&&rnd()>.52)r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`}
  const cx=(N-7)/2;
  return `<svg viewBox="0 0 ${N} ${N}" shape-rendering="crispEdges"><g fill="#14090F">${r}</g>${finder(0,0)}${finder(N-7,0)}${finder(0,N-7)}<rect x="${cx-.5}" y="${cx-.5}" width="8" height="8" rx="2" fill="#fff"/><g transform="translate(${cx} ${cx}) scale(.0778)"><g style="--lg-ring:#E0005A;--lg-star:#E0005A">${SYM_INNER.replace(/var\(--lg-star\)/g,'#E0005A').replace(/var\(--lg-ring\)/g,'#E0005A')}</g></g></svg>`;
}

  return {tema:'preto',html:`${header()}

      :`<div class="center stack" style="--gap:16px">

function viewer(o,i){
  const n=o.media.length;const m=o.media[i];const who='@'+(S.user?.nome||'fã').split(' ')[0].toLowerCase()+' · clozzy';
  const el=document.createElement('div');el.className='viewer';el.dataset.tema='preto';
  el.innerHTML=`<div class="bar"><span class="small" style="font-weight:700">${o.titulo} <span style="opacity:.6;font-weight:500">· ${i+1} de ${n}</span></span><button class="iconbtn" style="color:#fff" data-act="fechaViewer">${ic('x')}</button></div>
   <div class="stage"><div class="img" style="${bg(m)}"><div class="wm">${Array(40).fill(`<span>${who}</span>`).join('')}</div>${m.v?`<div class="play"><span>${ic('play')}</span></div><div class="prog"><i id="vprog"></i></div>`:''}</div>
    <button class="nav prev" data-act="nav" data-v="${(i-1+n)%n}">${ic('left')}</button><button class="nav next" data-act="nav" data-v="${(i+1)%n}">${ic('right')}</button></div>
   <div class="foot2">${m.v?'Vídeo '+m.v+' · só streaming':'Foto'} · sem download</div>`;
  $('.viewer')?.remove();document.body.appendChild(el);
  if(m.v){let p=0;const t=setInterval(()=>{p=Math.min(100,p+2);const b=$('#vprog');if(!b)return clearInterval(t);b.style.width=p+'%'},200)}
}
document.addEventListener('keydown',e=>{const v=$('.viewer');if(!v)return;if(e.key==='Escape')v.remove();if(e.key==='ArrowRight')$('.viewer .next')?.click();if(e.key==='ArrowLeft')$('.viewer .prev')?.click()});

          <p class="apoio small">${c.nome} · ${tipoLbl[o.tipo]}${o.tipo==='assinatura'&&ativa?' · renova '+(x.renova||'12/12'):''}</p>

const VENDAS=[182,240,96,310,288,420,512,198,260,344,402,286,476,588];
function dash(sec,tema,body){
  const items=[['geral','Visão geral','grid'],['perfil','Perfil público','user'],['ofertas','Ofertas','tag'],['conteudos','Conteúdos','layers'],['financeiro','Financeiro','wallet']];
  return {tema,html:`<div class="dash">
    <aside class="side" data-tema="preto">
      <div style="padding:6px 10px 22px">${logo(26)}</div>
      ${items.map(([k,l,i])=>`<a data-go="painel${k==='geral'?'':'/'+k}" class="${sec===k?'on':''}">${ic(i)}${l}</a>`).join('')}
      <div style="margin-top:auto" class="stack">
        <a data-go="c/${S.painel.nick}">${ic('eye')}Ver minha página</a>
        <a data-go="conta">${ic('user')}Conta</a>
        <div class="row" style="padding:12px 10px;gap:10px;border-top:1px solid var(--linha);margin-top:8px">${avatar(CR('laramendes'),36)}<div><b class="small" style="color:var(--titulo)">${S.painel.nome}</b><div class="status ativa xs"><i></i>conta ativa</div></div></div>
      </div>
    </aside>
    <div style="min-width:0" data-tema="${tema}">
      <nav class="dtabs" data-tema="${tema}"><button class="chip" data-go="">${ic('left','style="width:16px;height:16px;display:inline"')}</button>${items.map(([k,l])=>`<button class="chip ${sec===k?'on':''}" data-go="painel${k==='geral'?'':'/'+k}">${l}</button>`).join('')}</nav>
      <main class="dmain">${body}</main>
    </div></div>`};
}
PAGES.painel=(sec)=>{
  initConteudos();
  const P=S.painel;const L=CR('laramendes');
  if(sec==='geral'){
    const max=Math.max(...VENDAS),W=700,H=220,bw=W/VENDAS.length;
    const bars=VENDAS.map((v,i)=>{const h=v/max*(H-30),x=i*bw+2,y=H-h;const dia=new Date(2026,9,29+i).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
      return `<g><rect class="hit" x="${i*bw}" y="0" width="${bw}" height="${H}" data-tip="<b>${brl(v)}</b><br>${dia} · ${Math.round(v/22)} vendas"/><rect class="bar" x="${x}" y="${y}" width="${bw-4}" height="${h}" rx="4"/>${i%2===0?`<text x="${x+(bw-4)/2}" y="${H+18}" text-anchor="middle" font-size="11" fill="var(--apoio)">${dia}</text>`:''}</g>`}).join('');
    return dash('geral','preto',`
      <div class="dhead"><div><p class="kicker">Painel</p><h1 class="d2 mt8">Oi, ${P.nome.split(' ')[0]}.</h1></div><div class="row" style="gap:10px"><button class="btn sec" data-go="c/${P.nick}">${ic('eye')}Ver página</button><button class="btn" data-go="painel/ofertas?nova=1">${ic('plus')}Nova oferta</button></div></div>
      <div class="grid kpis">
        ${[['Vendas em novembro',brl(4812.3),'<b>+18%</b> vs. outubro'],['No close',L.membros,'<b>+126</b> esta semana'],['Saldo disponível',brl(P.saldo),brl(P.liberar)+' a liberar'],['Ofertas ativas',String(L.ofertas.length-Object.values(P.ofertaStatus).filter(s=>s==='pausada').length),'1 close · '+(L.ofertas.length-1)+' packs e itens']].map(([k,v,d])=>`
        <div class="card kpi"><p class="apoio small">${k}</p><p class="num">${v}</p><p class="d">${d}</p></div>`).join('')}
      </div>
      <div class="grid mt24" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr))">

PAGES.legal=(tab)=>{

  const body={
   termos:`<h1 class="d2">Termos de uso</h1><p class="apoio mt8">Atualizado em 11/11/2026</p>
     ${[['1. O que é o clozzy','Plataforma onde criadores vendem conteúdo exclusivo (close mensal, packs e itens) e fãs compram e acessam esse conteúdo.'],['2. Conta','Para comprar ou vender é preciso ter 18 anos ou mais e uma conta com e-mail confirmado. Você responde pelo acesso à sua conta.'],['3. Compras','O pagamento é feito por Pix. O acesso é liberado após a confirmação do banco. Packs e itens ficam na biblioteca sem prazo; o close mensal vale enquanto estiver ativo.'],['4. Uso do conteúdo','O conteúdo é licenciado para uso pessoal. É proibido baixar, gravar a tela, redistribuir ou revender. Cada mídia leva marca d’água da conta que comprou.'],['5. Criadores','Criadores passam por verificação de identidade, declaram que têm os direitos e o consentimento de todas as pessoas no conteúdo e recebem 90% de cada venda.'],['6. Cancelamento e reembolso','O close pode ser cancelado a qualquer momento; o acesso segue até o fim do período pago. Reembolso só em caso de falha de entrega comprovada.']].map(([h,p])=>`<h2 class="h4 mt32">${h}</h2><p class="mt8" style="max-width:68ch">${p}</p>`).join('')}`,
   privacidade:`<h1 class="d2">Privacidade</h1><p class="apoio mt8">Como a gente trata seus dados (LGPD).</p>
     ${[['O que coletamos','Nome, e-mail, data de nascimento e histórico de compras. Criadores: também documento, selfie de verificação e chave Pix.'],['Pra quê','Liberar acesso ao que você comprou, pagar criadores, prevenir fraude e cumprir a lei.'],['Discrição','No extrato e no Pix aparece só “clozzy”. Não mostramos para ninguém o que você compra.'],['Seus direitos','Você pode baixar ou apagar seus dados em Conta → Privacidade e dados.']].map(([h,p])=>`<h2 class="h4 mt32">${h}</h2><p class="mt8" style="max-width:68ch">${p}</p>`).join('')}`,
   '18':`<h1 class="d2">Aviso 18+</h1><p class="mt16" style="max-width:68ch;font-size:18px">O clozzy tem conteúdo adulto. Ao entrar, você confirma que tem 18 anos ou mais e que esse tipo de conteúdo é permitido onde você está.</p><p class="mt16 apoio" style="max-width:68ch">Criadores são verificados com documento e selfie. Conteúdo com menores, sem consentimento ou ilegal é removido e denunciado às autoridades.</p>`,
   ajuda:`<h1 class="d2">Ajuda</h1><p class="apoio mt8">As perguntas que mais chegam.</p><div class="faq mt24">${FAQ.map(faqItem).join('')}</div><div class="card mt32 between" style="flex-wrap:wrap"><div><b class="h4">Não achou?</b><p class="apoio small mt8">Responde em até 1 dia útil.</p></div><button class="btn" data-act="toast" data-v="Mensagem enviada para ajuda@clozzy.com">Falar com a gente</button></div>`,
   denuncia:`<h1 class="d2">Denúncia e DMCA</h1><p class="apoio mt8" style="max-width:60ch">Viu algo ilegal, sem consentimento, ou um conteúdo seu publicado por outra pessoa? Conta pra gente. A análise começa em até 24 h.</p>
     <form class="stack mt32" style="--gap:16px;max-width:560px" data-form="denuncia">
       <div class="field"><label>Motivo</label><select class="input" required><option value="">Escolha</option><option>Conteúdo com menor de idade</option><option>Sem consentimento</option><option>É meu conteúdo (DMCA)</option><option>Golpe ou perfil falso</option><option>Outro</option></select></div>

       <div class="field"><label>O que aconteceu</label><textarea class="input" required></textarea></div>

       <button class="btn lg" style="justify-self:start">Enviar denúncia</button></form>`
  }[tab]||'';
  return {tema:'branco',noAge:true,html:`${header()}<main data-tema="branco" style="padding:40px 0 96px"><div class="wrap">

     <label class="check"><input type="checkbox" required>Tenho os direitos e o consentimento de todas as pessoas que aparecem no meu conteúdo.</label>
     <label class="check"><input type="checkbox" required>Li e aceito os <a data-go="legal/termos">Termos de criador</a> e a regra de repasse (90% pra mim).</label>
     <button class="btn lg block">Enviar pra análise</button></form>`
  };
  return {tema:'roxo',html:`<div class="onb" data-tema="roxo"><div class="topo">${logo(28)}<button class="iconbtn" data-go="conta" aria-label="Fechar">${ic('x')}</button></div>
    <div class="body"><div class="pbar">${[1,2,3,4].map(i=>`<i class="${i<=p?'on':''}"></i>`).join('')}</div>
    ${p>1?`<button class="row link" style="text-decoration:none;gap:6px;margin-bottom:16px" data-act="onbBack">${ic('left','style="width:18px;height:18px"')}Voltar</button>`:''}
    ${passos[p]}</div></div>`};
};

/* ---------- age gate / modal / toast ---------- */
function ageGate(){
  if($('#age'))return;
  const el=document.createElement('div');el.className='ov';el.id='age';
  el.innerHTML=`<div class="modal age" data-tema="preto">${sym(64).replace('class="sym"','class="sym" style="margin:0 auto"')}<h2 class="d3 mt24">Aqui é só pra maiores de 18.</h2><p class="apoio mt12">O clozzy tem conteúdo adulto. Confirma que você tem 18 anos ou mais pra continuar.</p>
    <button class="btn lg block mt32" data-act="age18">Tenho 18 anos ou mais</button><button class="btn lg block sec mt12" data-act="ageNo">Sair</button>
    <p class="xs apoio mt16">Ao entrar, você aceita os <a data-act="ageLegal">Termos</a>.</p></div>`;
  document.body.appendChild(el);
}
function openModal(tema,html){
  closeModal();const el=document.createElement('div');el.className='ov';el.id='modal';
  el.innerHTML=`<div class="modal" data-tema="${tema}"><button class="iconbtn x" data-act="closeModal">${ic('x')}</button>${html}</div>`;
  el.addEventListener('click',e=>{if(e.target===el)closeModal()});
  document.body.appendChild(el);
}
function closeModal(){$('#modal')?.remove()}
function toast(t){$('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.innerHTML=ic('check')+esc(t);document.body.appendChild(el);setTimeout(()=>el.remove(),2400)}

/* ---------- ferramenta do protótipo ---------- */
let ptOpen=false;
function protoTool(){
  const who=!S.user?'v':S.user.role==='criador'?'c':'f';
  const L=[['Público',[['P01','','Landing'],['P02','explorar','Explorar'],['P03','c/laramendes','Perfil do criador'],['P08','entrar','Entrar'],['P08','cadastro','Criar conta'],['P08','recuperar','Recuperar senha'],['P14','legal/termos','Legal e ajuda']]],
           ['Fã',[['P04','checkout/laramendes-p0','Checkout Pix'],['—','liberado/laramendes-p0','Pagamento aprovado'],['P05','acesso/melsantos-close','Acesso ao conteúdo'],['P06','biblioteca','Biblioteca'],['P07','conta','Conta'],['P15','abrir-close','Abrir meu close']]],
           ['Criadora',[['P09','painel','Visão geral'],['P10','painel/perfil','Perfil público'],['P11','painel/ofertas','Ofertas'],['P12','painel/conteudos','Conteúdos'],['P13','painel/financeiro','Financeiro']]]];
  return `<button class="pt-btn" data-act="pt">${ic('grid')}Telas</button>
  <div class="pt ${ptOpen?'open':''}" id="pt"><h6>Entrar como</h6><div class="who"><button class="${who==='v'?'on':''}" data-act="como" data-v="v">Visitante</button><button class="${who==='f'?'on':''}" data-act="como" data-v="f">Fã · Rafa</button><button class="${who==='c'?'on':''}" data-act="como" data-v="c">Criadora</button></div>
   ${L.map(([g,ls])=>`<h6>${g}</h6>${ls.map(([c,h,l])=>`<a data-go="${h}" data-pt="1"><code>${c}</code>${l}</a>`).join('')}`).join('')}
   <h6>Estado</h6><div class="tools"><button data-act="ageReset">Mostrar 18+ de novo</button><button data-act="reset">Resetar protótipo</button></div></div>`;
}

/* ---------- ações (delegação) ---------- */
const ACT={
  burger(){$('#mnav').classList.toggle('open')},
  cat(a){filtro.cat=a.dataset.v;route.keepScroll=true;render()},
  ptab(a){ptab=a.dataset.v;route.keepScroll=true;render()},
  btab(a){btab=a.dataset.v;route.keepScroll=true;render()},
  share(){toast('Link do perfil copiado')},
  copiar(a){navigator.clipboard?.writeText(a.dataset.v).catch(()=>{});toast('Código Pix copiado')},
  pix(a){const v=a.dataset.v;pix.status=v;if(v==='confirmado'){const id=pix.id;const o=OFERTAS[id];S.compras=S.compras.filter(x=>x.id!==id);S.compras.unshift({id,status:'ativa',data:'hoje',renova:o.tipo==='assinatura'?'11/12':undefined});save();go('liberado/'+id)}else render()},
  novoPix(){pix={id:pix.id,status:'aguardando',fim:Date.now()+15*60e3};render()},
  ver(a){viewer(window._viewer,+a.dataset.i)},
  nav(a){viewer(window._viewer,+a.dataset.v)},
  fechaViewer(){$('.viewer')?.remove()},
  cancelar(a){const o=OFERTAS[a.dataset.v];openModal('preto',`<h2 class="d3">Cancelar o close?</h2><p class="apoio mt12">Você continua vendo tudo de ${CR(o.nick).nome.split(' ')[0]} até 12/12. Depois disso, o acesso fecha.</p><div class="row mt32" style="gap:10px;flex-wrap:wrap"><button class="btn" data-act="closeModal">Manter close</button><button class="btn sec" data-act="cancelarOk" data-v="${o.id}">Cancelar mesmo</button></div>`)},
  cancelarOk(a){const c=S.compras.find(x=>x.id===a.dataset.v);c.status='cancelada';save();closeModal();route.keepScroll=true;render();toast('Close cancelado')},
  notif(a){S.notif[a.dataset.v]=a.checked;save();toast('Preferência salva')},
  sair(){S.user=null;save();go('');toast('Você saiu')},
  confirmou(a){S.user={...LOGINS.fan,nome:S._pend?.nome||'Rafa Lima',email:S._pend?.email||'rafa@email.com'};save();go(a.dataset.v||'explorar');toast('Conta criada')},
  publicar(a){S.painel.publicado=a.checked;save();route.keepScroll=true;render();toast(a.checked?'Perfil publicado':'Perfil fora do ar')},
  pausar(a){const id=a.dataset.v;S.painel.ofertaStatus[id]=(S.painel.ofertaStatus[id]||'ativa')==='ativa'?'pausada':'ativa';save();route.keepScroll=true;render();toast(S.painel.ofertaStatus[id]==='ativa'?'Oferta ativa':'Oferta pausada')},
  novaOferta(a){modalOferta(a.dataset.v)},
  vis(a){const [id,v]=a.dataset.v.split('|');S.painel.conteudos.find(x=>x.id===id).vis=v;save();route.keepScroll=true;render()},
  arquivar(a){S.painel.conteudos=S.painel.conteudos.filter(x=>x.id!==a.dataset.v);save();route.keepScroll=true;render();toast('Mídia arquivada')},
  upload(){const b=$('#up');b.classList.remove('hidden');let p=0;const t=setInterval(()=>{p+=8;b.firstElementChild.style.width=Math.min(p,100)+'%';if(p>=100){clearInterval(t);const n=S.painel.conteudos.length;S.painel.conteudos.unshift({id:'u'+Date.now(),m:{f:['cetim','costas','labios'][n%3],x:(n*31)%100,y:(n*17)%100,z:160},titulo:'Novo upload',tipo:'foto',vis:'pago',ofertas:['laramendes-p0']});save();route.keepScroll=true;render();toast('3 fotos enviadas · marca d’água aplicada')}},90)},
  saque(){const P=S.painel;openModal('branco',`<h2 class="d3">Sacar no Pix</h2><p class="apoio mt8">Disponível: ${brl(P.saldo)}</p><form class="stack mt24" style="--gap:16px" data-form="saque"><div class="field"><label>Valor</label><div class="prefix"><span>R$</span><input class="input" name="v" value="${P.saldo.toFixed(2).replace('.',',')}" required></div></div><div class="field"><label>Chave Pix</label><input class="input" value="***.482.***-10 (CPF)" disabled></div><button class="btn lg block">${ic('pix')}Confirmar saque</button><p class="apoio xs center">Cai em até 1 dia útil.</p></form>`)},
  aprovar(){S.user.criador='ativo';S.user.role='criador';save();go('painel');toast('Seu close abriu')},
  precoSug(a){onb.preco=a.dataset.v;$('#preco').value=a.dataset.v;$$('[data-act=precoSug]').forEach(x=>x.classList.toggle('on',x===a))},
  onbUp(a){onb[a.dataset.v]=true;route.keepScroll=true;render()},
  onbNext(){onb.passo++;render()},
  onbBack(){onb.passo--;render()},
  age18(){S.ageOk=true;save();$('#age')?.remove()},
  ageNo(){$('#age .modal').innerHTML=`<h2 class="d3">Tudo bem.</h2><p class="apoio mt12">Volte quando tiver 18 anos.</p>`},
  ageLegal(){S.ageOk=true;save();$('#age')?.remove();go('legal/18')},
  closeModal(){closeModal()},
  toast(a){toast(a.dataset.v)},
  pt(){ptOpen=!ptOpen;$('#pt').classList.toggle('open',ptOpen)},
  como(a){const v=a.dataset.v;S.user=v==='v'?null:{...LOGINS[v==='f'?'fan':'criador']};S.ageOk=true;save();$('#age')?.remove();render()},
  ageReset(){S.ageOk=false;save();render()},
  reset(){localStorage.removeItem(KEY);location.hash='#/';location.reload()}
};
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  if(a&&ACT[a.dataset.act]){if(a.tagName!=='INPUT')e.preventDefault();ACT[a.dataset.act](a);return}
  const g=e.target.closest('[data-go]');
  if(g){e.preventDefault();$('.viewer')?.remove();closeModal();$('#mnav')?.classList.remove('open');if(!g.dataset.pt){ptOpen=false}go(g.dataset.go)}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  const k=f.dataset.form;const d=Object.fromEntries(new FormData(f));
  if(k==='entrar'){S.user={...LOGINS[d.email?.startsWith('lara')?'criador':'fan'],email:d.email};save();go(d.next||'explorar');toast('Bem-vindo de volta')}
  else if(k==='cadastro'){S._pend={nome:d.nome,email:d.email};save();go('confirmar?e='+encodeURIComponent(d.email)+(d.next?'&next='+encodeURIComponent(d.next):''))}
  else if(k==='recuperar'){f.outerHTML=`<div class="card mt32"><b class="h4">Link enviado.</b><p class="apoio mt8">Se tiver conta com esse e-mail, o link chega em alguns minutos. Vale por 1 hora.</p></div><p class="center small mt16"><a data-go="entrar">Voltar pra entrar</a></p>`}
  else if(k==='conta'||k==='senha'){toast(k==='conta'?'Dados salvos':'Senha alterada')}
  else if(k==='perfil'){Object.assign(S.painel,{nome:d.nome,nick:d.nick,bio:d.bio,links:d.links});save();toast('Perfil salvo')}
  else if(k==='oferta'){const preco=parseFloat(String(d.preco).replace(',','.'))||0;
    if(d.id){OFERTAS[d.id].titulo=d.titulo;OFERTAS[d.id].preco=preco;const ex=S.painel.extras.find(x=>x.id===d.id);if(ex)Object.assign(ex,{titulo:d.titulo,preco})}
    else{const id='laramendes-x'+Date.now();const base=OFERTAS['laramendes-p0'];const ex={id,tipo:d.tipo,titulo:d.titulo,preco,seed:S.painel.extras.length*7+3};S.painel.extras.push(ex);addExtra(ex)}
    save();closeModal();go('painel/ofertas');toast(d.id?'Oferta salva':'Oferta publicada no seu perfil')}
  else if(k==='saque'){const v=parseFloat(String(d.v).replace(/\./g,'').replace(',','.'))||0;if(v<20||v>S.painel.saldo){toast('Valor entre R$ 20,00 e o saldo');return}
    S.painel.saldo=+(S.painel.saldo-v).toFixed(2);S.painel.saques.unshift({data:'hoje',valor:v,status:'Processando'});save();closeModal();route.keepScroll=true;render();toast('Saque pedido · cai em até 1 dia útil')}
  else if(k==='denuncia'){f.outerHTML=`<div class="card mt32"><b class="h4">Recebido.</b><p class="apoio mt8">Protocolo #CZ-48213. A gente responde por e-mail em até 24 h.</p></div>`}
  else if(k==='onb1'){onb.nick=d.nick;onb.preco=d.preco;onb.passo=2;render()}
  else if(k==='onb2'){onb.passo=3;render()}
  else if(k==='onb4'){S.user.criador='analise';save();onb.passo=1;render()}
});
/* tooltip do gráfico */
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');const tip=$('#tip');const ch=$('#chart');
  $$('.chart rect.bar.on').forEach(b=>b.classList.remove('on'));
  if(!t){tip.style.display='none';ch&&ch.classList.remove('hovering');return}
  tip.innerHTML=t.dataset.tip;tip.style.display='block';const r=t.nextElementSibling.getBoundingClientRect();tip.style.left=(r.left+r.width/2)+'px';tip.style.top=r.top+'px';
  t.nextElementSibling.classList.add('on');ch&&ch.classList.add('hovering')});

/* restaura saques/ofertas extras criados no localStorage */
function addExtra(ex){const base=OFERTAS['laramendes-p0'];OF({...base,...ex,inclui:['6 fotos','Acesso pra sempre na biblioteca'],fotos:6,videos:0,media:tiles(['cetim','costas'],6,ex.seed)});CR('laramendes').ofertas.push(OFERTAS[ex.id])}
S.painel.extras=S.painel.extras.filter(x=>typeof x==='object');S.painel.extras.forEach(addExtra);
render();
</script>
