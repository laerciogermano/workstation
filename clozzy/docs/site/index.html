<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clozzy</title>
<meta name="description" content="Clozzy — site onde influencers vendem conteúdo exclusivo e fãs compram e acessam num só lugar.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Gabarito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --ink: #fff;
    --muted: #a3a3a3;
    --pink: #E0005A;
    --line: #2a2a2a;
    --f-d: "Gabarito", system-ui, sans-serif;
    --f-b: "Figtree", system-ui, sans-serif;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(900px 480px at 12% -8%, rgba(224, 0, 90, 0.22), transparent 55%),
      radial-gradient(700px 420px at 100% 0%, rgba(124, 72, 196, 0.14), transparent 50%),
      var(--bg);
    color: var(--ink);
    font-family: var(--f-b);
    font-size: 1.05rem;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    padding: 2.5rem 1.25rem;
  }
  ::selection { background: var(--pink); color: #fff; }
  :focus-visible { outline: 2px solid var(--pink); outline-offset: 3px; }
  main {
    width: min(38rem, 100%);
    display: flex;
    flex-direction: column;
    gap: 1.75rem;
  }
  .logo {
    width: min(220px, 72vw);
    height: auto;
    display: block;
  }
  h1 {
    font-family: var(--f-d);
    font-weight: 900;
    font-size: clamp(2.6rem, 8vw, 3.6rem);
    letter-spacing: -0.045em;
    line-height: 0.92;
  }
  h1 span { color: var(--pink); }
  .desc {
    color: var(--muted);
    font-size: 1.05rem;
    max-width: 34ch;
  }
  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 0.65rem;
    margin-top: 0.25rem;
  }
  a.btn {
    display: inline-flex;
    align-items: center;
    height: 44px;
    padding: 0 1.2rem;
    border-radius: 999px;
    font-family: var(--f-b);
    font-weight: 700;
    font-size: 0.92rem;
    text-decoration: none;
    transition: transform 160ms var(--ease), background 160ms var(--ease);
  }
  a.btn:active { transform: scale(0.96); }
  a.btn.p { background: var(--pink); color: #fff; }
  a.btn.s {
    color: var(--ink);
    box-shadow: inset 0 0 0 1px var(--line);
  }
  a.btn.s:hover { box-shadow: inset 0 0 0 1px #555; }
  footer {
    margin-top: 1.5rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--line);
    font-size: 0.78rem;
    color: #666;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.svg" width="220" height="67" alt="Clozzy">
  <h1>conteúdo exclusivo, <span>direto</span></h1>
  <p class="desc">Site onde influencers vendem conteúdo exclusivo e fãs compram e acessam num só lugar — vitrine, Pix e biblioteca.</p>
  <div class="links">
    <a class="btn p" href="prototipo/">Protótipo</a>
    <a class="btn s" href="marca/">Manual da marca</a>
  </div>
  <footer>clozzy.laerciogermano.com</footer>
</main>
</body>
</html>
