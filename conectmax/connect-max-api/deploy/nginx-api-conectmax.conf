# https://connect-max-api.laerciogermano.com → Connect Max API em 127.0.0.1:4182
# Deploy: se o cert LE já existir, este arquivo já traz 443; senão rode certbot depois.
server {
  listen 80;
  listen [::]:80;
  server_name connect-max-api.laerciogermano.com;
  location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name connect-max-api.laerciogermano.com;

  ssl_certificate /etc/letsencrypt/live/connect-max-api.laerciogermano.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/connect-max-api.laerciogermano.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location / {
    proxy_pass http://127.0.0.1:4182;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
