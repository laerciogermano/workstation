name: confraternizacao
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: confrat
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      POSTGRES_DB: confrat
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confrat -d confrat"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  db-data:
