# Contabo: /etc/nginx/sites-available/confraternizacao
# App (Nest + SPA) em / · protótipo estático em /prototipo/
# Certbot: manter blocos ssl / redirect HTTP.

server {
    server_name confraternizacao.laerciogermano.com;

    client_max_body_size 1m;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

    # Protótipo HTML (index + v1/v2/v3) — root + URI = /opt/confraternizacao/prototipo/…
    location ^~ /prototipo/ {
        root /opt/confraternizacao;
        index index.html;
        try_files $uri $uri/ /prototipo/index.html;
    }

    location = /prototipo {
        return 301 /prototipo/;
    }

    # App: API + SPA no mesmo processo Node
    location / {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/confraternizacao.laerciogermano.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/confraternizacao.laerciogermano.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = confraternizacao.laerciogermano.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name confraternizacao.laerciogermano.com;
    return 404; # managed by Certbot
}
