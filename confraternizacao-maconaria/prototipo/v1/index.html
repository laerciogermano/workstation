<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confraternização 125 anos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
/* Layout: app de celular em moldura no desktop, tela cheia no celular. Bordô do GOP como cor de marca, ardósia como tinta. */
:root {
  --brand: #740012;
  --brand-deep: #4b000c;
  --ink: #1d2939;
  --body: #475467;
  --muted: #667085;
  --line: #d9dfe8;
  --paper: #ffffff;
  --surface: #f2f4f7;
  --stage: #e9ecf1;
  --on-brand: #ffffff;
  --ok: #168b41;
  --ok-bg: #e7f4ec;
  --park: #dfe9dc;
  --road: #ffffff;
  --map: #eef0f3;
  --radius: 10px;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Newsreader", Georgia, serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brand: #a3283c; --brand-deep: #5c0a18; --ink: #eef0f3; --body: #c3c9d3; --muted: #98a2b3;
    --line: #2c3442; --paper: #161b24; --surface: #1f2632; --stage: #0d1118; --on-brand: #ffffff;
    --ok: #4cc27a; --ok-bg: #16301f; --park: #1d2a22; --road: #2b3340; --map: #1a202a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --brand: #a3283c; --brand-deep: #5c0a18; --ink: #eef0f3; --body: #c3c9d3; --muted: #98a2b3;
  --line: #2c3442; --paper: #161b24; --surface: #1f2632; --stage: #0d1118; --on-brand: #ffffff;
  --ok: #4cc27a; --ok-bg: #16301f; --park: #1d2a22; --road: #2b3340; --map: #1a202a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--stage);
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 17px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  display: flex; align-items: center; justify-content: center; gap: 48px;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.num { font-variant-numeric: tabular-nums; }

/* palco do desktop */
.side { max-width: 300px; display: flex; flex-direction: column; gap: 16px; }
.side h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.side p { font-family: var(--font-body); color: var(--body); margin: 0; font-size: 18px; }
.side .tag { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
.jump { display: flex; flex-wrap: wrap; gap: 8px; }
.jump button { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 12px; font-size: 14px; }
.jump button:hover { border-color: var(--ink); }

.phone {
  width: 390px; max-width: 100%; height: min(844px, calc(100% - 48px));
  background: var(--surface); border-radius: 44px; overflow: hidden; position: relative;
  box-shadow: 0 0 0 10px #10141b, 0 30px 60px -20px rgba(16,20,27,.45);
  display: flex; flex-direction: column;
}
@media (max-width: 760px) {
  body { display: block; }
  .side { display: none; }
  .phone { width: 100%; height: 100%; border-radius: 0; box-shadow: none; }
}

/* barra superior */
.topbar {
  background: var(--brand); color: var(--on-brand);
  padding: 14px 16px; display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; flex: none;
}
.phone:not(.mobile) .topbar { padding-top: 22px; }
.round {
  width: 48px; height: 48px; border-radius: 50%; border: 0; background: rgba(255,255,255,.14); color: var(--on-brand);
  display: grid; place-items: center;
}
.round:hover { background: rgba(255,255,255,.24); }
.round svg { width: 22px; height: 22px; }
.mark { justify-self: center; display: flex; align-items: center; gap: 10px; }
.mark .seal {
  width: 36px; height: 36px; border: 1.5px solid rgba(255,255,255,.75); border-radius: 50%;
  display: grid; place-items: center; font-weight: 800; font-size: 13px; letter-spacing: -0.02em;
}
.mark .words { font-size: 12px; line-height: 1.15; font-weight: 600; letter-spacing: .02em; }
.mark .words b { display: block; font-size: 15px; font-weight: 800; letter-spacing: -0.01em; }
.avatar {
  width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: var(--brand-deep); color: #fff; font-weight: 700; font-size: 16px; border: 0;
}
.topbar .avatar { border: 2px solid rgba(255,255,255,.6); }

.view { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
.pad { padding: 20px 16px 28px; display: flex; flex-direction: column; gap: 22px; }

/* tab bar */
.tabs {
  flex: none; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--paper);
  border-top: 1px solid var(--line); padding: 8px 8px 18px;
}
.tabs button {
  border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-size: 13px; color: var(--muted); padding: 6px 0; position: relative; min-height: 56px;
}
.tabs button svg { width: 24px; height: 24px; }
.tabs button .ic { padding: 4px 18px; border-radius: 999px; transition: background .16s var(--ease); }
.tabs button[aria-current="page"] { color: var(--brand); font-weight: 700; }
.tabs button[aria-current="page"] .ic { background: color-mix(in srgb, var(--brand) 12%, transparent); }
.badge {
  position: absolute; top: 2px; left: calc(50% + 8px); background: var(--brand); color: #fff;
  font-size: 11px; font-weight: 700; min-width: 20px; height: 20px; border-radius: 10px; display: grid; place-items: center; padding: 0 5px;
}

/* seção */
.sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec-title h2 { font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink); }
.sec-title span { font-size: 14px; color: var(--muted); }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); }

/* mapa */
.map { position: relative; overflow: hidden; }
.map svg.city { display: block; width: 100%; height: auto; }
.pin {
  position: absolute; transform: translate(-50%, -100%); border: 0; background: none; padding: 0;
  display: flex; flex-direction: column; align-items: center;
}
.pin .dot {
  background: var(--brand); color: #fff; border: 2px solid #fff; border-radius: 8px; padding: 3px 7px;
  font-size: 12px; font-weight: 700; white-space: nowrap; box-shadow: 0 2px 6px rgba(16,20,27,.25);
}
.pin .stem { width: 2px; height: 8px; background: var(--brand); }
.pin.mine .dot { background: var(--ink); }
.pin.mine .stem { background: var(--ink); }
.pin:hover .dot, .pin:focus-visible .dot { transform: scale(1.06); }
.map-legend { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
.map-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* boas-vindas */
.hello { padding: 18px; display: flex; gap: 14px; align-items: center; }
.hello h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
.hello p { margin: 4px 0 0; font-family: var(--font-body); font-size: 17px; color: var(--body); line-height: 1.4; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 18px 18px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border-radius: 999px;
  padding: 7px 12px; font-size: 14px; font-weight: 600;
}
.chip svg { width: 16px; height: 16px; color: var(--brand); }

/* calendário */
.days { display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px; gap: 6px; }
.day {
  border: 0; background: none; border-radius: 8px; padding: 10px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  min-height: 72px;
}
.day .wd { font-size: 13px; color: var(--muted); font-weight: 600; }
.day .dn { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
.day .ct { font-size: 12px; color: var(--muted); }
.day:hover { background: var(--surface); }
.day[aria-pressed="true"] { background: var(--brand); color: #fff; }
.day[aria-pressed="true"] .wd, .day[aria-pressed="true"] .ct { color: rgba(255,255,255,.8); }
.month { display: flex; justify-content: space-between; padding: 12px 16px 4px; font-size: 15px; font-weight: 700; }
.month span { color: var(--muted); font-weight: 500; font-size: 14px; }

/* lista de eventos */
.list { display: flex; flex-direction: column; }
.ev {
  display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; text-align: left;
  border: 0; background: none; padding: 14px 16px; border-top: 1px solid var(--line); width: 100%;
}
.ev:first-child { border-top: 0; }
.ev:hover { background: var(--surface); }
.ev .time { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
.ev .time small { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 4px; letter-spacing: 0; }
.ev h3 { font-size: 17px; font-weight: 700; line-height: 1.25; }
.ev .meta { font-size: 14px; color: var(--body); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.ev .meta span { display: inline-flex; align-items: center; gap: 4px; }
.ev .meta svg { width: 15px; height: 15px; color: var(--muted); }
.ev > svg { width: 20px; height: 20px; color: var(--muted); }
.status { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 4px; }
.status.in { background: var(--ok-bg); color: var(--ok); }
.status.full { background: var(--surface); color: var(--muted); }
.status svg { width: 13px; height: 13px; }
.bar { height: 4px; background: var(--surface); border-radius: 2px; overflow: hidden; margin-top: 8px; max-width: 180px; }
.bar i { display: block; height: 100%; background: var(--brand); border-radius: 2px; }

/* detalhe */
.hero { background: var(--brand-deep); color: #fff; padding: 22px 18px 24px; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden; }
.hero::after {
  content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,.12); box-shadow: 0 0 0 26px rgba(255,255,255,.03), 0 0 0 52px rgba(255,255,255,.025);
}
.hero .row { display: flex; gap: 10px; align-items: center; font-size: 14px; font-weight: 600; }
.hero .label { background: #fff; color: var(--brand-deep); font-size: 12px; font-weight: 800; letter-spacing: .1em; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; }
.hero h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.08; text-transform: uppercase; }
.info { padding: 4px 16px; }
.info .it { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.info .it:first-child { border-top: 0; }
.info .ico { width: 44px; height: 44px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; }
.info .ico svg { width: 20px; height: 20px; color: var(--brand); }
.info small { display: block; font-size: 13px; color: var(--muted); }
.info b { font-weight: 600; font-size: 16px; }
.prose { font-family: var(--font-body); font-size: 18px; line-height: 1.55; color: var(--body); margin: 0; }

.btn {
  min-height: 54px; border-radius: var(--radius); border: 0; font-weight: 700; font-size: 17px; padding: 0 20px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
  transition: background .16s var(--ease), transform .12s var(--ease);
}
.btn:active { transform: scale(.98); }
.btn svg { width: 20px; height: 20px; }
.btn.primary { background: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-deep); }
.btn.ghost { background: var(--paper); border: 1.5px solid var(--line); color: var(--ink); }
.btn.ghost:hover { border-color: var(--ink); }
.btn.done { background: var(--ok-bg); color: var(--ok); }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sticky { position: sticky; bottom: 0; background: linear-gradient(to top, var(--surface) 70%, transparent); padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 10px; }

/* pessoas */
.person { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
.person:first-child { border-top: 0; }
.person .avatar { width: 44px; height: 44px; font-size: 15px; }
.person b { display: block; font-size: 16px; font-weight: 700; }
.person small { color: var(--muted); font-size: 14px; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); display: grid; place-items: center; color: var(--brand); }
.icon-btn:hover { border-color: var(--brand); }
.icon-btn svg { width: 20px; height: 20px; }

.av-1 { background: #5b6b84; } .av-2 { background: #7a5c3e; } .av-3 { background: #3f6f5a; } .av-4 { background: #6a4b7a; }
.av-5 { background: #8a3b2e; } .av-6 { background: #2f5d7c; } .av-0 { background: var(--brand-deep); }

/* segmentado */
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px; }
.seg button { border: 0; background: none; min-height: 44px; border-radius: 7px; font-weight: 600; font-size: 15px; color: var(--body); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* chat */
.thread { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; border: 0; border-top: 1px solid var(--line); background: none; width: 100%; text-align: left; }
.thread:first-child { border-top: 0; }
.thread:hover { background: var(--surface); }
.thread .gico { width: 52px; height: 52px; border-radius: 12px; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 13px; line-height: 1.05; text-align: center; }
.thread .avatar { width: 52px; height: 52px; }
.thread b { display: block; font-size: 16px; font-weight: 700; line-height: 1.25; }
.thread p { margin: 2px 0 0; font-size: 14px; color: var(--body); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.thread .when { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.thread .unread { background: var(--brand); color: #fff; font-size: 12px; font-weight: 700; min-width: 22px; height: 22px; border-radius: 11px; display: grid; place-items: center; padding: 0 6px; }
.locked { display: flex; gap: 12px; padding: 14px 16px; font-size: 15px; color: var(--body); align-items: center; }
.locked svg { width: 20px; height: 20px; color: var(--muted); flex: none; }

.convo { display: flex; flex-direction: column; height: 100%; }
.convo-head { background: var(--paper); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 12px; align-items: center; }
.convo-head b { display: block; font-size: 16px; }
.convo-head small { color: var(--muted); font-size: 13px; }
.msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 82%; display: flex; flex-direction: column; gap: 3px; }
.msg .who { font-size: 13px; font-weight: 700; color: var(--brand); }
.msg .bubble { background: var(--paper); border: 1px solid var(--line); padding: 10px 13px; border-radius: 14px 14px 14px 4px; font-size: 16px; line-height: 1.4; }
.msg .at { font-size: 12px; color: var(--muted); }
.msg.me { align-self: flex-end; align-items: flex-end; }
.msg.me .bubble { background: var(--brand); color: #fff; border-color: var(--brand); border-radius: 14px 14px 4px 14px; }
.daymark { align-self: center; font-size: 12px; font-weight: 700; color: var(--muted); background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
.composer { display: grid; grid-template-columns: 1fr 52px; gap: 8px; padding: 10px 12px 14px; background: var(--paper); border-top: 1px solid var(--line); }
.composer input { min-height: 52px; border: 1.5px solid var(--line); border-radius: 26px; padding: 0 18px; background: var(--surface); font-size: 16px; }
.composer input:focus { outline: none; border-color: var(--brand); }
.composer button { width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--brand); color: #fff; display: grid; place-items: center; }
.composer button svg { width: 22px; height: 22px; }

/* formulários */
.form { display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 14px; font-weight: 700; }
.field input, .field select, .field textarea {
  min-height: 52px; border: 1.5px solid var(--line); border-radius: var(--radius); padding: 12px 14px; background: var(--paper); font-size: 17px; width: 100%;
}
.field textarea { min-height: 96px; resize: vertical; font-family: var(--font-body); font-size: 17px; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }
.field .hint { font-size: 13px; color: var(--muted); }
.field .err { font-size: 14px; color: var(--brand); font-weight: 600; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* entrada */
.auth { background: var(--brand-deep); color: #fff; min-height: 100%; display: flex; flex-direction: column; }
.auth-top { padding: 56px 24px 28px; display: flex; flex-direction: column; gap: 18px; position: relative; overflow: hidden; }
.auth-top::after {
  content: ""; position: absolute; right: -80px; top: -40px; width: 260px; height: 260px; border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,.12); box-shadow: 0 0 0 30px rgba(255,255,255,.035), 0 0 0 60px rgba(255,255,255,.025);
}
.auth-top .big { font-size: 64px; font-weight: 800; letter-spacing: -0.04em; line-height: .9; }
.auth-top .big span { display: block; font-size: 20px; letter-spacing: 0; font-weight: 600; margin-top: 8px; }
.auth-top p { margin: 0; font-family: var(--font-body); font-size: 18px; color: rgba(255,255,255,.82); max-width: 30ch; }
.auth-card { background: var(--surface); color: var(--ink); border-radius: 22px 22px 0 0; padding: 24px 18px 28px; flex: 1; display: flex; flex-direction: column; gap: 18px; }
.auth-card h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
.link { background: none; border: 0; color: var(--brand); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1.5px; padding: 8px 0; font-size: 16px; }

/* gaveta e folha */
.scrim { position: absolute; inset: 0; background: rgba(10,12,16,.45); z-index: 20; opacity: 0; pointer-events: none; transition: opacity .2s var(--ease); }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: absolute; top: 0; bottom: 0; left: 0; width: 82%; background: var(--paper); z-index: 21;
  transform: translateX(-102%); transition: transform .28s var(--ease); display: flex; flex-direction: column;
}
.drawer.open { transform: none; }
.drawer-head { background: var(--brand); color: #fff; padding: 40px 20px 22px; display: flex; flex-direction: column; gap: 12px; }
.drawer-head b { font-size: 20px; font-weight: 800; }
.drawer-head small { font-size: 14px; opacity: .85; }
.nav { padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.nav button {
  display: flex; align-items: center; gap: 14px; border: 0; background: none; padding: 0 14px; min-height: 56px; border-radius: 10px; font-size: 17px; font-weight: 600; text-align: left;
}
.nav button svg { width: 22px; height: 22px; color: var(--muted); }
.nav button:hover { background: var(--surface); }
.nav button[aria-current="page"] { background: color-mix(in srgb, var(--brand) 10%, transparent); color: var(--brand); }
.nav button[aria-current="page"] svg { color: var(--brand); }
.nav .divider { height: 1px; background: var(--line); margin: 8px 14px; }
.nav .group { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 10px 14px 4px; }
.drawer-foot { margin-top: auto; padding: 16px 24px 24px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }

.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; background: var(--paper); z-index: 21; border-radius: 22px 22px 0 0;
  transform: translateY(102%); transition: transform .28s var(--ease); padding: 10px 10px 24px;
}
.sheet.open { transform: none; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.sheet .who { display: flex; gap: 14px; align-items: center; padding: 6px 14px 14px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.sheet .who b { display: block; font-size: 18px; font-weight: 800; }

function shell(cur, body, left = "menu") {

function scrChat() {
  const groups = EVENTS.filter(e => state.enrolled.has(e.id));

  const g = state.chatTab === "grupos";
  return shell("chat", `<div class="pad">
    <div class="page-head"><h1>Chat</h1></div>
    <div class="seg" role="group" aria-label="Tipo de conversa">
      <button data-tab="grupos" aria-pressed="${g}">Grupos dos eventos</button><button data-tab="privadas" aria-pressed="${!g}">Conversas privadas</button>
    </div>
    ${g ? `<div class="card">${groups.map(e => {
        const m = (GROUP_MSGS[e.id] || []).slice(-1)[0], un = state.groupReads[e.id] || 0;

          <div><b>${esc(e.title)}</b><p>${m ? `${esc(m.who.replace(/^(Ir\.|Bro\.)\s*/, "").split(" ")[0])}: ${esc(m.text)}` : "Grupo criado. Diga olá."}</p></div>
          <div class="when"><span class="num">${m ? m.at : ""}</span>${un ? `<span class="unread num">${un}</span>` : ""}</div></button>`;
      }).join("") || `<div class="empty">Inscreva-se em um evento para entrar no grupo dele.</div>`}
      ${locked ? `<div class="locked" style="border-top:1px solid var(--line)">${icon("lock")}<span><b class="num">${locked}</b> grupos ficam disponíveis quando você se inscreve no evento.</span></div>` : ""}</div>`
    : `<div class="card">${DMS.map(d => {
        const u = person(d.with), m = d.msgs.slice(-1)[0];
        return `<button class="thread" data-go="conversa-${d.id}"><div class="avatar av-${u.av}">${initials(u.name)}</div>
          <div><b>${esc(u.name)}</b><p>${m.me ? "Você: " : ""}${esc(m.text)}</p></div>

      }).join("")}</div>

function convo(title, sub, back, msgs, kind, id) {
  return topbar(back) + `<main class="view" style="overflow:hidden"><div class="convo">
    <div class="convo-head">${kind === "g" ? `<div class="thread" style="padding:0;border:0;grid-template-columns:52px"><div class="gico num">${sub.split("|")[0]}</div></div>` : `<div class="avatar av-${sub.split("|")[0]}">${initials(title)}</div>`}
      <div><b>${esc(title)}</b><small>${esc(sub.split("|")[1])}</small></div></div>
    <div class="msgs" id="msgs"><span class="daymark">Hoje</span>${msgs.map(m => {
      const me = kind === "g" ? m.who === "me" : m.me;
      return `<div class="msg ${me ? "me" : ""}">${kind === "g" && !me ? `<span class="who">${esc(m.who)}</span>` : ""}<div class="bubble">${esc(m.text)}</div><span class="at num">${m.at}</span></div>`;
    }).join("")}</div>
    <form class="composer" id="composer" data-kind="${kind}" data-id="${id}"><input id="msgInput" placeholder="Escreva uma mensagem" aria-label="Mensagem" autocomplete="off"><button type="submit" aria-label="Enviar">${icon("send")}</button></form>
  </div></main>`;
}
function scrGrupo(id) {
  const e = ev(id);
  if (!state.enrolled.has(id)) return shell("chat", `<div class="pad"><div class="card empty">${icon("lock")}<p>O grupo de “${esc(e.title)}” abre quando você se inscreve no evento.</p><button class="btn primary" data-go="evento-${id}">Ver evento</button></div></div>`, "chat");
  state.groupReads[id] = 0;
  return convo(e.title, `${day(e.day).wd} ${day(e.day).dn}|${fmt(e.conf)} participantes · ${place(e.place).name}`, "chat", GROUP_MSGS[id] || (GROUP_MSGS[id] = []), "g", id);
}
function scrConversa(id) {
  const d = DMS.find(x => x.id === id); d.unread = 0; const u = person(d.with);
  return convo(u.name, `${u.av}|${u.from}`, "chat", d.msgs, "p", id);
}

// ---------- menus ----------
function renderDrawer(cur) {
  const item = (r, i, l) => `<button data-go="${r}" ${cur === r ? 'aria-current="page"' : ""}>${icon(i)}${l}</button>`;
  $("#drawer").innerHTML = `<div class="drawer-head"><div class="mark"><div class="seal">125</div><div class="words">Confraternização<b>Maçônica</b></div></div>
      <div><b>Ir. ${esc(ME.name)}</b><br><small>${esc(ME.loja)}</small></div></div>
    <div class="nav">${item("eventos", "calendar-days", "Eventos")}${item("inscricoes", "ticket", "Inscrições")}${item("chat", "message-circle", "Chat")}
      ${ME.organizer ? `<div class="divider"></div><div class="group">Organização</div>${item("organizacao", "clipboard-list", "Painel")}${item("novo-evento", "calendar-plus", "Novo evento")}${item("novo-local", "map-pin-plus", "Novo local")}` : ""}
    </div><div class="drawer-foot">Curitiba · 22 a 25 de abril de 2027</div>`;
  $("#sheet").innerHTML = `<div class="grab"></div><div class="who"><div class="avatar av-0">${ME.initials}</div><div><b>Ir. ${esc(ME.name)}</b><small>${esc(ME.email)}</small></div></div>
    <div class="nav">${item("perfil", "user-round", "Ver perfil")}${item("editar-perfil", "pencil", "Editar perfil")}${item("senha", "key-round", "Alterar senha")}
      <div class="divider"></div><button data-act="logout">${icon("log-out")}Sair</button></div>`;
}
function closeOverlays() { ["scrim", "drawer", "sheet"].forEach(i => $("#" + i).classList.remove("open")); }

// ---------- render ----------
function render() {
  closeOverlays();
  let r = route();
  if (!state.logged && r !== "entrar") { state.logged = true; } // atalhos laterais entram direto
  if (state.logged && r === "entrar") state.logged = false;
  const [base, ...rest] = r.split("-"); const arg = rest.join("-");
  const map = {
    entrar: scrAuth, eventos: scrEventos, inscricoes: scrInscricoes, chat: scrChat, perfil: scrPerfil, organizacao: scrOrganizacao, senha: scrSenha,
    evento: () => scrEvento(arg), participantes: () => scrParticipantes(arg), grupo: () => scrGrupo(arg), conversa: () => scrConversa(arg),
    editar: scrEditar, novo: () => arg === "local" ? scrNovoLocal() : scrNovoEvento(),
  };
  $("#app").innerHTML = (map[base] || scrEventos)();
  renderDrawer(base === "evento" ? "eventos" : r);
  lucide.createIcons();
  const m = $("#msgs"); if (m) m.scrollTop = m.scrollHeight;
  const v = $("#view"); if (v && !m) v.scrollTop = 0;
}

// ---------- eventos ----------
document.addEventListener("click", e => {
  const t = e.target.closest("[data-go],[data-act],[data-day],[data-tab]"); if (!t) { if (e.target.id === "scrim") closeOverlays(); return; }
  if (t.dataset.go) { go(t.dataset.go); return; }
  if (t.dataset.day) { state.day = t.dataset.day; render(); return; }
  if (t.dataset.tab) { state.chatTab = t.dataset.tab; render(); return; }
  const a = t.dataset.act;
  if (a === "drawer") { $("#scrim").classList.add("open"); $("#drawer").classList.add("open"); }
  if (a === "sheet") { $("#scrim").classList.add("open"); $("#sheet").classList.add("open"); }
  if (a === "back") go(t.dataset.to);
  if (a === "authmode") { state.authMode = state.authMode === "login" ? "signup" : "login"; render(); }
  if (a === "logout") { state.logged = false; state.authMode = "login"; go("entrar"); }
  if (a === "enroll") { const x = ev(t.dataset.id); state.enrolled.add(x.id); x.conf++; state.groupReads[x.id] = state.groupReads[x.id] || 0; render(); toast("Inscrição confirmada. O grupo do evento foi liberado no Chat."); }
  if (a === "unenroll") { const x = ev(t.dataset.id); state.enrolled.delete(x.id); x.conf--; render(); toast("Inscrição cancelada."); }
  if (a === "dm") {
    const uid = t.dataset.uid; let d = DMS.find(x => x.with === uid);
    if (!d) { d = { id: "p" + (DMS.length + 1), with: uid, unread: 0, msgs: [] }; DMS.unshift(d); }
    go("conversa-" + d.id);
  }
});
document.addEventListener("input", e => {
  if (e.target.dataset.filter === "people") {
    const q = e.target.value.toLowerCase();
    $("#peopleList").innerHTML = PEOPLE.filter(p => (p.name + p.from).toLowerCase().includes(q)).map(personRow).join("") || `<div class="empty">Ninguém encontrado com “${esc(e.target.value)}”.</div>`;
    lucide.createIcons();
  }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target, val = id => ($("#" + id)?.value || "").trim();
  if (f.id === "authForm") {
    const err = $("#authErr");
    if (!/\S+@\S+\.\S+/.test(val("f-email"))) { err.textContent = "Informe um e-mail válido."; return; }
    if (val("f-senha").length < 8) { err.textContent = "A senha precisa ter pelo menos 8 caracteres."; return; }
    if (state.authMode === "signup" && !val("f-nome")) { err.textContent = "Informe seu nome completo."; return; }
    if (state.authMode === "signup") { ME.name = val("f-nome"); ME.short = ME.name.split(" ")[0]; ME.initials = initials(ME.name); ME.email = val("f-email");
      if (val("f-loja")) ME.loja = val("f-loja"); if (val("f-cidade")) ME.oriente = val("f-cidade"); ME.pais = val("f-pais"); if (val("f-cim")) ME.cim = val("f-cim"); }
    state.logged = true; go("eventos");
    if (state.authMode === "signup") toast("Conta criada. Bem-vindo ao evento.");
  }
  if (f.id === "composer") {
    const text = val("msgInput"); if (!text) return;
    const now = new Date().toTimeString().slice(0, 5);
    if (f.dataset.kind === "g") GROUP_MSGS[f.dataset.id].push({ who: "me", at: now, text });
    else DMS.find(x => x.id === f.dataset.id).msgs.push({ me: true, at: now, text });
    render(); $("#msgInput").focus();
  }
  if (f.id === "profileForm") {
    ME.name = val("p-nome"); ME.short = ME.name.split(" ")[0]; ME.initials = initials(ME.name);
    ME.loja = val("p-loja"); ME.oriente = val("p-oriente"); ME.pais = val("p-pais"); ME.email = val("p-email"); ME.phone = val("p-tel");
    go("perfil"); toast("Perfil atualizado.");
  }
  if (f.id === "pwForm") {
    const err = $("#pwErr");
    if (!val("s-atual")) { err.textContent = "Informe a senha atual."; return; }
    if (val("s-nova").length < 8) { err.textContent = "A nova senha precisa ter pelo menos 8 caracteres."; return; }
    if (val("s-nova") !== val("s-conf")) { err.textContent = "As duas senhas novas não são iguais."; return; }
    go("perfil"); toast("Senha alterada.");
  }
  if (f.id === "placeForm") {
    const err = $("#lErr");
    if (!val("l-nome") || !val("l-end")) { err.textContent = "Preencha nome e endereço do local."; return; }
    PLACES.push({ id: "l" + (PLACES.length + 1), name: val("l-nome"), area: val("l-bairro"), addr: val("l-end") + (val("l-bairro") ? ", " + val("l-bairro") : ""),
      cap: parseInt(val("l-cap")) || 100, x: 150 + Math.random() * 120, y: 60 + Math.random() * 90 });
    go("organizacao"); toast("Local cadastrado.");
  }
  if (f.id === "evForm") {
    const err = $("#nErr");
    if (!val("n-titulo")) { err.textContent = "Dê um título ao evento."; return; }
    if (!val("n-hora")) { err.textContent = "Informe o horário."; return; }
    const id = "e" + (EVENTS.length + 1 + Math.floor(Math.random() * 1000));
    const [h, m] = val("n-hora").split(":").map(Number);
    EVENTS.push({ id, day: val("n-dia"), time: val("n-hora"), end: String((h + 2) % 24).padStart(2, "0") + ":" + String(m).padStart(2, "0"),
      title: val("n-titulo"), place: val("n-local"), conf: 0, cap: parseInt(val("n-vagas")) || 100, kind: "Evento", desc: val("n-desc") || "Descrição a definir." });
    state.day = val("n-dia"); go("evento-" + id); toast("Evento publicado na programação.");
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeOverlays(); });
window.addEventListener("hashchange", render);
$("#scrim").addEventListener("click", closeOverlays);
if (window.matchMedia("(max-width: 760px)").matches) $("#phone").classList.add("mobile");
render();
</script>
</body>
</html>
