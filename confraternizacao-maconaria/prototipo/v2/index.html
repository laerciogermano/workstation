<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confraternização 125 anos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Newsreader:opsz,wght@6..72,400..600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
/* Direção: programa impresso de cerimônia em tela de celular. Serifa nos títulos, números condensados nos horários,
   bordô do GOP só em momentos-chave, mapa em tela cheia com folha por cima, barra de abas flutuante. */
:root {
  --brand: #740012;
  --brand-2: #8f1222;
  --ink: #1d2939;
  --body: #475467;
  --muted: #6b7686;
  --line: #e4e7ec;
  --paper: #ffffff;
  --wash: #f4f5f7;
  --stage: #e6e8ec;
  --ok: #157a3c;
  --map: #ebedf0;
  --park: #d9e5d6;
  --road: #ffffff;
  --water: #d3dde8;
  --glass: rgba(255,255,255,.72);
  --bar: rgba(29,41,57,.88);
  --on-bar: #ffffff;
  --font-ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-serif: "Newsreader", Georgia, "Times New Roman", serif;
  --r-sm: 12px; --r-md: 16px; --r-lg: 24px;
  --spring: cubic-bezier(.34, 1.4, .64, 1);
  --ease: cubic-bezier(.16, 1, .3, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brand: #9a1f33; --brand-2: #b02a40; --ink: #f1f2f4; --body: #c4cad3; --muted: #939cab; --line: #2a313c;
    --paper: #12161c; --wash: #1a1f27; --stage: #090b0f; --ok: #4fc27c; --map: #1b2028; --park: #1e2a22; --road: #2a313c; --water: #1c2733;
    --glass: rgba(26,31,39,.72); --bar: rgba(40,46,56,.86); --on-bar: #ffffff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --brand: #9a1f33; --brand-2: #b02a40; --ink: #f1f2f4; --body: #c4cad3; --muted: #939cab; --line: #2a313c;
  --paper: #12161c; --wash: #1a1f27; --stage: #090b0f; --ok: #4fc27c; --map: #1b2028; --park: #1e2a22; --road: #2a313c; --water: #1c2733;
  --glass: rgba(26,31,39,.72); --bar: rgba(40,46,56,.86); --on-bar: #ffffff; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--stage); color: var(--ink); font-family: var(--font-ui); font-size: 17px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; display: flex; align-items: center; justify-content: center; gap: 56px;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }
.cond { font-stretch: 72%; font-weight: 800; letter-spacing: -0.01em; }
.press { transition: transform .18s var(--spring); }
.press:active { transform: scale(.97); }

/* palco do desktop */
.side { max-width: 280px; display: flex; flex-direction: column; gap: 18px; }
.side h1 { font-family: var(--font-serif); font-size: 34px; font-weight: 500; line-height: 1.05; letter-spacing: -0.02em; }
.side p { color: var(--body); font-size: 16px; }
.jump { display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--line); padding-top: 10px; }
.jump button { border: 0; background: none; text-align: left; padding: 7px 0; font-size: 15px; color: var(--body); display: flex; justify-content: space-between; }
.jump button:hover { color: var(--brand); }
.jump button span { color: var(--muted); font-size: 13px; }
.side small { color: var(--muted); font-size: 13px; }

.phone {
  width: 390px; max-width: 100%; height: min(844px, calc(100% - 48px)); background: var(--paper); border-radius: 48px;
  overflow: hidden; position: relative; box-shadow: 0 0 0 11px #0d1015, 0 40px 80px -30px rgba(10,12,16,.55);
  isolation: isolate;
}
@media (max-width: 760px) {
  body { display: block; }
  .side { display: none; }
  .phone { width: 100%; height: 100%; border-radius: 0; box-shadow: none; }
}
#app { height: 100%; display: flex; flex-direction: column; }
.view { flex: 1; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.view::-webkit-scrollbar { display: none; }
.view.has-bar { padding-bottom: 104px; }
.statusgap { height: 44px; flex: none; }
.phone.mobile .statusgap { height: 12px; }

/* botões de vidro */
.glass-btn {
  width: 46px; height: 46px; border-radius: 50%; border: 0; display: grid; place-items: center;
  background: var(--glass); color: var(--ink); backdrop-filter: blur(18px) saturate(1.6); -webkit-backdrop-filter: blur(18px) saturate(1.6);
  box-shadow: 0 1px 0 rgba(255,255,255,.35) inset, 0 6px 18px -8px rgba(10,12,16,.35);
}
.glass-btn svg { width: 21px; height: 21px; }
.me-btn { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--paper); background: var(--brand); color: #fff; font-weight: 700; font-size: 15px; box-shadow: 0 6px 18px -8px rgba(10,12,16,.4); }

/* barra de abas flutuante */
.tabbar {
  position: absolute; left: 14px; right: 14px; bottom: 16px; z-index: 10; height: 68px; border-radius: 34px;
  background: var(--bar); backdrop-filter: blur(22px) saturate(1.5); -webkit-backdrop-filter: blur(22px) saturate(1.5);
  display: grid; grid-template-columns: repeat(3, 1fr); padding: 6px; box-shadow: 0 14px 30px -12px rgba(10,12,16,.5);
}
.tabbar button {
  border: 0; background: none; color: rgba(255,255,255,.62); border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; font-size: 12px; font-weight: 600; position: relative; transition: background .25s var(--ease), color .2s;
}
.tabbar button svg { width: 23px; height: 23px; }
.tabbar button[aria-current="page"] { background: rgba(255,255,255,.14); color: var(--on-bar); }
.tabbar .dot { position: absolute; top: 9px; left: calc(50% + 9px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--brand-2); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }

/* cabeçalho de página (título grande) */
.navrow { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px 0; }
.navrow .plain { border: 0; background: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); }
.navrow .plain:hover { background: var(--wash); }
.navrow .plain svg { width: 24px; height: 24px; }
.largetitle { padding: 8px 20px 18px; display: flex; flex-direction: column; gap: 4px; }
.largetitle h1 { font-family: var(--font-serif); font-weight: 500; font-size: 38px; line-height: 1.02; letter-spacing: -0.025em; }
.largetitle p { color: var(--body); font-size: 16px; }

/* ---------- home ---------- */
.mapwrap { position: relative; height: 330px; flex: none; }
.mapwrap svg.city { position: absolute; inset: 0; width: 100%; height: 100%; }
.mapwrap .over { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: 52px 16px 0; }
.phone.mobile .mapwrap .over { padding-top: 16px; }
.pin { position: absolute; transform: translate(-50%, -100%); border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; transition: transform .2s var(--spring); }
.pin:hover { transform: translate(-50%, -100%) scale(1.08); }
.pin .tag { background: var(--paper); color: var(--ink); border-radius: 10px; padding: 4px 8px 4px 4px; display: flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 700; box-shadow: 0 6px 16px -6px rgba(10,12,16,.45); white-space: nowrap; }
.pin .tag b { background: var(--brand); color: #fff; border-radius: 7px; padding: 2px 6px; font-stretch: 72%; font-weight: 800; font-size: 14px; }
.pin.mine .tag b { background: var(--ink); color: var(--paper); }
.pin .tail { width: 10px; height: 10px; background: var(--paper); transform: rotate(45deg); margin-top: -6px; }
.sheet-body { position: relative; margin-top: -30px; background: var(--paper); border-radius: 30px 30px 0 0; padding: 10px 0 0; z-index: 2; }
.handle { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }

.greet { padding: 4px 20px 20px; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: end; }
.greet small { color: var(--muted); font-size: 15px; }
.greet h1 { font-family: var(--font-serif); font-weight: 500; font-size: 34px; line-height: 1.02; letter-spacing: -0.025em; margin-top: 2px; }
.greet p { color: var(--body); font-size: 16px; margin-top: 6px; max-width: 26ch; }
.count { text-align: right; line-height: 1; }
.count b { display: block; font-size: 52px; color: var(--brand); }
.count span { font-size: 13px; color: var(--muted); }

/* passe (ingresso) */
.pass {
  margin: 0 16px; border-radius: var(--r-lg); background: var(--brand); color: #fff; display: grid; grid-template-columns: 1fr 86px;
  position: relative; border: 0; width: calc(100% - 32px); text-align: left; padding: 0; overflow: hidden;
  --notch: var(--paper);
}
.pass .main { padding: 16px 16px 16px 18px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.pass .main small { font-size: 13px; opacity: .8; font-weight: 600; }
.pass .main h3 { font-family: var(--font-serif); font-weight: 500; font-size: 23px; line-height: 1.1; letter-spacing: -0.015em; }
.pass .main .where { font-size: 14px; opacity: .85; display: flex; align-items: center; gap: 5px; }
.pass .main .where svg { width: 14px; height: 14px; }
.pass .stub { border-left: 2px dashed rgba(255,255,255,.35); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: .95; position: relative; }
.pass .stub b { font-size: 34px; }
.pass .stub span { font-size: 12px; opacity: .8; font-weight: 600; margin-top: 4px; }
.pass .stub::before, .pass .stub::after { content: ""; position: absolute; left: -11px; width: 20px; height: 20px; border-radius: 50%; background: var(--notch); }
.pass .stub::before { top: -10px; } .pass .stub::after { bottom: -10px; }
.pass.ink { background: var(--wash); color: var(--ink); }
.pass.ink .stub { border-left-color: var(--line); }
.pass.ink .stub b { color: var(--brand); }

.section { padding: 26px 0 0; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 20px 12px; gap: 12px; }
.section-head h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.015em; }
.section-head span { font-size: 14px; color: var(--muted); }

.dates { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 16px; }
.date { border: 1.5px solid var(--line); background: var(--paper); border-radius: 20px; padding: 10px 0 12px; display: flex; flex-direction: column; align-items: center; transition: background .25s var(--ease), border-color .25s, color .2s, transform .18s var(--spring); }
.date:active { transform: scale(.95); }
.date .wd { font-size: 13px; font-weight: 600; color: var(--muted); }
.date .dn { font-size: 38px; line-height: 1.05; }
.date .n { display: flex; gap: 3px; height: 6px; }
.date .n i { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); opacity: .5; }
.date[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.date[aria-pressed="true"] .wd { color: var(--paper); opacity: .7; }
.date[aria-pressed="true"] .n i { background: var(--paper); opacity: .8; }

/* programação em linha do tempo */
.slot {
  display: grid; grid-template-columns: 70px 1fr 24px; gap: 14px; padding: 16px 16px 16px 20px; border: 0; background: none; width: 100%; text-align: left;
  position: relative; border-top: 1px solid var(--line); align-items: start;
}
.slot:first-child { border-top: 0; }
.slot:hover { background: var(--wash); }
.slot .t { font-size: 26px; line-height: 1; }
.slot .t small { display: block; font-stretch: 100%; font-weight: 500; font-size: 13px; color: var(--muted); margin-top: 5px; letter-spacing: 0; }
.slot h3 { font-family: var(--font-serif); font-weight: 500; font-size: 21px; line-height: 1.15; letter-spacing: -0.015em; }
.slot .m { font-size: 14px; color: var(--body); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.slot .m span { display: inline-flex; gap: 5px; align-items: center; }
.slot .m svg { width: 15px; height: 15px; color: var(--muted); }
.slot > svg { width: 20px; height: 20px; color: var(--muted); margin-top: 4px; }
.mine-mark { color: var(--ok); font-weight: 700; }
.full-mark { color: var(--muted); font-weight: 700; }
.left-mark { color: var(--brand); font-weight: 700; }
.slot.is-mine::before { content: ""; position: absolute; left: 0; top: 18px; bottom: 18px; width: 3px; border-radius: 0 3px 3px 0; background: var(--brand); }

/* ---------- evento ---------- */
.ev-hero { background: var(--brand); color: #fff; padding: 52px 20px 26px; display: flex; flex-direction: column; gap: 18px; }
.phone.mobile .ev-hero { padding-top: 16px; }
.ev-hero .top { display: flex; justify-content: space-between; align-items: center; }
.ev-hero .glass-btn { background: rgba(255,255,255,.16); color: #fff; box-shadow: none; }
.ev-hero .kind { font-size: 14px; font-weight: 600; opacity: .85; }
.ev-hero h1 { font-family: var(--font-serif); font-weight: 500; font-size: 38px; line-height: 1.02; letter-spacing: -0.025em; }
.ev-hero .where { display: flex; align-items: center; gap: 6px; font-size: 15px; opacity: .9; }
.ev-hero .where svg { width: 16px; height: 16px; }

.bento { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 16px; }
.tile { background: var(--wash); border-radius: var(--r-md); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile small { font-size: 13px; color: var(--muted); font-weight: 600; }
.tile .big { font-size: 40px; line-height: 1; }
.tile .sub { font-size: 14px; color: var(--body); }
.tile.wide { grid-column: span 2; }
.tile.place { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; }
.tile.place b { font-size: 17px; font-weight: 700; display: block; }
.tile .minimap { width: 76px; height: 64px; border-radius: 12px; overflow: hidden; }
.meter { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.meter i { display: block; height: 100%; background: var(--brand); border-radius: 3px; }
.faces { display: flex; align-items: center; margin-top: 10px; }
.faces .av { width: 34px; height: 34px; font-size: 12px; border: 2px solid var(--wash); margin-left: -8px; }
.faces .av:first-child { margin-left: 0; }
.faces span.txt { margin-left: 10px; font-size: 14px; color: var(--body); }

.prose { font-family: var(--font-serif); font-size: 19px; line-height: 1.55; color: var(--body); padding: 0 20px; }
.cta-dock { position: sticky; bottom: 0; padding: 14px 16px 22px; background: linear-gradient(to top, var(--paper) 72%, transparent); display: flex; gap: 10px; }

.btn {
  min-height: 56px; border-radius: 28px; border: 0; font-weight: 700; font-size: 17px; padding: 0 22px; width: 100%;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .18s var(--spring), background .2s;
}
.btn:active { transform: scale(.97); }
.btn svg { width: 20px; height: 20px; }
.btn.primary { background: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-2); }
.btn.dark { background: var(--ink); color: var(--paper); }
.btn.soft { background: var(--wash); color: var(--ink); }
.btn.soft:hover { background: var(--line); }
.btn.ok { background: color-mix(in srgb, var(--ok) 14%, var(--paper)); color: var(--ok); }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.btn.fit { width: auto; }

/* pessoas */
.av { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 15px; flex: none; }
.av-0 { background: var(--brand); } .av-1 { background: #556580; } .av-2 { background: #7a5a3c; } .av-3 { background: #3c6b56; }
.av-4 { background: #66497a; } .av-5 { background: #8a4130; } .av-6 { background: #2f5b7a; }
.people { padding: 0 4px; }
.person { display: grid; grid-template-columns: 46px 1fr auto; gap: 14px; align-items: center; padding: 10px 16px; }
.person b { display: block; font-size: 16px; font-weight: 700; }
.person small { font-size: 14px; color: var(--muted); }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--wash); color: var(--ink); display: grid; place-items: center; }
.icon-btn:hover { background: var(--line); }
.icon-btn svg { width: 19px; height: 19px; }
.textlink { border: 0; background: none; color: var(--brand); font-weight: 700; font-size: 16px; padding: 10px 20px; display: inline-flex; gap: 6px; align-items: center; }
.textlink svg { width: 17px; height: 17px; }
.search { margin: 0 16px 8px; display: flex; align-items: center; gap: 10px; background: var(--wash); border-radius: 14px; padding: 0 14px; height: 50px; }
.search svg { width: 19px; height: 19px; color: var(--muted); }
.search input { border: 0; background: none; flex: 1; font-size: 17px; height: 100%; outline: none; min-width: 0; }

/* ---------- inscrições ---------- */
.passes { display: flex; flex-direction: column; gap: 12px; }
.day-label { padding: 18px 20px 10px; font-size: 15px; font-weight: 700; color: var(--muted); }
.day-label:first-child { padding-top: 0; }
.empty { padding: 30px 24px; text-align: center; display: flex; flex-direction: column; gap: 16px; align-items: center; }
.empty p { font-family: var(--font-serif); font-size: 20px; color: var(--body); max-width: 24ch; }

/* ---------- chat ---------- */
.tabs-text { display: flex; gap: 22px; padding: 0 20px; border-bottom: 1px solid var(--line); }
.tabs-text button { border: 0; background: none; padding: 10px 0 12px; font-size: 16px; font-weight: 600; color: var(--muted); position: relative; }
.tabs-text button[aria-pressed="true"] { color: var(--ink); }
.tabs-text button[aria-pressed="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; border-radius: 2px; background: var(--brand); }
.thread { display: grid; grid-template-columns: 54px 1fr auto; gap: 14px; align-items: center; padding: 13px 20px; border: 0; background: none; width: 100%; text-align: left; }
.thread:hover { background: var(--wash); }
.gtile { width: 54px; height: 54px; border-radius: 16px; background: var(--wash); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: .95; flex: none; }
.gtile b { font-size: 24px; color: var(--brand); }
.gtile span { font-size: 11px; color: var(--muted); font-weight: 700; }
.thread .av { width: 54px; height: 54px; }
.thread .name { font-size: 17px; font-weight: 700; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.thread .last { font-size: 15px; color: var(--body); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.thread.unread .last { color: var(--ink); font-weight: 600; }
.thread .when { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; font-size: 13px; color: var(--muted); }
.thread .badge { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--brand); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.locked { margin: 10px 20px 0; padding: 14px 16px; border-radius: var(--r-md); background: var(--wash); display: flex; gap: 12px; font-size: 15px; color: var(--body); align-items: center; }
.locked svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
.hint-line { padding: 14px 20px; font-size: 15px; color: var(--muted); }

.convo { display: flex; flex-direction: column; height: 100%; }
.convo-head { display: grid; grid-template-columns: 44px 1fr; gap: 8px; align-items: center; padding: 50px 14px 10px; border-bottom: 1px solid var(--line); background: var(--paper); }
.phone.mobile .convo-head { padding-top: 12px; }
.convo-head .back { background: none; }
.convo-head .who { display: flex; gap: 10px; align-items: center; min-width: 0; }
.convo-head .av, .convo-head .gtile { width: 40px; height: 40px; font-size: 13px; border-radius: 12px; }
.convo-head .av { border-radius: 50%; }
.convo-head .gtile b { font-size: 19px; }
.convo-head .name { display: block; font-size: 16px; font-weight: 700; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.convo-head small { font-size: 13px; color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msgs { flex: 1; overflow-y: auto; padding: 16px 14px; display: flex; flex-direction: column; background: var(--paper); }
.daymark { align-self: center; font-size: 12px; font-weight: 600; color: var(--muted); margin: 4px 0 6px; }
.msg { max-width: 80%; display: flex; flex-direction: column; margin-top: 10px; }
.msg.same { margin-top: 3px; }
.msg .who { font-size: 13px; font-weight: 700; color: var(--brand); margin: 0 0 3px 12px; }
.msg .bubble { background: var(--wash); padding: 10px 14px; border-radius: 20px 20px 20px 6px; font-size: 16px; line-height: 1.4; }

function scrGrupo(id) {

// ---------- folhas ----------
function renderSheets(cur) {
  const item = (r, i, l) => `<button data-go="${r}" ${cur === r ? 'aria-current="page"' : ""}>${icon(i)}${l}${icon("chevron-right", "chev")}</button>`;
  $("#menuSheet").innerHTML = `<div class="handle"></div><div class="menu">
    ${item("eventos", "calendar-days", "Eventos")}${item("inscricoes", "ticket", "Inscrições")}${item("chat", "message-circle", "Chat")}
    ${ME.organizer ? `<div class="sep"></div><div class="lab">Organização</div>${item("organizacao", "clipboard-list", "Painel")}${item("novo-evento", "calendar-plus", "Novo evento")}${item("novo-local", "map-pin-plus", "Novo local")}` : ""}</div>`;
  $("#accSheet").innerHTML = `<div class="handle"></div><div class="head"><span class="av av-0">${ME.initials}</span><div><b>Ir. ${esc(ME.name)}</b><small>${esc(ME.email)}</small></div></div>
    <div class="menu">${item("perfil", "user-round", "Ver perfil")}${item("editar-perfil", "pencil", "Editar perfil")}${item("senha", "key-round", "Alterar senha")}
    <div class="sep"></div><button class="danger" data-act="logout">${icon("log-out")}Sair</button></div>`;
}
function openSheet(id) { $("#scrim").classList.add("open"); $("#" + id).classList.add("open"); }
function closeSheets() { ["scrim", "menuSheet", "accSheet"].forEach(i => $("#" + i).classList.remove("open")); }

// ---------- render ----------
function route() { return location.hash.slice(1) || "entrar"; }
function paint() {
  closeSheets();
  const r = route(), [base, ...rest] = r.split("-"), arg = rest.join("-");
  const screens = {
    entrar: scrAuth, eventos: scrEventos, inscricoes: scrInscricoes, chat: scrChat, perfil: scrPerfil, organizacao: scrOrganizacao, senha: scrSenha, editar: scrEditar,
    evento: () => scrEvento(arg), participantes: () => scrParticipantes(arg), grupo: () => scrGrupo(arg), conversa: () => scrConversa(arg),
    novo: () => arg === "local" ? scrNovoLocal() : scrNovoEvento(),
  };
  $("#app").innerHTML = (screens[base] || scrEventos)();
  renderSheets(r);
  lucide.createIcons();
  const m = $("#msgs"); if (m) m.scrollTop = m.scrollHeight;
}
function render(animate = true) {
  if (animate && document.startViewTransition && !reduced) document.startViewTransition(paint); else paint();
}
function go(r) { if (location.hash.slice(1) === r) render(); else location.hash = r; }

// ---------- interação ----------
document.addEventListener("click", e => {
  if (e.target.id === "scrim") { closeSheets(); return; }
  const t = e.target.closest("[data-go],[data-act],[data-day],[data-tab]"); if (!t) return;
  if (t.dataset.go) { go(t.dataset.go); return; }
  if (t.dataset.day) { state.day = t.dataset.day; render(false); return; }
  if (t.dataset.tab) { state.chatTab = t.dataset.tab; render(false); return; }
  const a = t.dataset.act;
  if (a === "menu") { if (route() === "entrar") go("eventos"); setTimeout(() => openSheet("menuSheet"), route() === "entrar" ? 320 : 0); }
  if (a === "account") openSheet("accSheet");
  if (a === "authmode") { state.authMode = state.authMode === "login" ? "signup" : "login"; render(); }
  if (a === "logout") { state.authMode = "login"; go("entrar"); }
  if (a === "enroll") { const x = ev(t.dataset.id); state.enrolled.add(x.id); x.conf++; state.groupReads[x.id] = state.groupReads[x.id] || 0; render(false); toast("Inscrição confirmada. O grupo já está no Chat."); }
  if (a === "unenroll") { const x = ev(t.dataset.id); state.enrolled.delete(x.id); x.conf--; render(false); toast("Inscrição cancelada."); }
  if (a === "dm") {
    let dm = DMS.find(x => x.with === t.dataset.uid);
    if (!dm) { dm = { id: "p" + (DMS.length + 1), with: t.dataset.uid, unread: 0, msgs: [] }; DMS.unshift(dm); }
    go("conversa-" + dm.id);
  }
});
document.addEventListener("input", e => {
  if (e.target.dataset.filter !== "people") return;
  const q = e.target.value.toLowerCase();
  $("#peopleList").innerHTML = PEOPLE.filter(p => (p.name + p.from).toLowerCase().includes(q)).map(personRow).join("") || `<div class="empty"><p>Ninguém encontrado com “${esc(e.target.value)}”.</p></div>`;
  lucide.createIcons();
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target, val = id => (document.getElementById(id)?.value || "").trim();
  if (f.id === "authForm") {
    const err = $("#authErr"), signup = state.authMode === "signup";
    if (signup && !val("f-nome")) { err.textContent = "Informe seu nome completo."; return; }
    if (!/\S+@\S+\.\S+/.test(val("f-email"))) { err.textContent = "Informe um e-mail válido."; return; }
    if (val("f-senha").length < 8) { err.textContent = "A senha precisa ter pelo menos 8 caracteres."; return; }
    if (signup) {
      ME.name = val("f-nome"); ME.short = ME.name.split(" ")[0]; ME.initials = initials(ME.name); ME.email = val("f-email"); ME.pais = val("f-pais");
      if (val("f-loja")) ME.loja = val("f-loja"); if (val("f-cidade")) ME.oriente = val("f-cidade"); if (val("f-cim")) ME.cim = val("f-cim");
    }
    go("eventos"); if (signup) toast("Conta criada. Bem-vindo ao evento.");
  }
  if (f.id === "composer") {
    const text = val("msgInput"); if (!text) return;
    const at = new Date().toTimeString().slice(0, 5);
    if (f.dataset.kind === "g") GROUP_MSGS[f.dataset.id].push({ who: "me", at, text }); else DMS.find(x => x.id === f.dataset.id).msgs.push({ me: true, at, text });
    state.justSent = true; render(false); $("#msgInput").focus();
  }
  if (f.id === "profileForm") {
    ME.name = val("p-nome") || ME.name; ME.short = ME.name.split(" ")[0]; ME.initials = initials(ME.name);
    ME.loja = val("p-loja"); ME.oriente = val("p-oriente"); ME.pais = val("p-pais"); ME.email = val("p-email"); ME.phone = val("p-tel");
    go("perfil"); toast("Perfil atualizado.");
  }
  if (f.id === "pwForm") {
    const err = $("#pwErr");
    if (!val("s-atual")) { err.textContent = "Informe a senha atual."; return; }
    if (val("s-nova").length < 8) { err.textContent = "A nova senha precisa ter pelo menos 8 caracteres."; return; }
    if (val("s-nova") !== val("s-conf")) { err.textContent = "As duas senhas novas não são iguais."; return; }
    go("perfil"); toast("Senha alterada.");
  }
  if (f.id === "placeForm") {
    const err = $("#lErr");
    if (!val("l-nome") || !val("l-end")) { err.textContent = "Preencha o nome e o endereço do local."; return; }
    PLACES.push({ id: "l" + (PLACES.length + 1), name: val("l-nome"), addr: val("l-end") + (val("l-bairro") ? ", " + val("l-bairro") : ""), cap: parseInt(val("l-cap")) || 100,
      x: 150 + Math.random() * 110, y: 110 + Math.random() * 90 });
    go("organizacao"); toast("Local cadastrado.");
  }
  if (f.id === "evForm") {
    const err = $("#nErr");
    if (!val("n-titulo")) { err.textContent = "Dê um título ao evento."; return; }
    if (!val("n-hora")) { err.textContent = "Informe o horário."; return; }
    const id = "e" + (100 + EVENTS.length), [h, m] = val("n-hora").split(":").map(Number);
    EVENTS.push({ id, day: val("n-dia"), time: val("n-hora"), end: String((h + 2) % 24).padStart(2, "0") + ":" + String(m).padStart(2, "0"),
      title: val("n-titulo"), place: val("n-local"), conf: 0, cap: parseInt(val("n-vagas")) || 100, kind: "Evento", desc: val("n-desc") || "Descrição a definir." });
    state.day = val("n-dia"); go("evento-" + id); toast("Evento publicado na programação.");
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheets(); });
window.addEventListener("hashchange", () => render());
if (matchMedia("(max-width: 760px)").matches) $("#phone").classList.add("mobile");
paint();
</script>
</body>
</html>
