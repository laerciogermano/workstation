name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        run: python -m pytest -q

  self-check:
    name: tools run clean against the bundled example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Demo set regenerates reproducibly
        run: |
          python examples/demo/make_demo.py
          git diff --exit-code -- examples/demo || {
            echo "::error::examples/demo is out of sync with make_demo.py"
            exit 1
          }

      - name: Validator passes on the example
        run: python scripts/validate_svg.py examples/demo

      - name: Contact sheet builds
        run: |
          python scripts/build_contact_sheet.py examples/demo --name "Demo" --out /tmp/sheet.html
          test -s /tmp/sheet.html

      - name: Brand kit packages, and does so reproducibly
        run: |
          python scripts/package_brand.py examples/demo --name "Demo" --out /tmp/a.zip
          python scripts/package_brand.py examples/demo --name "Demo" --out /tmp/b.zip
          cmp /tmp/a.zip /tmp/b.zip || {
            echo "::error::brand.zip is not byte-reproducible"
            exit 1
          }

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check scripts tests examples
