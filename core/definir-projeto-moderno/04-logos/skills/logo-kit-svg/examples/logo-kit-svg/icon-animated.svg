<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none" role="img" aria-label="Logo Kit SVG animated icon">
  <defs>
    <style>
      .outer-draw {
        stroke-dasharray: 830;
        stroke-dashoffset: 830;
        animation: draw-outer 4.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .inner-draw {
        stroke-dasharray: 478;
        stroke-dashoffset: 478;
        animation: draw-inner 4.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .core-dot {
        transform-origin: 256px 256px;
        animation: pop-core 4.6s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }
      .orbit-arc {
        stroke-dasharray: 207;
        stroke-dashoffset: 207;
        animation: draw-orbit 4.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .orbit-tip {
        transform-origin: 388px 256px;
        animation: pop-orbit-tip 4.6s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }
      @keyframes draw-outer {
        0%, 6% { stroke-dashoffset: 830; }
        24%, 86% { stroke-dashoffset: 0; }
        96%, 100% { stroke-dashoffset: 830; }
      }
      @keyframes draw-inner {
        0%, 18% { stroke-dashoffset: 478; }
        34%, 86% { stroke-dashoffset: 0; }
        96%, 100% { stroke-dashoffset: 478; }
      }
      @keyframes pop-core {
        0%, 30% { transform: scale(0.35); opacity: 0; }
        44%, 86% { transform: scale(1); opacity: 1; }
        96%, 100% { transform: scale(0.35); opacity: 0; }
      }
      @keyframes draw-orbit {
        0%, 36% { stroke-dashoffset: 207; }
        52%, 86% { stroke-dashoffset: 0; }
        96%, 100% { stroke-dashoffset: 207; }
      }
      @keyframes pop-orbit-tip {
        0%, 48% { transform: scale(0); opacity: 0; }
        58%, 86% { transform: scale(1); opacity: 1; }
        96%, 100% { transform: scale(0); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .outer-draw, .inner-draw, .orbit-arc {
          animation: none !important;
          stroke-dashoffset: 0 !important;
        }
        .core-dot, .orbit-tip {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="#12181f" stroke="#2d3844" stroke-width="6"/>
  <circle class="outer-draw" cx="256" cy="256" r="132" fill="#1c242c" stroke="#b8a4b0" stroke-width="10"/>
  <circle class="inner-draw" cx="256" cy="256" r="76" fill="#151c24" stroke="#7eb8b0" stroke-width="9"/>
  <circle class="core-dot" cx="256" cy="256" r="14" fill="#eef2f6"/>
  <path class="orbit-arc" d="M 256 124 A 132 132 0 0 1 388 256" fill="none" stroke="#9eb3d4" stroke-width="9" stroke-linecap="round"/>
  <circle class="orbit-tip" cx="388" cy="256" r="9" fill="#9eb3d4" stroke="#12181f" stroke-width="3"/>
</svg>
