<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 904 256" width="904" height="256" fill="none" role="img" aria-label="Logo Kit SVG animated banner">
  <defs>
    <style>
      .col1-outer {
        stroke-dasharray: 239;
        stroke-dashoffset: 239;
        animation: col1-draw-outer 6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .col1-inner {
        stroke-dasharray: 138;
        stroke-dashoffset: 138;
        animation: col1-draw-inner 6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .col1-core {
        transform-origin: 68px 68px;
        animation: col1-pop-core 6s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }
      .cursor-block { animation: cursor-blink 1.1s steps(2, start) infinite; }
      .pill-still { animation: pill-still 6s ease-in-out infinite; }
      .pill-motion { animation: pill-motion 6s ease-in-out infinite; }
      .sketch-outer {
        stroke-dasharray: 201;
        stroke-dashoffset: 201;
        animation: sketch-draw 6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .sketch-inner {
        stroke-dasharray: 113;
        stroke-dashoffset: 113;
        animation: sketch-draw-inner 6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .mark-shell {
        transform-origin: 292px 104px;
        animation: mark-reveal 6s cubic-bezier(0.34, 1.2, 0.64, 1) infinite;
      }
      .flow-dot {
        animation: flow-dot 6s cubic-bezier(0.45, 0, 0.2, 1) infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      @keyframes col1-draw-outer {
        0%, 8% { stroke-dashoffset: 239; }
        22%, 78% { stroke-dashoffset: 0; }
        90%, 100% { stroke-dashoffset: 239; }
      }
      @keyframes col1-draw-inner {
        0%, 16% { stroke-dashoffset: 138; }
        30%, 78% { stroke-dashoffset: 0; }
        90%, 100% { stroke-dashoffset: 138; }
      }
      @keyframes col1-pop-core {
        0%, 26% { transform: scale(0.4); opacity: 0; }
        38%, 78% { transform: scale(1); opacity: 1; }
        90%, 100% { transform: scale(0.4); opacity: 0; }
      }
      @keyframes cursor-blink {
        0%, 49% { opacity: 0.85; }
        50%, 100% { opacity: 0.2; }
      }
      @keyframes pill-still {
        0%, 20% { opacity: 1; }
        36%, 58% { opacity: 0.4; }
        72%, 100% { opacity: 1; }
      }
      @keyframes pill-motion {
        0%, 20% { opacity: 0.4; }
        36%, 58% { opacity: 1; }
        72%, 100% { opacity: 0.4; }
      }
      @keyframes sketch-draw {
        0%, 10% { stroke-dashoffset: 201; }
        26%, 42% { stroke-dashoffset: 0; }
        58%, 100% { stroke-dashoffset: 201; }
      }
      @keyframes sketch-draw-inner {
        0%, 18% { stroke-dashoffset: 113; }
        32%, 42% { stroke-dashoffset: 0; }
        58%, 100% { stroke-dashoffset: 113; }
      }
      @keyframes mark-reveal {
        0%, 38% { transform: scale(0.88); opacity: 0.25; }
        50%, 68% { transform: scale(1.06); opacity: 1; }
        82%, 100% { transform: scale(0.88); opacity: 0.25; }
      }
      @keyframes flow-dot {
        0%, 12% { transform: translate(0, 0); opacity: 0; }
        18%, 22% { transform: translate(0, 0); opacity: 1; }
        42%, 48% { transform: translate(174px, 0); opacity: 1; }
        54%, 100% { transform: translate(174px, 0); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .col1-outer, .col1-inner, .sketch-outer, .sketch-inner {
          animation: none !important;
          stroke-dashoffset: 0 !important;
        }
        .col1-core, .mark-shell, .flow-dot, .cursor-block, .pill-still, .pill-motion {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </defs>
  <rect x="2" y="2" width="900" height="252" rx="18" fill="#12181f" stroke="#2d3844" stroke-width="2"/>
  <g transform="translate(28, 60)">
    <rect x="0" y="0" width="136" height="136" rx="32" fill="#1a2229" stroke="#2d3844" stroke-width="2"/>
    <circle class="col1-outer" cx="68" cy="68" r="38" fill="#1c242c" stroke="#b8a4b0" stroke-width="4.5"/>
    <circle class="col1-inner" cx="68" cy="68" r="22" fill="#151c24" stroke="#7eb8b0" stroke-width="4"/>
    <circle class="col1-core" cx="68" cy="68" r="5.5" fill="#eef2f6"/>
  </g>
  <text x="184" y="102" font-family="IBM Plex Sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.4">
    <tspan fill="#eef2f6">Logo </tspan><tspan fill="#eef2f6">Kit </tspan><tspan fill="#9eb3d4">SVG</tspan>
  </text>
  <rect class="cursor-block" x="400" y="72" width="8" height="28" rx="2" fill="#9eb3d4"/>
  <text x="186" y="128" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="500" fill="#8b99a8">
    plain, then it moves.
  </text>
  <g transform="translate(186, 144)" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">
    <g class="pill-still">
      <rect x="0" y="0" width="84" height="26" rx="6" fill="#1c242c" stroke="#b8a4b0" stroke-opacity="0.55" stroke-width="1.2"/>
      <text x="18" y="17" fill="#c4b4bc">still</text>
    </g>
    <g class="pill-motion">
      <rect x="92" y="0" width="96" height="26" rx="6" fill="#151c24" stroke="#7eb8b0" stroke-opacity="0.55" stroke-width="1.2"/>
      <text x="108" y="17" fill="#9ecec6">motion</text>
    </g>
  </g>
  <text x="186" y="196" font-family="IBM Plex Sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" fill="#5c6b7a">
    Four-file README brand system.
  </text>
  <g transform="translate(456, 22)">
    <rect x="0" y="0" width="424" height="212" rx="12" fill="#1a2229" stroke="#2d3844" stroke-width="1.5"/>
    <path d="M 0 12 A 12 12 0 0 1 12 0 H 412 A 12 12 0 0 1 424 12 V 36 H 0 Z" fill="#1e262e"/>
    <line x1="0" y1="36" x2="424" y2="36" stroke="#2d3844" stroke-width="1.2"/>
    <text x="16" y="23" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" fill="#eef2f6">one mark, two states</text>
    <circle class="sketch-outer" cx="118" cy="104" r="32" fill="#1c242c" stroke="#b8a4b0" stroke-width="4"/>
    <circle class="sketch-inner" cx="118" cy="104" r="18" fill="none" stroke="#b8a4b0" stroke-opacity="0.55" stroke-width="3"/>
    <text x="88" y="158" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" fill="#c4b4bc">sketch</text>
    <g class="mark-shell">
      <circle cx="292" cy="104" r="32" fill="#151c24" stroke="#7eb8b0" stroke-width="4"/>
      <circle cx="292" cy="104" r="10" fill="#eef2f6"/>
    </g>
    <text x="268" y="158" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" fill="#9ecec6">mark</text>
    <line x1="150" y1="104" x2="260" y2="104" stroke="#2d3844" stroke-width="1.2" stroke-dasharray="4 6"/>
    <g class="flow-dot">
      <circle cx="118" cy="104" r="7" fill="#7eb8b0" stroke="#12181f" stroke-width="2"/>
    </g>
    <line x1="16" y1="172" x2="408" y2="172" stroke="#2d3844" stroke-width="1.2"/>
    <text x="16" y="192" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600" fill="#8b99a8">still &#8594; motion</text>
    <text x="16" y="208" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600" fill="#5c6b7a">icon &#183; banner &#183; kit &#183; QA</text>
  </g>
</svg>
