<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#014380" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="notinhas" />
    <meta name="format-detection" content="telephone=no" />
    <title>notinhas.shop</title>
    <meta
      name="description"
      content="Menor preço a partir da nota fiscal. Compare estabelecimentos, escaneie o QR da NFC-e e acompanhe o que você comprou."
    />
    <link rel="canonical" href="https://144.126.154.90/enotas/" />
    <link rel="icon" type="image/png" href="icon-512.png" />
    <link rel="apple-touch-icon" href="icon-512.png" />
    <!-- Open Graph / WhatsApp / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="notinhas.shop" />
    <meta property="og:title" content="notinhas.shop — menor preço a partir da nota" />
    <meta
      property="og:description"
      content="Compare preços por estabelecimento, escaneie o QR da NFC-e e veja o que você comprou."
    />
    <meta property="og:url" content="https://144.126.154.90/enotas/" />
    <meta property="og:image" content="https://144.126.154.90/enotas/og-image.png" />
    <meta property="og:image:secure_url" content="https://144.126.154.90/enotas/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="notinhas.shop — Menor preço a partir da nota." />
    <!-- Twitter / X (alguns clientes também leem) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="notinhas.shop — menor preço a partir da nota" />
    <meta
      name="twitter:description"
      content="Compare preços por estabelecimento, escaneie o QR da NFC-e e veja o que você comprou."
    />
    <meta name="twitter:image" content="https://144.126.154.90/enotas/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
  </head>
  <body>
    <header class="app-header">
      <div class="app-header-inner wide">
        <div class="app-header-row">
          <div class="app-header-copy">
            <a class="brand app-header-brand" href="./" aria-label="notinhas.shop — início">
              <span class="n">notinhas</span><span class="o">.shop</span>
            </a>
            <p class="app-header-tag">Menor preço a partir da nota.</p>
          </div>
          <a class="app-header-cta" href="apresentacao.html">O que somos</a>
        </div>
      </div>
    </header>
    <main class="screen wide has-fab">
      <p id="status" class="status" aria-live="polite" hidden></p>

      <div class="tabs" role="tablist" aria-label="Seções">
        <button type="button" class="tab" role="tab" id="tab-empresas" data-tab="empresas" aria-controls="panel-empresas" aria-selected="true">
          Estabelecimentos <span id="count-empresas" class="count"></span>
        </button>
        <button type="button" class="tab" role="tab" id="tab-notas" data-tab="notas" aria-controls="panel-notas" aria-selected="false">
          Notas <span id="count-notas" class="count"></span>
        </button>
        <button type="button" class="tab" role="tab" id="tab-itens" data-tab="itens" aria-controls="panel-itens" aria-selected="false">
          Itens <span id="count-itens" class="count"></span>
        </button>
      </div>

      <section class="block tab-panel" id="panel-empresas" role="tabpanel" aria-labelledby="tab-empresas">
        <div id="empresas-mapa" class="empresas-mapa" aria-label="Mapa"></div>
        <p id="empresas-mapa-status" class="status" aria-live="polite" hidden></p>

        <div id="vitrine-lista">
          <label class="search">
            <span class="sr-only">Buscar estabelecimentos</span>
            <input id="busca-vitrine" type="search" placeholder="Buscar estabelecimento…" autocomplete="off" />
          </label>
          <div id="vitrine-grid" class="vitrine-grid" aria-live="polite"></div>
        </div>

        <div id="vitrine-detalhe" hidden>
          <button type="button" class="back-link" id="vitrine-voltar">← Estabelecimentos</button>
          <article class="loja-card loja-card-head" id="vitrine-loja-info"></article>
          <label class="search" style="margin-top: 1rem">
            <span class="sr-only">Buscar itens</span>
            <input id="busca-vitrine-itens" type="search" placeholder="Buscar item…" autocomplete="off" />
          </label>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th></th>
                  <th>Produto</th>
                  <th>EAN</th>
                  <th>Cód.</th>
                  <th>Preço</th>
                  <th>Data</th>
                </tr>
              </thead>
              <tbody id="vitrine-itens"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="block tab-panel" id="panel-notas" role="tabpanel" aria-labelledby="tab-notas" hidden>
        <div id="notas-lista">
          <label class="search">
            <span class="sr-only">Buscar notas</span>
            <input id="busca-notas" type="search" placeholder="Buscar nota…" autocomplete="off" />
          </label>
          <div id="notas-grid" class="vitrine-grid" aria-live="polite"></div>
        </div>

        <div id="notas-detalhe" hidden>
          <button type="button" class="back-link" id="notas-voltar">← Notas</button>
          <article class="loja-card loja-card-head" id="nota-info"></article>
          <label class="search" style="margin-top: 1rem">
            <span class="sr-only">Buscar itens da nota</span>
            <input id="busca-nota-itens" type="search" placeholder="Buscar item…" autocomplete="off" />
          </label>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th></th>
                  <th>Produto</th>
                  <th>EAN</th>
                  <th>Cód.</th>
                  <th>Qtd</th>
                  <th>Preço</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="nota-itens"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="block tab-panel" id="panel-itens" role="tabpanel" aria-labelledby="tab-itens" hidden>
        <div class="subtabs" role="tablist" aria-label="Itens">
          <button type="button" class="subtab" id="subtab-itens-lista" data-sub="lista" aria-selected="true">
            Lista
          </button>
          <button type="button" class="subtab" id="subtab-itens-ean" data-sub="ean" aria-selected="false">
            EAN <span id="count-ean" class="count"></span>
          </button>
        </div>

        <div id="itens-view-lista">
          <p id="filtro-nota" class="filter-banner" hidden></p>
          <label class="search">
            <span class="sr-only">Buscar itens</span>
            <input id="busca-itens" type="search" placeholder="Buscar…" autocomplete="off" />
          </label>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th></th>
                  <th>Data</th>
                  <th>Estabelecimento</th>
                  <th>EAN</th>
                  <th>Cód.</th>
                  <th>Nome</th>
                  <th>Preço</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="itens"></tbody>
            </table>
          </div>
        </div>

        <div id="itens-view-ean" hidden>
          <label class="search">
            <span class="sr-only">Buscar EAN</span>
            <input id="busca-ean" type="search" placeholder="Buscar EAN…" autocomplete="off" />
          </label>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th></th>
                  <th>Estabelecimento</th>
                  <th>Cód.</th>
                  <th>EAN</th>
                </tr>
              </thead>
              <tbody id="codigos-barras"></tbody>
            </table>
          </div>
        </div>
      </section>

      <footer class="site-footer">
        <span class="brand" aria-hidden="true"><span class="n">notinhas</span><span class="o">.shop</span></span>
        <span aria-hidden="true">·</span>
        <a href="apresentacao.html">Quem somos</a>
        <span aria-hidden="true">·</span>
        <a href="mailto:contato@notinhas.shop">contato@notinhas.shop</a>
      </footer>
    </main>

    <a class="fab" href="scan.html" title="Adicionar nota" aria-label="Adicionar nota">
      <svg class="fab-svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
        <rect x="7.5" y="7.5" width="4" height="4" rx="0.6" stroke="currentColor" stroke-width="1.5" />
        <rect x="12.5" y="7.5" width="4" height="4" rx="0.6" stroke="currentColor" stroke-width="1.5" />
        <rect x="7.5" y="12.5" width="4" height="4" rx="0.6" stroke="currentColor" stroke-width="1.5" />
        <path d="M13 13h1.5v1.5H13V13Zm2.5 0H17v3.5h-1.5V13Zm-2.5 2.5H16V17h-3v-1.5Z" fill="currentColor" />
      </svg>
      <span class="fab-label">Nota</span>
    </a>

    <div id="modal-ean" class="modal" hidden>
      <div class="modal-backdrop" data-close-ean></div>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-ean-title">
        <header class="modal-head">
          <h2 id="modal-ean-title">EAN</h2>
          <button type="button" class="modal-close" data-close-ean aria-label="Fechar">×</button>
        </header>
        <p id="modal-ean-meta" class="hint modal-meta"></p>
        <div id="ean-reader" class="ean-reader"></div>
        <p id="ean-cam-status" class="status" aria-live="polite"></p>
        <form id="form-ean" class="form-ean modal-form">
          <input type="hidden" id="ean-empresa" />
          <input type="hidden" id="ean-unidade" />
          <label>
            Código de barras
            <span class="manual-row">
              <input
                id="ean-barras"
                type="text"
                required
                autocomplete="off"
                inputmode="numeric"
                placeholder="789…"
              />
              <button type="submit" class="btn">Salvar</button>
            </span>
          </label>
          <p id="ean-form-status" class="status" aria-live="polite"></p>
        </form>
      </div>
    </div>

    <script src="lista.js"></script>
  </body>
</html>
