    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <body>
    <header class="app-header">
      <div class="app-header-inner">
        <div class="app-header-row">
          <div class="app-header-copy">
            <a class="brand app-header-brand" href="./" aria-label="notinhas.shop — início">
              <span class="n">notinhas</span><span class="o">.shop</span>
            </a>
            <p class="app-header-tag">Escanear QR da nota.</p>
          </div>
          <a class="app-header-cta" href="./">Voltar</a>
        </div>
      </div>
    </header>
    <main class="screen">
      <a class="back-link" href="./">← Voltar</a>
      <div id="reader"></div>
      <div class="scan-alt" role="group" aria-label="Alternativas ao scan ao vivo">
        <button type="button" class="btn" id="btn-tirar-foto">Tirar foto</button>
        <button type="button" class="btn btn-ghost" id="btn-escolher-imagem">Escolher imagem</button>
        <input
          id="qr-capture"
          type="file"
          accept="image/*"
          capture="environment"
          hidden
          aria-hidden="true"
        />
        <input id="qr-file" type="file" accept="image/*" hidden aria-hidden="true" />
      </div>
      <p id="status" class="status" aria-live="polite"></p>
    </main>
    <script src="app.js"></script>
  </body>
