# Incluir no server default connectmax (/etc/nginx/sites-available/connectmax)
# Path no mesmo host :80 — convive com conect tec (root /).
# App Node: 127.0.0.1:4174

    # e-notas (convive com conect tec na mesma :80)
    location = /enotas { return 301 /enotas/; }
    location = /e-notas { return 301 /enotas/; }
    location = /e-notas/ { return 301 /enotas/; }
    location /e-notas/ { return 301 /enotas/; }
    location /enotas/ {
        proxy_pass http://127.0.0.1:4174/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
