# Path HTTPS: inserir no server :443 do mailcow (sites-available/mailcow),
# ANTES do `location /` — assim https://144.126.154.90/enotas/ não cai no painel mail.
# Path HTTP (connectmax :80): redirecionar para HTTPS.

    # e-notas (HTTPS no mesmo IP; conect tec fica em :80)
    location = /enotas { return 301 /enotas/; }
    location = /e-notas { return 301 /enotas/; }
    location = /e-notas/ { return 301 /enotas/; }
    location /e-notas/ { return 301 /enotas/; }
    location /enotas/ {
        proxy_pass http://127.0.0.1:4174/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
