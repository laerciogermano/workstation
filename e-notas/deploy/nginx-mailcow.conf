# Mailcow — clozzy + notinhas (um stack, dois hostnames)
# Destino no servidor: /etc/nginx/sites-available/mailcow
# Cert LE: /etc/letsencrypt/live/mail-clozzy-notinhas/{fullchain,privkey}.pem
# Renewal copia o cert para /opt/mailcow-dockerized/data/assets/ssl/ (hook deploy).

# HTTP ACME + redirect
server {
    listen 80;
    listen [::]:80;
    server_name mail.clozzy.com.br mail.notinhas.shop;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — mail.clozzy.com.br (default)
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name mail.clozzy.com.br 144.126.154.90 _;

    client_max_body_size 100m;

    ssl_certificate     /etc/letsencrypt/live/mail-clozzy-notinhas/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail-clozzy-notinhas/privkey.pem;

    location = /enotas { return 301 /enotas/; }
    location = /e-notas { return 301 /enotas/; }
    location = /e-notas/ { return 301 /enotas/; }
    location /e-notas/ { return 301 /enotas/; }
    location /enotas/ {
        proxy_pass http://127.0.0.1:4174/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host mail.clozzy.com.br;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

# HTTPS — mail.notinhas.shop
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mail.notinhas.shop;

    client_max_body_size 100m;

    ssl_certificate     /etc/letsencrypt/live/mail-clozzy-notinhas/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail-clozzy-notinhas/privkey.pem;

    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host mail.notinhas.shop;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
