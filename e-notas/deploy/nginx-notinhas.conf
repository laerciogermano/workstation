# Produção Contabo: /etc/nginx/sites-available/notinhas
# Proxy do app e-notas (Node 127.0.0.1:4174)
# Domínios: notinhas.shop www.notinhas.shop
# Nota: em produção o Certbot acrescenta listen 443 ssl + redirect HTTP→HTTPS.
# Não sobrescrever o arquivo live sem preservar os blocos # managed by Certbot.

server {
    listen 80;
    listen [::]:80;
    server_name notinhas.shop www.notinhas.shop;

    location / {
        proxy_pass http://127.0.0.1:4174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
