</defs><rect x="0" y="0" width="1600" height="2400" fill="url(#blug)"/><circle cx="800.0" cy="420" r="130" fill="#0B0B0B"/><text x="800.0" y="760" text-anchor="middle" class="sb" fill="#F2F5FF" >Da era adâmica à superação</text><text x="800.0" y="890" text-anchor="middle" class="bl" fill="#F2F5FF" >Desde o início dos tempos o homem faz as mesmas</text><text x="800.0" y="952" text-anchor="middle" class="bl" fill="#F2F5FF" >perguntas: o que é Deus, o que é o mundo espiritual,</text><text x="800.0" y="1014" text-anchor="middle" class="bl" fill="#F2F5FF" >o que existe depois da morte. O autor, ateu e</text><text x="800.0" y="1076" text-anchor="middle" class="bl" fill="#F2F5FF" >programador, encontrou a resposta onde menos</text><text x="800.0" y="1138" text-anchor="middle" class="bl" fill="#F2F5FF" >esperava: no código. Foi programando sistemas</text><text x="800.0" y="1200" text-anchor="middle" class="bl" fill="#F2F5FF" >que entendeu como o real é construído.</text><text x="800.0" y="1302" text-anchor="middle" class="bl" fill="#F2F5FF" >Eternos Mutáveis é uma alfabetização espiritual</text><text x="800.0" y="1364" text-anchor="middle" class="bl" fill="#F2F5FF" >para quem ainda está preso no mundo da matéria.</text><text x="800.0" y="1426" text-anchor="middle" class="bl" fill="#F2F5FF" >Pela lógica, e não pela fé cega, o livro refaz o</text><text x="800.0" y="1488" text-anchor="middle" class="bl" fill="#F2F5FF" >caminho do homem, da era adâmica à gnose,</text><text x="800.0" y="1550" text-anchor="middle" class="bl" fill="#F2F5FF" >e mostra que todos somos um.</text><text x="800.0" y="2200" text-anchor="middle" class="ct" fill="#F2F5FF" opacity=".65">ALFABETIZAÇÃO ESPIRITUAL · FILOSOFIA · SOFTWARE</text><rect x="1600" y="0" width="100" height="2400" fill="url(#spg)"/><text x="0" y="0" transform="translate(1663.0 1200.0) rotate(90)" text-anchor="middle" class="sp" fill="#FFFFFF">ETERNOS MUTÁVEIS  ·  LAÉRCIO GERMANO</text><rect x="1700" y="0" width="1600" height="2400" fil
