</defs><rect x="0" y="0" width="1600" height="1900" fill="#F4F2EC"/><rect x="0" y="1900" width="1600" height="500" fill="#0B0B0B"/><g clip-path="url(#ba)"><g transform="translate(800.0 1900) rotate(90) scale(.68) translate(-800.0 -1900)"><image href="maos-feminina.png" x="-14" y="1641" width="805" height="517"/><image href="maos-masculina.png" x="789" y="1615" width="888" height="446" transform="rotate(-9 789 1894)"/></g></g><text x="800.0" y="300" text-anchor="middle" class="sb" fill="#FFFFFF" style="mix-blend-mode:difference">Da era adâmica à superação</text><text x="800.0" y="430" text-anchor="middle" class="bl" fill="#FFFFFF" style="mix-blend-mode:difference">Desde o início dos tempos o homem faz as mesmas</text><text x="800.0" y="492" text-anchor="middle" class="bl" fill="#FFFFFF" style="mix-blend-mode:difference">perguntas: o que é Deus, o que é o mundo espiritual,</text><text x="800.0" y="554" text-anchor="middle" class="bl" fill="#FFFFFF" style="mix-blend-mode:difference">o que existe depois da morte. O autor, ateu e</text><text x="800.0" y="616" text-anchor="middle" class="bl" fill="#FFFFFF" style="mix-blend-mode:difference">programador, encontrou a resposta onde menos</text><text x="800.0" y="678" text-anchor="middle" class="bl" fill="#FFFFFF" style="mix-blend-mode:difference">esperava: no código. Foi programando sistemas</text><text x="800.0" y="740" text-anchor="middle" class="bl" fill="#FFFFFF" style="mix-blend-mode:difference">que entendeu como o real é construído.</text><text x="800.0" y="842" text-anchor="middle" class="bl" fill="#FFFFFF" style="mix-blend-mode:difference">Eternos Mutáveis é uma alfabetização espiritual</text><text x="800.0" y="904" text-anchor="middle" class="bl" fill="#FFFFFF" style="mix-blend-mode:difference">para quem ainda está preso no mundo da matéria.</text><text x="800.0" y="966" text-anchor="middle" class="bl" fill="#FFFFFF" style="mix-blend-mode:difference">Pela lógica, e não pela fé cega, o livro refaz o</text><text x="800.0" y="1028" text-anchor="middle" class="bl" fill="#FFFFFF" style="mix-blend-mode:difference">caminho do homem, da era adâmica à gnose,</text><text x="800.0" y="1090" text-anchor="middle" class="bl" fill="#FFFFFF" style="mix-blend-mode:difference">e mostra que todos somos um.</text><rect x="0" y="1344" width="1600" height="260" fill="url(#fadew)"/><text x="800.0" y="1260" text-anchor="middle" class="ct" fill="#FFFFFF" style="mix-blend-mode:difference">ALFABETIZAÇÃO ESPIRITUAL · FILOSOFIA · SOFTWARE</text><rect x="1600" y="0" width="100" height="2400" fill="#0B0B0B"/><text x="0" y="0" transform="translate(1663.0 1200.0) rotate(90)" text-anchor="middle" class="sp" fill="#F4F2EC">ETERNOS MUTÁVEIS  ·  LAÉRCIO GERMANO</text><rect x="1700" y="0" width="1600" height="1110" fill="#F4F2EC"/><rect x="1700" y="1110" width="1600" height="1290" fill="#0B0B0B"/><g clip-path="url(#fa)"><g transform="translate(2830 1110) rotate(90) scale(1.26) translate(-2830 -1110)"><image href="maos-feminina.png" x="1906" y="851" width="805" height="517"/><image href="maos-masculina.png" x="2940" y="858" width="888" height="446"/></g></g><text x="1820" y="230" class="sl" fill="#6E6B64">A SUPERAÇÃO ADÂMICA</text><text x="1820" y="420" class="tt2" fill="#0B0B0B">ETERNOS</text><text x="1820" y="1420" class="tt2" fill="#F4F2EC">MUTÁVEIS</text><text x="1820" y="2270" class="au" fill="#F4F2EC">LAÉRCIO GERMANO</text></svg></body></html>
