server {
    server_name eternos-mutaveis.laerciogermano.com eternosmutaveis.com www.eternosmutaveis.com;

    root /opt/eternos-mutaveis;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(mp3|jpg|jpeg|png|webp|css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/eternos-mutaveis.laerciogermano.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/eternos-mutaveis.laerciogermano.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot



}

server {
    if ($host = www.eternosmutaveis.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = eternosmutaveis.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = eternos-mutaveis.laerciogermano.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name eternos-mutaveis.laerciogermano.com eternosmutaveis.com www.eternosmutaveis.com;

    root /opt/eternos-mutaveis;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }






}
