services:
  db:
    image: postgres:16
    container_name: fitness-postgres
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness
      POSTGRES_DB: fitness
    ports:
      - "5433:5432"
    volumes:
      - fitness-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  fitness-pg:
