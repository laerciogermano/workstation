# Contabo: /etc/nginx/sites-available/fitness
# HTTPS: certbot --nginx -d fitness.laerciogermano.com

server {
    listen 80;
    listen [::]:80;
    server_name fitness.laerciogermano.com;

    root /opt/fitness;
    index index.html;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
