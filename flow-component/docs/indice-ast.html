<script type="module">
import * as acorn from "https://esm.sh/acorn@8.14.0";

const fn = (id, title, extra = {}) => ({
  t: "fn", id, title, agent: "file", resp: null,
  ins: [], outs: [], kids: [], par: false, ...extra,
});

const F = fn;
const J = (...l) => l.join("\n");
const main = (kids, extra = {}) => F("n1", "main", { file: "main.ts", kids, ...extra });

const EXAMPLES = {
  main: { num: "1.1", title: "The <code>main</code> function", lead: "First-order, solid, no input and no output.",
    code: J("async function main() {", "}"), flow: main([]) },
  filha: { num: "1.2", title: "Child function", lead: "Solid child inside <code>main</code>: <code>hello</code> has a file address (filled bar).",
    code: J("async function main() {", "  await hello();", "", "  async function hello() {", "  }", "}"),
    flow: main([F("n2", "hello")]) },
  paralela: { num: "1.3", title: "Parallel function", lead: "Solid siblings on the same step: <code>a</code> and <code>b</code> together (<code>par: true</code> → <code>Promise.all</code>).",
    code: J("async function main() {", "  await Promise.all([a(), b()]);", "", "  async function a() {", "  }", "  async function b() {", "  }", "}"),
    flow: main([F("n2", "a"), F("n3", "b", { par: true })]) },
  sequencial: { num: "1.4", title: "Sequential function", lead: "Solid siblings on the next step: <code>b</code> runs after <code>a</code> (<code>par: false</code>).",
    code: J("async function main() {", "  await a();", "  await b();", "", "  async function a() {", "  }", "  async function b() {", "  }", "}"),
    flow: main([F("n2", "a"), F("n3", "b")]) },
  entrada: { num: "1.5", title: "Function with input", lead: "Solid: <code>greet</code> takes a datum (square on the left). Input via variable; definitions at the bottom.",
    code: J("async function main() {", "  const name = \"Ana\";", "  await greet(name);", "", "  async function greet(name) {", "  }", "}"),
    flow: main([F("n2", "greet", { ins: ["name"] })]) },
  saida: { num: "1.6", title: "Function with output", lead: "Solid: <code>read</code> returns a datum (square on the right). Definition at the bottom; assign before <code>return</code>.",
    code: J("async function main() {", "  const name = await read();", "", "  async function read() {", "    const name = \"Ana\";", "    return name;", "  }", "}"),
    flow: main([F("n2", "read", { outs: ["name"] })]) },
  entradaSaida: { num: "1.7", title: "Linked input and output", lead: "Solid: one's output is the next's input. Concatenation = function; <code>hello</code> and <code>name</code> enter together in <code>[]</code>.",
    code: J("async function main() {", "  const name = await read();", "  const greeting = await greet(name);", "", "  async function read() {", "    const name = \"Ana\";", "    return name;", "  }", "  async function greet(name) {", "    const hello = \"Hello, \";", "    const parts = [hello, name];", "    const greeting = await concat(parts);", "    return greeting;", "", "    async function concat(parts) {", "      const greeting = parts;", "      return greeting;", "    }", "  }", "}"),
    flow: main([F("n2", "read", { outs: ["name"] }), F("n3", "greet", { ins: ["name"], outs: ["greeting"], kids: [F("n4", "concat", { ins: ["hello", "name"], outs: ["greeting"] })] })]) },
  neta: { num: "1.8", title: "Nested children", lead: "Solid: <code>order</code> is composition of <code>validate</code> and <code>charge</code>. Definitions at the bottom of each body.",
    code: J("async function main() {", "  await order();", "", "  async function order() {", "    await validate();", "    await charge();", "", "    async function validate() {", "    }", "    async function charge() {", "    }", "  }", "}"),
    flow: main([F("n2", "order", { kids: [F("n3", "validate"), F("n4", "charge")] })]) },
  mista: { num: "1.9", title: "Parallel then sequential", lead: "Solid: <code>a</code> and <code>b</code> together on step 0; <code>c</code> after. Definitions at the bottom.",
    code: J("async function main() {", "  await Promise.all([a(), b()]);", "  await c();", "", "  async function a() {", "  }", "  async function b() {", "  }", "  async function c() {", "  }", "}"),
    flow: main([F("n2", "a"), F("n3", "b", { par: true }), F("n4", "c")]) },

  texto: { num: "2.1", title: "Datum: text", lead: "Text travels as a single datum (square).",
    code: J("async function main() {", "  const name = await read();", "", "  async function read() {", "    const name = \"Ana\";", "    return name;", "  }", "}"),
    flow: main([F("n2", "read", { outs: ["name"] })]) },
  numero: { num: "2.2", title: "Datum: number", lead: "A number, also a single datum.",
    code: J("async function main() {", "  const total = await count();", "", "  async function count() {", "    const total = 42;", "    return total;", "  }", "}"),
    flow: main([F("n2", "count", { outs: ["total"] })]) },
  booleano: { num: "2.3", title: "Datum: boolean", lead: "True/false, usually used to choose a branch.",
    code: J("async function main() {", "  const ok = await check();", "", "  async function check() {", "    const ok = true;", "    return ok;", "  }", "}"),
    flow: main([F("n2", "check", { outs: ["ok"] })]) },
  funcaoDado: { num: "2.4", title: "Datum: function", lead: "Functions are data too: <code>apply</code> receives the function <code>double</code>.",
    code: J("async function main() {", "  const double = (x) => x * 2;", "  const r = await apply(double);", "", "  async function apply(fn) {", "    const x = 21;", "    const r = fn(x);", "    return r;", "  }", "}"),
    flow: main([F("n2", "apply", { ins: ["double"], outs: ["r"] })]) },
  objeto: { num: "2.5", title: "Datum: object (keyed box)", lead: "Several outputs form a <em>box</em> (cube): <code>{ name, age }</code>.",
    code: J("async function main() {", "  const { name, age } = await read();", "", "  async function read() {", "    const name = \"Ana\";", "    const age = 30;", "    const person = { name, age };", "    return person;", "  }", "}"),
    flow: main([F("n2", "read", { outs: ["name", "age"] })]) },
  array: { num: "2.6", title: "Datum: array (positional box)", lead: "Positional box: <code>[a, b]</code>.",
    code: J("async function main() {", "  const [a, b] = await read();", "", "  async function read() {", "    const a = 1;", "    const b = 2;", "    const list = [a, b];", "    return list;", "  }", "}"),
    flow: main([F("n2", "read", { outs: ["a", "b"] })]) },

  estado: { num: "3.1", title: "Flow state", lead: "State = available data. <code>send</code> sees <code>order</code> and <code>payment</code> produced earlier.",
    code: J("async function main() {", "  const order = await receive();", "  const payment = await charge(order);", "  await send(order, payment);", "", "  async function receive() {", "    const id = 1;", "    const order = { id };", "    return order;", "  }", "  async function charge(order) {", "    const payment = \"paid\";", "    return payment;", "  }", "  async function send(order, payment) {", "  }", "}"),
    flow: main([F("n2", "receive", { outs: ["order"] }), F("n3", "charge", { ins: ["order"], outs: ["payment"] }), F("n4", "send", { ins: ["order", "payment"] })]) },

  agArquivo: { num: "4.1", title: "Agent: file", lead: "The first-order function has the file as source: <code>main.ts</code>.",
    code: J("// main.ts", "async function main() {", "}"), flow: main([]) },
  agMaquina: { num: "4.2", title: "Agent: machine", lead: "A machine (library/service) does the work.",
    code: J("async function main() {", "  await machine.sendEmail();", "}"),
    flow: main([F("n2", "sendEmail", { agent: "machine" })]) },
  agIa: { num: "4.3", title: "Agent: AI", lead: "An AI does the work (light bar = abstract until someone takes it).",
    code: J("async function main() {", "  await ai.summarizeText();", "}"),
    flow: main([F("n2", "summarizeText", { agent: "ia" })]) },
  agPessoa: { num: "4.4", title: "Agent: person", lead: "A person is responsible for the step.",
    code: J("async function main() {", "  await person.approve();", "}"),
    flow: main([F("n2", "approve", { agent: "pessoa" })]) },
  agObjeto: { num: "4.5", title: "Agent: object", lead: "Any object that holds functions is an agent.",
    code: J("async function main() {", "  const cart = { add() {} };", "  await cart.add();", "}"),
    flow: main([F("n2", "add", { agent: "obj:cart" })]) },

  se: { num: "5.1", title: "Selection: if", lead: "<code>send</code> runs only when the condition is true.",
    code: J("async function main() {", "  const ok = true;", "  if (ok) {", "    await send();", "  }", "", "  async function send() {", "  }", "}"),
    flow: main([{ t: "if", id: "i1", test: "ok", kids: [F("n2", "send")], elseKids: [] }]) },
  seSenao: { num: "5.2", title: "Selection: if / else", lead: "The flow picks between two paths side by side: <code>if</code> and <code>else</code> share the same step (only one runs).", opts: { elseParallel: true },
    code: J("async function main() {", "  const approved = true;", "  if (approved) {", "    await send();", "  } else {", "    await review();", "  }", "", "  async function send() {", "  }", "  async function review() {", "  }", "}"),
    flow: main([{ t: "if", id: "i1", test: "approved", kids: [F("n2", "send")], elseKids: [F("n3", "review")] }]) },
  switchEx: { num: "5.3", title: "Selection: switch", lead: "Several cases = sequential <code>if</code>s (one per value).",
    code: J("async function main() {", "  const method = \"pix\";", "  switch (method) {", "    case \"pix\":", "      await payPix();", "      break;", "    case \"card\":", "      await payCard();", "      break;", "  }", "", "  async function payPix() {", "  }", "  async function payCard() {", "  }", "}"),
    flow: main([
      { t: "if", id: "i1", test: "method === 'pix'", kids: [F("n2", "payPix")], elseKids: [] },
      { t: "if", id: "i2", test: "method === 'card'", kids: [F("n3", "payCard")], elseKids: [] },
    ]) },

  repFor: { num: "6.1", title: "Loop: for", lead: "<code>notify</code> runs once for each item in the collection.",
    code: J("async function main() {", "  const items = [1, 2];", "  for (const item of items) {", "    await notify(item);", "  }", "", "  async function notify(item) {", "  }", "}"),
    flow: main([{ t: "for", id: "l1", v: "item", coll: "items", kids: [F("n2", "notify", { ins: ["item"] })] }]) },
  repFor2: { num: "6.2", title: "Loop with several steps", lead: "The <code>for</code> body can have sequential and parallel steps.",
    code: J("async function main() {", "  const items = [1, 2];", "  for (const item of items) {", "    await validate(item);", "    await save(item);", "  }", "", "  async function validate(item) {", "  }", "  async function save(item) {", "  }", "}"),
    flow: main([{ t: "for", id: "l1", v: "item", coll: "items", kids: [F("n2", "validate", { ins: ["item"] }), F("n3", "save", { ins: ["item"] })] }]) },
  repWhile: { num: "6.3", title: "Loop: while / do-while", lead: "In the current model, <code>while</code> and <code>do-while</code> use the same loop block (<code>for</code>) — the label shows the collection/condition.",
    code: J("async function main() {", "  const pending = true;", "  while (pending) {", "    await tryOnce();", "  }", "", "  async function tryOnce() {", "  }", "}"),
    flow: main([{ t: "for", id: "l1", v: "attempt", coll: "pending", kids: [F("n2", "tryOnce")] }]) },

  tryCatch: { num: "7.1", title: "try / catch", lead: "If <code>charge</code> fails, the flow goes to <code>catch</code> and runs <code>warn</code>.",
    code: J("async function main() {", "  try {", "    await charge();", "  } catch (error) {", "    await warn();", "  }", "", "  async function charge() {", "  }", "  async function warn() {", "  }", "}"),
    flow: main([{ t: "try", id: "t1", kids: [F("n2", "charge")], catchKids: [F("n3", "warn")] }]) },
  tryFor: { num: "7.2", title: "Combined blocks", lead: "Blocks nest: a <code>try/catch</code> inside a <code>for</code>.",
    code: J("async function main() {", "  const items = [1, 2];", "  for (const item of items) {", "    try {", "      await send(item);", "    } catch (error) {", "      await logFailure();", "    }", "  }", "", "  async function send(item) {", "  }", "  async function logFailure() {", "  }", "}"),
    flow: main([{ t: "for", id: "l1", v: "item", coll: "items", kids: [
      { t: "try", id: "t1", kids: [F("n2", "send", { ins: ["item"] })], catchKids: [F("n3", "logFailure")] },
    ] }]) },

  fileMesmo: { num: "8.1", title: "Two functions in the same file", lead: "Each first-order function has a physical address: <code>main</code> and <code>util</code> in <code>app.ts</code>.",
    code: J("// app.ts", "async function main() {", "}", "async function util() {", "}"),
    flows: [F("n1", "main", { file: "app.ts" }), F("n2", "util", { file: "app.ts" })] },
  fileOutro: { num: "8.2", title: "Different files", lead: "Distinct files organize addresses: <code>main.ts</code> and <code>payment.ts</code> (do not confuse file with layer).",
    code: J("// main.ts", "import { pay } from \"./payment\";", "async function main() {", "  await pay();", "}", "", "// payment.ts", "export async function pay() {", "}"),
    flows: [main([F("n2", "pay")]), F("n3", "pay", { file: "payment.ts" })] },

  abstrata: { num: "9.1", title: "Layer (= abstract)", lead: "Abstract topic: no physical address — outline bar only (universal plan to fill). Only intentionally hollow case.",
    code: J("async function main() {", "  const { hello } = state;", "  await hello();", "}"),
    flow: main([F("n2", "hello", { agent: null })]) },

  solida: { num: "10.1", title: "Solid", lead: "Has a physical address: the bar is filled (an agent runs it). The abstract layer solidifies.",
    code: J("async function main() {", "  await machine.hello();", "}"),
    flow: main([F("n2", "hello", { agent: "machine" })]) },

  publica: { num: "11.1", title: "Public", lead: "Reachable from outside the file: <code>export</code>.",
    code: J("export async function main() {", "}"), flow: main([]) },
  privada: { num: "11.2", title: "Private", lead: "Solid and only exists inside the file/box: no <code>export</code>.",
    code: J("async function main() {", "  await inner();", "", "  async function inner() {", "  }", "}"), flow: main([F("n2", "inner")]) },
};

const GROUPS = [
  { id: "funcoes", n: "1.", title: "Functions", keys: ["main", "filha", "paralela", "sequencial", "entrada", "saida", "entradaSaida", "neta", "mista"] },
  { id: "dados", n: "2.", title: "Data", keys: ["texto", "numero", "booleano", "funcaoDado", "objeto", "array"] },
  { id: "estados", n: "3.", title: "State", keys: ["estado"] },
  { id: "agentes", n: "4.", title: "Agents", keys: ["agArquivo", "agMaquina", "agIa", "agPessoa", "agObjeto"] },
  { id: "selecao", n: "5.", title: "Selection", keys: ["se", "seSenao", "switchEx"] },
  { id: "repeticao", n: "6.", title: "Loops", keys: ["repFor", "repFor2", "repWhile"] },
  { id: "trycatch", n: "7.", title: "try / catch", keys: ["tryCatch", "tryFor"] },
  { id: "files", n: "8.", title: "Files", keys: ["fileMesmo", "fileOutro"] },
  { id: "camadas", n: "9.", title: "Layers (= abstracts)", keys: ["abstrata"] },
  { id: "solidos", n: "10.", title: "Solids", keys: ["solida"] },
  { id: "publico", n: "11.", title: "Public / private", keys: ["publica", "privada"] },
];
const ANCHOR = { main: "main", filha: "filha", paralela: "paralela", sequencial: "sequencial" };
const anchor = (k) => ANCHOR[k] ?? k;

const prune = (node) => {
  if (!node || typeof node !== "object") return node;
  if (Array.isArray(node)) return node.map(prune);
  const out = {};
  for (const [k, v] of Object.entries(node)) {
    if (k === "start" || k === "end" || k === "loc" || k === "range") continue;
    out[k] = prune(v);
  }
  return out;
};

const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

const planOf = (flow, opts) => typeof FlowAst?.renderFnSvg === "function" ? FlowAst.renderFnSvg(flow, opts).svg : "";

const paint = (key, ex) => {
  const el = document.getElementById(anchor(key));
  let estree = "";
  try {
    estree = JSON.stringify(prune(acorn.parse(ex.code, { ecmaVersion: "latest", sourceType: "module" })), null, 2);
  } catch (e) {
    estree = e.message;
  }

  const flows = ex.flows ?? [ex.flow];
  const planErr = typeof FlowAst?.renderFnSvg === "function" ? "" : "fn-svg.js missing — run: npm run example:build";
  const flowJson = flows.map((f) => JSON.stringify(f, null, 2)).join("\n");
  const plans = flows.map((f) => `${flows.length > 1 ? `<div class="lab"><span class="kind">${esc(f.file ?? "")}</span> ${esc(f.title)}</div>` : ""}<div class="svg-host">${planOf(f, ex.opts)}</div>`).join("");

  el.innerHTML = `
    <h3><span class="n">${esc(ex.num)}</span>${ex.title}</h3>
    <p class="sec-lead">${ex.lead}</p>
    <div class="lab"><span class="kind">JS</span> Code</div>
    <div class="pane"><div class="hd">JavaScript <span class="tag">source</span></div><pre>${esc(ex.code)}</pre></div>
    <div class="lab"><span class="kind">ESTree</span> Syntax tree</div>
    <div class="pane ast"><div class="hd">Code AST <span class="tag">Acorn</span></div><pre>${esc(estree)}</pre></div>
    <div class="lab"><span class="kind">Flow</span> Flow AST</div>
    <div class="pane ast"><div class="hd">flow-novo IR <span class="tag">Fn</span></div><pre>${esc(flowJson)}</pre></div>
    <div class="lab"><span class="kind">Plan</span> View</div>
    <div class="pane plan">
      <div class="hd">SVG <span class="tag">renderFnSvg</span></div>
      ${plans}
      ${planErr ? `<div class="err">${esc(planErr)}</div>` : ""}
    </div>`;
};

const out = document.getElementById("out"), toc = document.getElementById("toc");
for (const g of GROUPS) {
  const keys = g.keys.filter((k) => EXAMPLES[k]);
  out.insertAdjacentHTML("beforeend", `<h2 id="${g.id}"><span class="n">${g.n}</span>${esc(g.title)}</h2>${keys.map((k) => `<section id="${anchor(k)}"></section>`).join("")}`);
  toc.insertAdjacentHTML("beforeend", `<li><a href="#${g.id}">${esc(g.title)}</a><ul>${keys.map((k) => `<li><a href="#${anchor(k)}">${EXAMPLES[k].num} ${EXAMPLES[k].title}</a></li>`).join("")}</ul></li>`);
  for (const k of keys) paint(k, EXAMPLES[k]);
}
</script>
</body>
</html>
