:root {

main { max-width: 46rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

}

.lab {

}

<script type="module">
import * as acorn from "https://esm.sh/acorn@8.14.0";

const fn = (id, title, extra = {}) => ({
  t: "fn", id, title, agent: "arquivo", resp: null,
  ins: [], outs: [], kids: [], par: false, ...extra,
});

const F = fn;
const J = (...l) => l.join("\n");
const main = (kids, extra = {}) => F("n1", "main", { file: "main.ts", kids, ...extra });

const EXAMPLES = {
  main: { num: "1.1", title: "A função <code>main</code>", lead: "1ª ordem, sólida, sem entrada e sem saída.",
    code: J("async function main() {", "}"), flow: main([]) },
  filha: { num: "1.2", title: "Função filha", lead: "Filho sólido dentro de <code>main</code>: <code>hello</code> tem endereço no arquivo (barra preenchida).",
    code: J("async function main() {", "  await hello();", "", "  async function hello() {", "  }", "}"),
    flow: main([F("n2", "hello")]) },
  paralela: { num: "1.3", title: "Função paralela", lead: "Irmãs sólidas no mesmo passo: <code>a</code> e <code>b</code> juntas (<code>par: true</code> → <code>Promise.all</code>).",
    code: J("async function main() {", "  await Promise.all([a(), b()]);", "", "  async function a() {", "  }", "  async function b() {", "  }", "}"),
    flow: main([F("n2", "a"), F("n3", "b", { par: true })]) },
  sequencial: { num: "1.4", title: "Função sequencial", lead: "Irmãs sólidas no passo seguinte: <code>b</code> roda depois de <code>a</code> (<code>par: false</code>).",
    code: J("async function main() {", "  await a();", "  await b();", "", "  async function a() {", "  }", "  async function b() {", "  }", "}"),
    flow: main([F("n2", "a"), F("n3", "b")]) },
  entrada: { num: "1.5", title: "Função com entrada", lead: "Sólida: <code>saudar</code> recebe um dado (quadrado à esquerda). Entrada por variável; definições no fim.",
    code: J("async function main() {", "  const nome = \"Ana\";", "  await saudar(nome);", "", "  async function saudar(nome) {", "  }", "}"),
    flow: main([F("n2", "saudar", { ins: ["nome"] })]) },
  saida: { num: "1.6", title: "Função com saída", lead: "Sólida: <code>ler</code> devolve um dado (quadrado à direita). Definição no fim; valor atribuído antes do <code>return</code>.",
    code: J("async function main() {", "  const nome = await ler();", "", "  async function ler() {", "    const nome = \"Ana\";", "    return nome;", "  }", "}"),
    flow: main([F("n2", "ler", { outs: ["nome"] })]) },
  entradaSaida: { num: "1.7", title: "Entrada e saída ligadas", lead: "Sólidas: a saída de uma é a entrada da próxima. Concatenação = função; <code>ola</code> e <code>nome</code> entram juntos em <code>[]</code>.",
    code: J("async function main() {", "  const nome = await ler();", "  const saudacao = await saudar(nome);", "", "  async function ler() {", "    const nome = \"Ana\";", "    return nome;", "  }", "  async function saudar(nome) {", "    const ola = \"Olá, \";", "    const partes = [ola, nome];", "    const saudacao = await concatenar(partes);", "    return saudacao;", "", "    async function concatenar(partes) {", "    }", "  }", "}"),
    flow: main([F("n2", "ler", { outs: ["nome"] }), F("n3", "saudar", { ins: ["nome"], outs: ["saudacao"], kids: [F("n4", "concatenar", { ins: ["ola", "nome"], outs: ["saudacao"] })] })]) },
  neta: { num: "1.8", title: "Filhas aninhadas", lead: "Sólidas: <code>pedido</code> é composição de <code>validar</code> e <code>cobrar</code>. Definições no fim de cada corpo.",
    code: J("async function main() {", "  await pedido();", "", "  async function pedido() {", "    await validar();", "    await cobrar();", "", "    async function validar() {", "    }", "    async function cobrar() {", "    }", "  }", "}"),
    flow: main([F("n2", "pedido", { kids: [F("n3", "validar"), F("n4", "cobrar")] })]) },
  mista: { num: "1.9", title: "Paralela e depois sequencial", lead: "Sólidas: <code>a</code> e <code>b</code> juntas no passo 0; <code>c</code> depois. Definições no fim.",
    code: J("async function main() {", "  await Promise.all([a(), b()]);", "  await c();", "", "  async function a() {", "  }", "  async function b() {", "  }", "  async function c() {", "  }", "}"),
    flow: main([F("n2", "a"), F("n3", "b", { par: true }), F("n4", "c")]) },

  texto: { num: "2.1", title: "Dado: texto", lead: "Um texto trafega como dado único (quadrado).",
    code: J("async function main() {", "  const nome = await ler();", "", "  async function ler() {", "    const nome = \"Ana\";", "    return nome;", "  }", "}"),
    flow: main([F("n2", "ler", { outs: ["nome"] })]) },
  numero: { num: "2.2", title: "Dado: número", lead: "Um número, também um dado único.",
    code: J("async function main() {", "  const total = await contar();", "", "  async function contar() {", "    const total = 42;", "    return total;", "  }", "}"),
    flow: main([F("n2", "contar", { outs: ["total"] })]) },
  booleano: { num: "2.3", title: "Dado: booleano", lead: "Um verdadeiro/falso, normalmente usado para decidir um desvio.",
    code: J("async function main() {", "  const ok = await validar();", "", "  async function validar() {", "    const ok = true;", "    return ok;", "  }", "}"),
    flow: main([F("n2", "validar", { outs: ["ok"] })]) },
  funcaoDado: { num: "2.4", title: "Dado: função", lead: "Funções também são dados: <code>aplicar</code> recebe a função <code>dobrar</code>.",
    code: J("async function main() {", "  const dobrar = (x) => x * 2;", "  const r = await aplicar(dobrar);", "", "  async function aplicar(fn) {", "    const x = 21;", "    const r = fn(x);", "    return r;", "  }", "}"),
    flow: main([F("n2", "aplicar", { ins: ["dobrar"], outs: ["r"] })]) },
  objeto: { num: "2.5", title: "Dado: objeto (caixa chaveada)", lead: "Várias saídas formam uma <em>caixa</em> (cubo): <code>{ nome, idade }</code>.",
    code: J("async function main() {", "  const { nome, idade } = await ler();", "", "  async function ler() {", "    const nome = \"Ana\";", "    const idade = 30;", "    const pessoa = { nome, idade };", "    return pessoa;", "  }", "}"),
    flow: main([F("n2", "ler", { outs: ["nome", "idade"] })]) },
  array: { num: "2.6", title: "Dado: array (caixa posicional)", lead: "Caixa posicional: <code>[a, b]</code>.",
    code: J("async function main() {", "  const [a, b] = await ler();", "", "  async function ler() {", "    const a = 1;", "    const b = 2;", "    const lista = [a, b];", "    return lista;", "  }", "}"),
    flow: main([F("n2", "ler", { outs: ["a", "b"] })]) },

  estado: { num: "3.1", title: "Estado do fluxo", lead: "Estado = os dados disponíveis. <code>enviar</code> enxerga <code>pedido</code> e <code>pagamento</code> produzidos antes.",
    code: J("async function main() {", "  const pedido = await receber();", "  const pagamento = await cobrar(pedido);", "  await enviar(pedido, pagamento);", "", "  async function receber() {", "    const id = 1;", "    const pedido = { id };", "    return pedido;", "  }", "  async function cobrar(pedido) {", "    const pagamento = \"pago\";", "    return pagamento;", "  }", "  async function enviar(pedido, pagamento) {", "  }", "}"),
    flow: main([F("n2", "receber", { outs: ["pedido"] }), F("n3", "cobrar", { ins: ["pedido"], outs: ["pagamento"] }), F("n4", "enviar", { ins: ["pedido", "pagamento"] })]) },

  agArquivo: { num: "4.1", title: "Agente: arquivo", lead: "A função de 1ª ordem tem o arquivo como fonte: <code>main.ts</code>.",
    code: J("// main.ts", "async function main() {", "}"), flow: main([]) },
  agMaquina: { num: "4.2", title: "Agente: máquina", lead: "Uma máquina (biblioteca/serviço) executa o trabalho.",
    code: J("async function main() {", "  await maquina.enviarEmail();", "}"),
    flow: main([F("n2", "enviarEmail", { agent: "maquina" })]) },
  agIa: { num: "4.3", title: "Agente: IA", lead: "Uma IA realiza o trabalho (barra clara = abstrata até alguém assumir).",
    code: J("async function main() {", "  await ia.resumirTexto();", "}"),
    flow: main([F("n2", "resumirTexto", { agent: "ia" })]) },
  agPessoa: { num: "4.4", title: "Agente: pessoa", lead: "Uma pessoa é a responsável pelo passo.",
    code: J("async function main() {", "  await pessoa.aprovar();", "}"),
    flow: main([F("n2", "aprovar", { agent: "pessoa" })]) },
  agObjeto: { num: "4.5", title: "Agente: objeto", lead: "Todo objeto que comporta funções é um agente.",
    code: J("async function main() {", "  const carrinho = { adicionar() {} };", "  await carrinho.adicionar();", "}"),
    flow: main([F("n2", "adicionar", { agent: "obj:carrinho" })]) },

  se: { num: "5.1", title: "Seleção: if", lead: "<code>enviar</code> só roda se a condição for verdadeira.",
    code: J("async function main() {", "  const ok = true;", "  if (ok) {", "    await enviar();", "  }", "", "  async function enviar() {", "  }", "}"),
    flow: main([{ t: "if", id: "i1", test: "ok", kids: [F("n2", "enviar")], elseKids: [] }]) },
  seSenao: { num: "5.2", title: "Seleção: if / else", lead: "O fluxo escolhe entre dois caminhos, lado a lado: <code>if</code> e <code>else</code> ocupam o mesmo passo (só um deles executa).", opts: { elseParallel: true },
    code: J("async function main() {", "  const aprovada = true;", "  if (aprovada) {", "    await enviar();", "  } else {", "    await revisar();", "  }", "", "  async function enviar() {", "  }", "  async function revisar() {", "  }", "}"),
    flow: main([{ t: "if", id: "i1", test: "aprovada", kids: [F("n2", "enviar")], elseKids: [F("n3", "revisar")] }]) },
  switchEx: { num: "5.3", title: "Seleção: switch", lead: "Vários casos = <code>if</code> em sequência (um por valor).",
    code: J("async function main() {", "  const meio = \"pix\";", "  switch (meio) {", "    case \"pix\":", "      await pagarPix();", "      break;", "    case \"cartao\":", "      await pagarCartao();", "      break;", "  }", "", "  async function pagarPix() {", "  }", "  async function pagarCartao() {", "  }", "}"),
    flow: main([
      { t: "if", id: "i1", test: "meio === 'pix'", kids: [F("n2", "pagarPix")], elseKids: [] },
      { t: "if", id: "i2", test: "meio === 'cartao'", kids: [F("n3", "pagarCartao")], elseKids: [] },
    ]) },

  repFor: { num: "6.1", title: "Repetição: for", lead: "<code>notificar</code> roda uma vez para cada item da coleção.",
    code: J("async function main() {", "  const itens = [1, 2];", "  for (const item of itens) {", "    await notificar(item);", "  }", "", "  async function notificar(item) {", "  }", "}"),
    flow: main([{ t: "for", id: "l1", v: "item", coll: "itens", kids: [F("n2", "notificar", { ins: ["item"] })] }]) },
  repFor2: { num: "6.2", title: "Repetição com vários passos", lead: "O corpo do <code>for</code> pode ter passos em sequência e em paralelo.",
    code: J("async function main() {", "  const itens = [1, 2];", "  for (const item of itens) {", "    await validar(item);", "    await salvar(item);", "  }", "", "  async function validar(item) {", "  }", "  async function salvar(item) {", "  }", "}"),
    flow: main([{ t: "for", id: "l1", v: "item", coll: "itens", kids: [F("n2", "validar", { ins: ["item"] }), F("n3", "salvar", { ins: ["item"] })] }]) },
  repWhile: { num: "6.3", title: "Repetição: while / do-while", lead: "No modelo atual, <code>while</code> e <code>do-while</code> são expressos com o mesmo bloco de repetição (<code>for</code>) — o rótulo mostra a coleção/condição.",
    code: J("async function main() {", "  const pendente = true;", "  while (pendente) {", "    await tentar();", "  }", "", "  async function tentar() {", "  }", "}"),
    flow: main([{ t: "for", id: "l1", v: "tentativa", coll: "pendente", kids: [F("n2", "tentar")] }]) },

  tryCatch: { num: "7.1", title: "try / catch", lead: "Se <code>cobrar</code> falhar, o fluxo segue para o <code>catch</code> e executa <code>avisar</code>.",
    code: J("async function main() {", "  try {", "    await cobrar();", "  } catch (error) {", "    await avisar();", "  }", "", "  async function cobrar() {", "  }", "  async function avisar() {", "  }", "}"),
    flow: main([{ t: "try", id: "t1", kids: [F("n2", "cobrar")], catchKids: [F("n3", "avisar")] }]) },
  tryFor: { num: "7.2", title: "Blocos combinados", lead: "Blocos se aninham: um <code>try/catch</code> dentro de um <code>for</code>.",
    code: J("async function main() {", "  const itens = [1, 2];", "  for (const item of itens) {", "    try {", "      await enviar(item);", "    } catch (error) {", "      await registrarFalha();", "    }", "  }", "", "  async function enviar(item) {", "  }", "  async function registrarFalha() {", "  }", "}"),
    flow: main([{ t: "for", id: "l1", v: "item", coll: "itens", kids: [
      { t: "try", id: "t1", kids: [F("n2", "enviar", { ins: ["item"] })], catchKids: [F("n3", "registrarFalha")] },
    ] }]) },

  fileMesmo: { num: "8.1", title: "Duas funções no mesmo arquivo", lead: "Cada função de 1ª ordem tem endereço físico: <code>main</code> e <code>util</code> em <code>app.ts</code>.",
    code: J("// app.ts", "async function main() {", "}", "async function util() {", "}"),
    flows: [F("n1", "main", { file: "app.ts" }), F("n2", "util", { file: "app.ts" })] },
  fileOutro: { num: "8.2", title: "Arquivos diferentes", lead: "Arquivos distintos organizam endereços: <code>main.ts</code> e <code>pagamento.ts</code> (não confundir arquivo com camada).",
    code: J("// main.ts", "import { pagar } from \"./pagamento\";", "async function main() {", "  await pagar();", "}", "", "// pagamento.ts", "export async function pagar() {", "}"),
    flows: [main([F("n2", "pagar")]), F("n3", "pagar", { file: "pagamento.ts" })] },

  abstrata: { num: "9.1", title: "Camada (= abstrato)", lead: "Assunto abstrato: sem endereço físico — barra só contorno (plano universal a preencher). Único caso vazado de propósito.",
    code: J("async function main() {", "  const { hello } = state;", "  await hello();", "}"),
    flow: main([F("n2", "hello", { agent: null })]) },

  solida: { num: "10.1", title: "Sólido", lead: "Tem endereço físico: a barra é preenchida (um agente executa). A camada abstrata solidifica.",
    code: J("async function main() {", "  await maquina.hello();", "}"),
    flow: main([F("n2", "hello", { agent: "maquina" })]) },

  publica: { num: "11.1", title: "Pública", lead: "Acessível de fora do arquivo: <code>export</code>.",
    code: J("export async function main() {", "}"), flow: main([]) },
  privada: { num: "11.2", title: "Privada", lead: "Sólida e só existe dentro do arquivo/caixa: sem <code>export</code>.",
    code: J("async function main() {", "  await interna();", "", "  async function interna() {", "  }", "}"), flow: main([F("n2", "interna")]) },
};

  { id: "publico", n: "11.", title: "Público / privado", keys: ["publica", "privada"] },
];
const ANCHOR = { main: "main", filha: "filha", paralela: "paralela", sequencial: "sequencial" };
const anchor = (k) => ANCHOR[k] ?? k;

const prune = (node) => {
  if (!node || typeof node !== "object") return node;
  if (Array.isArray(node)) return node.map(prune);
  const out = {};
  for (const [k, v] of Object.entries(node)) {
    if (k === "start" || k === "end" || k === "loc" || k === "range") continue;
    out[k] = prune(v);
  }
  return out;
};

const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

const planOf = (flow, opts) => typeof FlowAst?.renderFnSvg === "function" ? FlowAst.renderFnSvg(flow, opts).svg : "";

const paint = (key, ex) => {
  const el = document.getElementById(anchor(key));
  let estree = "";
  try {
    estree = JSON.stringify(prune(acorn.parse(ex.code, { ecmaVersion: "latest", sourceType: "module" })), null, 2);
  } catch (e) {
    estree = e.message;
  }

  const flows = ex.flows ?? [ex.flow];
  const planErr = typeof FlowAst?.renderFnSvg === "function" ? "" : "fn-svg.js ausente — rode: npm run example:build";
  const flowJson = flows.map((f) => JSON.stringify(f, null, 2)).join("\n");
  const plans = flows.map((f) => `${flows.length > 1 ? `<div class="lab"><span class="kind">${esc(f.file ?? "")}</span> ${esc(f.title)}</div>` : ""}<div class="svg-host">${planOf(f, ex.opts)}</div>`).join("");

  el.innerHTML = `
    <h3><span class="n">${esc(ex.num)}</span>${ex.title}</h3>
    <p class="sec-lead">${ex.lead}</p>
    <div class="lab"><span class="kind">JS</span> Código</div>
    <div class="pane"><div class="hd">JavaScript <span class="tag">fonte</span></div><pre>${esc(ex.code)}</pre></div>
    <div class="lab"><span class="kind">ESTree</span> Árvore sintática</div>
    <div class="pane ast"><div class="hd">AST do código <span class="tag">Acorn</span></div><pre>${esc(estree)}</pre></div>
    <div class="lab"><span class="kind">Flow</span> AST do fluxo</div>
    <div class="pane ast"><div class="hd">IR flow-novo <span class="tag">Fn</span></div><pre>${esc(flowJson)}</pre></div>
    <div class="lab"><span class="kind">Plano</span> Visão</div>
    <div class="pane plan">
      <div class="hd">SVG <span class="tag">renderFnSvg</span></div>
      ${plans}
      ${planErr ? `<div class="err">${esc(planErr)}</div>` : ""}
    </div>`;
};

const out = document.getElementById("out"), toc = document.getElementById("toc");
for (const g of GROUPS) {
  const keys = g.keys.filter((k) => EXAMPLES[k]);
  out.insertAdjacentHTML("beforeend", `<h2 id="${g.id}"><span class="n">${g.n}</span>${esc(g.title)}</h2>${keys.map((k) => `<section id="${anchor(k)}"></section>`).join("")}`);
  toc.insertAdjacentHTML("beforeend", `<li><a href="#${g.id}">${esc(g.title)}</a><ul>${keys.map((k) => `<li><a href="#${anchor(k)}">${EXAMPLES[k].num} ${EXAMPLES[k].title}</a></li>`).join("")}</ul></li>`);
  for (const k of keys) paint(k, EXAMPLES[k]);
}
</script>
</body>
</html>
