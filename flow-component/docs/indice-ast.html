<style>
:root, [data-theme="black"] {
  color-scheme: dark;
  --paper: #000; --paper-2: #121212; --ink: #f2f2f2; --body: #a3a3a3;
  --accent: #ff6a52; --line: #262626;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
[data-theme="white"] {
  color-scheme: light;
  --paper: #fff; --paper-2: #f4f1ea; --ink: #14120f; --body: #44423d;
  --accent: #e0402b; --line: #e7e3db;
}
:root {
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 1.05rem/1.58 Newsreader, Georgia, serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-underline-offset: 3px; }
a:hover { color: var(--ink); }
code, pre { font-family: var(--mono); }

.top {
  display: flex; align-items: center; gap: 1rem;
  height: 3.5rem; padding: 0 1.25rem;
  border-bottom: 1px solid var(--line);
  font-family: Archivo, sans-serif;
}
.brand { font-weight: 800; letter-spacing: -.02em; color: var(--ink); text-decoration: none; }
.brand span { color: var(--accent); }
.top nav a {
  font-size: .72rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  color: var(--body); text-decoration: none; margin-right: .75rem;
}
.sp { flex: 1; }
.themes { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; margin-right: .75rem; }
.themes button {
  font: 600 .68rem/1 Archivo, sans-serif; letter-spacing: .05em; text-transform: uppercase;
  padding: .45rem .8rem; border: 0; background: transparent; color: var(--body); cursor: pointer;
}
.themes button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.meta { font-size: .75rem; font-weight: 600; color: var(--body); }

main { max-width: 46rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
h1 {
  margin: 0 0 .4rem;
  font: 800 clamp(1.8rem, 4vw, 2.4rem)/1.12 Archivo, sans-serif;
  letter-spacing: -.02em;
}
.lead { margin: 0 0 1.75rem; color: var(--body); max-width: 36rem; }
h2 {
  margin: 2rem 0 .75rem; padding-top: 1.25rem; border-top: 1px solid var(--line);
  font: 700 1.35rem/1.2 Archivo, sans-serif; letter-spacing: -.015em;
}
h3 { margin: 1.5rem 0 .5rem; font: 700 1.1rem/1.25 Archivo, sans-serif; }
h2 .n, h3 .n { font: 600 .8rem/1 var(--mono); color: var(--accent); margin-right: .4rem; }
.sec-lead { margin: 0 0 1rem; color: var(--body); }

.lab {
  margin: 0 0 .35rem;
  font: 700 .68rem/1 Archivo, sans-serif;
  letter-spacing: .06em; text-transform: uppercase; color: var(--body);
}
.lab .kind { color: var(--accent); margin-right: .35rem; }

.pane {
  border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
  margin: 0 0 .75rem; background: var(--paper);
}
.pane > summary.hd {
  display: flex; align-items: center; gap: .5rem; min-height: 2rem; padding: 0 .85rem;
  background: var(--paper-2);
  font: 600 .72rem/1 Archivo, sans-serif;
  letter-spacing: .04em; text-transform: uppercase; color: var(--body);
  cursor: pointer; list-style: none; user-select: none;
}
.pane > summary.hd::-webkit-details-marker { display: none; }
.pane > summary.hd::before {
  content: "▸"; color: var(--accent); font-size: .7rem; width: .7rem;
  transition: transform .12s ease;
}
.pane[open] > summary.hd::before { transform: rotate(90deg); }
.pane[open] > summary.hd { border-bottom: 1px solid var(--line); }
.pane .hd .kind { color: var(--accent); margin-right: .2rem; }
.pane .hd .tag { margin-left: auto; font-weight: 700; color: var(--accent); font-size: .65rem; }
.pane .body { background: var(--paper); }
.pane pre {
  margin: 0; padding: .85rem 1rem; overflow: auto;
  font-size: .78rem; line-height: 1.55; color: var(--ink); white-space: pre;
}
.pane.ast pre { color: var(--body); max-height: 18rem; }
.pane.plan .body { padding: 1rem; overflow: auto; background: var(--paper-2); }
.pane.plan .svg-host { overflow: auto; }
.err { color: var(--accent); font-family: var(--mono); font-size: .78rem; padding: .5rem 0; }

.toc {
  margin: 0 0 1.75rem; padding: .85rem 1rem;
  border: 1px solid var(--line); border-radius: 6px;
  font: 600 .85rem/1.5 Archivo, sans-serif;
}
.toc .t { font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; color: var(--body); margin-bottom: .35rem; }
.toc ol { margin: 0; padding-left: 1.25rem; }
.toc ul { list-style: none; margin: .25rem 0 0; padding-left: 1rem; }

footer {
  margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--line);
  font: 600 .75rem/1.45 Archivo, sans-serif; color: var(--body);
}
</style>
<script>
(() => {
  const set = (t) => {
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem("flow-docs-theme", t); } catch {}
    document.querySelectorAll("[data-theme-set]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.themeSet === t)));
  };
  let t = "black"; try { t = localStorage.getItem("flow-docs-theme") || "black"; } catch {}
  document.documentElement.dataset.theme = t;
  addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll("[data-theme-set]").forEach((b) => b.addEventListener("click", () => set(b.dataset.themeSet)));
    set(t);
  });
})();
</script>
<script src="fn-svg.js"></script>

<script type="module">
import * as acorn from "https://esm.sh/acorn@8.14.0";

const fn = (id, title, extra = {}) => ({
  t: "fn", id, title, agent: "arquivo", resp: null,
  ins: [], outs: [], kids: [], par: false, ...extra,
});

const F = fn;
const J = (...l) => l.join("\n");
const main = (kids, extra = {}) => F("n1", "main", { file: "main.ts", kids, ...extra });

const EXAMPLES = {
  main: { num: "1.1", title: "A função <code>main</code>", lead: "1ª ordem, sólida, sem entrada e sem saída.",
    code: J("async function main() {", "}"), flow: main([]) },
  filha: { num: "1.2", title: "Função filha", lead: "Filho sólido dentro de <code>main</code>: <code>hello</code> tem endereço no arquivo (barra preenchida).",
    code: J("async function main() {", "  await hello();", "", "  async function hello() {", "  }", "}"),
    flow: main([F("n2", "hello")]) },
  paralela: { num: "1.3", title: "Função paralela", lead: "Irmãs sólidas no mesmo passo: <code>a</code> e <code>b</code> juntas (<code>par: true</code> → <code>Promise.all</code>).",
    code: J("async function main() {", "  await Promise.all([a(), b()]);", "", "  async function a() {", "  }", "  async function b() {", "  }", "}"),
    flow: main([F("n2", "a"), F("n3", "b", { par: true })]) },
  sequencial: { num: "1.4", title: "Função sequencial", lead: "Irmãs sólidas no passo seguinte: <code>b</code> roda depois de <code>a</code> (<code>par: false</code>).",
    code: J("async function main() {", "  await a();", "  await b();", "", "  async function a() {", "  }", "  async function b() {", "  }", "}"),
    flow: main([F("n2", "a"), F("n3", "b")]) },
  entrada: { num: "1.5", title: "Função com entrada", lead: "Sólida: <code>saudar</code> recebe um dado (quadrado à esquerda). Entrada por variável; definições no fim.",
    code: J("async function main() {", "  const nome = \"Ana\";", "  await saudar(nome);", "", "  async function saudar(nome) {", "  }", "}"),
    flow: main([F("n2", "saudar", { ins: ["nome"] })]) },
  saida: { num: "1.6", title: "Função com saída", lead: "Sólida: <code>ler</code> devolve um dado (quadrado à direita). Definição no fim; valor atribuído antes do <code>return</code>.",
    code: J("async function main() {", "  const nome = await ler();", "", "  async function ler() {", "    const nome = \"Ana\";", "    return nome;", "  }", "}"),
    flow: main([F("n2", "ler", { outs: ["nome"] })]) },
  entradaSaida: { num: "1.7", title: "Entrada e saída ligadas", lead: "Sólidas: a saída de uma é a entrada da próxima. Concatenação = função; <code>ola</code> e <code>nome</code> entram juntos em <code>[]</code>; <code>concatenar</code> tem <code>return</code>.",
    code: J("async function main() {", "  const nome = await ler();", "  const saudacao = await saudar(nome);", "", "  async function ler() {", "    const nome = \"Ana\";", "    return nome;", "  }", "  async function saudar(nome) {", "    const ola = \"Olá, \";", "    const partes = [ola, nome];", "    const saudacao = await concatenar(partes);", "    return saudacao;", "", "    async function concatenar(partes) {", "      const saudacao = partes;", "      return saudacao;", "    }", "  }", "}"),
    flow: main([F("n2", "ler", { outs: ["nome"] }), F("n3", "saudar", { ins: ["nome"], outs: ["saudacao"], kids: [F("n4", "concatenar", { ins: ["ola", "nome"], outs: ["saudacao"] })] })]) },
  neta: { num: "1.8", title: "Filhas aninhadas", lead: "Sólidas: <code>pedido</code> é composição de <code>validar</code> e <code>cobrar</code>. Definições no fim de cada corpo.",
    code: J("async function main() {", "  await pedido();", "", "  async function pedido() {", "    await validar();", "    await cobrar();", "", "    async function validar() {", "    }", "    async function cobrar() {", "    }", "  }", "}"),
    flow: main([F("n2", "pedido", { kids: [F("n3", "validar"), F("n4", "cobrar")] })]) },
  mista: { num: "1.9", title: "Paralela e depois sequencial", lead: "Sólidas: <code>a</code> e <code>b</code> juntas no passo 0; <code>c</code> depois. Definições no fim.",
    code: J("async function main() {", "  await Promise.all([a(), b()]);", "  await c();", "", "  async function a() {", "  }", "  async function b() {", "  }", "  async function c() {", "  }", "}"),
    flow: main([F("n2", "a"), F("n3", "b", { par: true }), F("n4", "c")]) },

  texto: { num: "2.1", title: "Dado: texto", lead: "Um texto trafega como dado único (quadrado).",
    code: J("async function main() {", "  const nome = await ler();", "", "  async function ler() {", "    const nome = \"Ana\";", "    return nome;", "  }", "}"),
    flow: main([F("n2", "ler", { outs: ["nome"] })]) },
  numero: { num: "2.2", title: "Dado: número", lead: "Um número, também um dado único.",
    code: J("async function main() {", "  const total = await contar();", "", "  async function contar() {", "    const total = 42;", "    return total;", "  }", "}"),
    flow: main([F("n2", "contar", { outs: ["total"] })]) },
  booleano: { num: "2.3", title: "Dado: booleano", lead: "Um verdadeiro/falso, normalmente usado para decidir um desvio.",
    code: J("async function main() {", "  const ok = await validar();", "", "  async function validar() {", "    const ok = true;", "    return ok;", "  }", "}"),
    flow: main([F("n2", "validar", { outs: ["ok"] })]) },
  funcaoDado: { num: "2.4", title: "Dado: função", lead: "Funções também são dados: <code>aplicar</code> recebe a função <code>dobrar</code>.",
    code: J("async function main() {", "  const dobrar = (x) => x * 2;", "  const r = await aplicar(dobrar);", "", "  async function aplicar(fn) {", "    const x = 21;", "    const r = fn(x);", "    return r;", "  }", "}"),
    flow: main([F("n2", "aplicar", { ins: ["dobrar"], outs: ["r"] })]) },
  objeto: { num: "2.5", title: "Dado: objeto (caixa chaveada)", lead: "Várias saídas formam uma <em>caixa</em> (cubo): <code>{ nome, idade }</code>.",
    code: J("async function main() {", "  const { nome, idade } = await ler();", "", "  async function ler() {", "    const nome = \"Ana\";", "    const idade = 30;", "    const pessoa = { nome, idade };", "    return pessoa;", "  }", "}"),
    flow: main([F("n2", "ler", { outs: ["nome", "idade"] })]) },
  array: { num: "2.6", title: "Dado: array (caixa posicional)", lead: "Caixa posicional: <code>[a, b]</code>.",
    code: J("async function main() {", "  const [a, b] = await ler();", "", "  async function ler() {", "    const a = 1;", "    const b = 2;", "    const lista = [a, b];", "    return lista;", "  }", "}"),
    flow: main([F("n2", "ler", { outs: ["a", "b"] })]) },

  dadoConcreto: { num: "2.7", title: "Dado concreto", lead: "Dado com valor: quadrado cheio, valor visível no estado.",
    code: J("async function main() {", "  const idade = 30;", "  await usar(idade);", "", "  async function usar(idade) {", "  }", "}"),
    flow: main([F("n2", "usar", { ins: ["idade"], args: { idade: "30" } })]) },
  dadoAbstrato: { num: "2.8", title: "Dado abstrato", lead: "Dado sem valor ainda (vem de fora): quadrado vazado.",
    code: J("async function main(idade) {", "  await usar(idade);", "", "  async function usar(idade) {", "  }", "}"),
    flow: main([F("n2", "usar", { ins: ["idade"] })]) },
  estado: { num: "3.1", title: "Estado do fluxo", lead: "Estado = os dados disponíveis em cada passo (embaixo dos <code>s…</code>). <code>enviar</code> enxerga <code>pedido</code> e <code>pagamento</code> produzidos antes; os mais antigos aparecem esmaecidos.",
    code: J("async function main() {", "  const pedido = await receber();", "  const pagamento = await cobrar(pedido);", "  await enviar(pedido, pagamento);", "", "  async function receber() {", "    const id = 1;", "    const pedido = { id };", "    return pedido;", "  }", "  async function cobrar(pedido) {", "    const pagamento = \"pago\";", "    return pagamento;", "  }", "  async function enviar(pedido, pagamento) {", "  }", "}"),
    flow: main([F("n2", "receber", { outs: ["pedido"] }), F("n3", "cobrar", { ins: ["pedido"], outs: ["pagamento"] }), F("n4", "enviar", { ins: ["pedido", "pagamento"] })]) },
  estadoInicial: { num: "3.2", title: "Estado inicial com valor", lead: "Dado inicializado com valor já existe no estado desde o início: <code>nome = \"Ana\"</code>.",
    code: J("async function main() {", "  const nome = \"Ana\";", "  const saudacao = await saudar(nome);", "", "  async function saudar(nome) {", "    const saudacao = nome;", "    return saudacao;", "  }", "}"),
    flow: main([F("n2", "saudar", { ins: ["nome"], outs: ["saudacao"], args: { nome: '"Ana"' } })]) },
  estadoCaixa: { num: "3.3", title: "Estado com caixa (objeto)", lead: "Um objeto vira cubo no estado, com campos e valores logo abaixo.",
    code: J("async function main() {", "  const cliente = { id: 1, score: 9 };", "  const pontos = await pontuar(cliente);", "", "  async function pontuar(cliente) {", "    const pontos = cliente.score;", "    return pontos;", "  }", "}"),
    flow: main([F("n2", "pontuar", { ins: ["cliente"], outs: ["pontos"], args: { cliente: "{ id: 1, score: 9 }" } })]) },
  estadoSubstitui: { num: "3.4", title: "Estado substituído", lead: "Quando um nome é produzido de novo, o valor novo substitui o antigo.",
    code: J("async function main() {", "  let total = await ler();", "  total = await somar(total);", "", "  async function ler() {", "    const total = 1;", "    return total;", "  }", "  async function somar(total) {", "    const novo = total + 1;", "    return novo;", "  }", "}"),
    flow: main([F("n2", "ler", { outs: ["total"] }), F("n3", "somar", { ins: ["total"], outs: ["total"] })]) },
  estadoAbstrato: { num: "3.5", title: "Estado abstrato (vem de fora)", lead: "Entrada que ninguém produz no fluxo: dado abstrato (quadrado vazado), fornecido por quem chama.",
    code: J("async function main(pedido) {", "  await cobrar(pedido);", "", "  async function cobrar(pedido) {", "  }", "}"),
    flow: main([F("n2", "cobrar", { ins: ["pedido"] })]) },
  estadoParalelo: { num: "3.6", title: "Estado com paralelas", lead: "Paralelas produzem dados no mesmo passo: o estado seguinte reúne os dois.",
    code: J("async function main() {", "  const [a, b] = await Promise.all([buscarA(), buscarB()]);", "", "  async function buscarA() {", "    const a = 1;", "    return a;", "  }", "  async function buscarB() {", "    const b = 2;", "    return b;", "  }", "}"),
    flow: main([F("n2", "buscarA", { outs: ["a"] }), F("n3", "buscarB", { outs: ["b"], par: true })]) },
  estadoBloco: { num: "3.7", title: "Estado dentro de um for", lead: "O corpo do <code>for</code> produz um dado por volta; o estado mostra o que sai do passo.",
    code: J("async function main() {", "  for (const item of itens) {", "    const dobro = await dobrar(item);", "  }", "", "  async function dobrar(item) {", "    const dobro = item * 2;", "    return dobro;", "  }", "}"),
    flow: main([{ t: "for", id: "l1", v: "item", coll: "itens", kids: [F("n2", "dobrar", { ins: ["item"], outs: ["dobro"] })] }]) },

  se: { num: "4.1", title: "Seleção: if", lead: "<code>enviar</code> só roda se a condição for verdadeira.",
    code: J("async function main() {", "  const ok = true;", "  if (ok) {", "    await enviar();", "  }", "", "  async function enviar() {", "  }", "}"),
    flow: main([{ t: "if", id: "i1", test: "ok", kids: [F("n2", "enviar")], elseKids: [] }]) },
  seSenao: { num: "4.2", title: "Seleção: if / else", lead: "O fluxo escolhe entre dois caminhos, lado a lado: <code>if</code> e <code>else</code> ocupam o mesmo passo (só um deles executa).", opts: { elseParallel: true },
    code: J("async function main() {", "  const aprovada = true;", "  if (aprovada) {", "    await enviar();", "  } else {", "    await revisar();", "  }", "", "  async function enviar() {", "  }", "  async function revisar() {", "  }", "}"),
    flow: main([{ t: "if", id: "i1", test: "aprovada", kids: [F("n2", "enviar")], elseKids: [F("n3", "revisar")] }]) },
  switchEx: { num: "4.3", title: "Seleção: switch", lead: "Vários casos = <code>if</code> em sequência (um por valor).",
    code: J("async function main() {", "  const meio = \"pix\";", "  switch (meio) {", "    case \"pix\":", "      await pagarPix();", "      break;", "    case \"cartao\":", "      await pagarCartao();", "      break;", "  }", "", "  async function pagarPix() {", "  }", "  async function pagarCartao() {", "  }", "}"),
    flow: main([
      { t: "if", id: "i1", test: "meio === 'pix'", kids: [F("n2", "pagarPix")], elseKids: [] },
      { t: "if", id: "i2", test: "meio === 'cartao'", kids: [F("n3", "pagarCartao")], elseKids: [] },
    ]) },

  repFor: { num: "5.1", title: "Repetição: for", lead: "<code>notificar</code> roda uma vez para cada item da coleção.",
    code: J("async function main() {", "  const itens = [1, 2];", "  for (const item of itens) {", "    await notificar(item);", "  }", "", "  async function notificar(item) {", "  }", "}"),
    flow: main([{ t: "for", id: "l1", v: "item", coll: "itens", kids: [F("n2", "notificar", { ins: ["item"] })] }]) },
  repFor2: { num: "5.2", title: "Repetição com vários passos", lead: "O corpo do <code>for</code> pode ter passos em sequência e em paralelo.",
    code: J("async function main() {", "  const itens = [1, 2];", "  for (const item of itens) {", "    await validar(item);", "    await salvar(item);", "  }", "", "  async function validar(item) {", "  }", "  async function salvar(item) {", "  }", "}"),
    flow: main([{ t: "for", id: "l1", v: "item", coll: "itens", kids: [F("n2", "validar", { ins: ["item"] }), F("n3", "salvar", { ins: ["item"] })] }]) },
  repWhile: { num: "5.3", title: "Repetição: while / do-while", lead: "No modelo atual, <code>while</code> e <code>do-while</code> usam o mesmo bloco de repetição (<code>for</code>) — o rótulo mostra a coleção/condição.",
    code: J("async function main() {", "  const pendente = true;", "  while (pendente) {", "    await tentar();", "  }", "", "  async function tentar() {", "  }", "}"),

const ANCHOR = { main: "main", filha: "filha", paralela: "paralela", sequencial: "sequencial" };
const anchor = (k) => ANCHOR[k] ?? k;

const prune = (node) => {
  if (!node || typeof node !== "object") return node;
  if (Array.isArray(node)) return node.map(prune);
  const out = {};
  for (const [k, v] of Object.entries(node)) {
    if (k === "start" || k === "end" || k === "loc" || k === "range") continue;
    out[k] = prune(v);
  }
  return out;
};

const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

const planOf = (flow, opts) => typeof FlowAst?.renderFnSvg === "function" ? FlowAst.renderFnSvg(flow, opts).svg : "";

const paint = (key, ex) => {
  const el = document.getElementById(anchor(key));
  let estree = "";
  try {
    estree = JSON.stringify(prune(acorn.parse(ex.code, { ecmaVersion: "latest", sourceType: "module" })), null, 2);
  } catch (e) {
    estree = e.message;
  }

  const flows = ex.flows ?? [ex.flow];
  const planErr = typeof FlowAst?.renderFnSvg === "function" ? "" : "fn-svg.js ausente — rode: npm run example:build";
  const flowJson = flows.map((f) => JSON.stringify(f, null, 2)).join("\n");
  const plans = flows.map((f) => `${flows.length > 1 ? `<div class="lab"><span class="kind">${esc(f.file ?? "")}</span> ${esc(f.title)}</div>` : ""}<div class="svg-host">${planOf(f, ex.opts)}</div>`).join("");

  el.innerHTML = `
    <h3><span class="n">${esc(ex.num)}</span>${ex.title}</h3>
    <p class="sec-lead">${ex.lead}</p>
    <details class="pane plan" open>
      <summary class="hd"><span class="kind">Plano</span> Visão <span class="tag">renderFnSvg</span></summary>
      <div class="body">
        ${plans}
        ${planErr ? `<div class="err">${esc(planErr)}</div>` : ""}
      </div>
    </details>
    <details class="pane" open>
      <summary class="hd"><span class="kind">JS</span> Código <span class="tag">fonte</span></summary>
      <div class="body"><pre>${esc(ex.code)}</pre></div>
    </details>
    <details class="pane ast">
      <summary class="hd"><span class="kind">ESTree</span> Árvore sintática <span class="tag">Acorn</span></summary>
      <div class="body"><pre>${esc(estree)}</pre></div>
    </details>
    <details class="pane ast">
      <summary class="hd"><span class="kind">Flow</span> AST do fluxo <span class="tag">Fn</span></summary>
      <div class="body"><pre>${esc(flowJson)}</pre></div>
    </details>`;
};

const out = document.getElementById("out"), toc = document.getElementById("toc");
for (const g of GROUPS) {
  const keys = g.keys.filter((k) => EXAMPLES[k]);
  out.insertAdjacentHTML("beforeend", `<h2 id="${g.id}"><span class="n">${g.n}</span>${esc(g.title)}</h2>${g.lead ? `<p class="sec-lead">${g.lead}</p>` : ""}${keys.map((k) => `<section id="${anchor(k)}"></section>`).join("")}`);
  toc.insertAdjacentHTML("beforeend", `<li><a href="#${g.id}">${esc(g.title)}</a><ul>${keys.map((k) => `<li><a href="#${anchor(k)}">${EXAMPLES[k].num} ${EXAMPLES[k].title}</a></li>`).join("")}</ul></li>`);
  for (const k of keys) paint(k, EXAMPLES[k]);
}
