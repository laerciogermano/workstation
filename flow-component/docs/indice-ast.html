.pane.flat > .hd { display: flex; align-items: center; gap: .5rem; min-height: 2rem; padding: 0 .85rem; background: var(--paper-2); border-bottom: 1px solid var(--line); font: 600 .72rem/1 Archivo, sans-serif; letter-spacing: .04em; text-transform: uppercase; color: var(--body); }

.legend { display: flex; flex-wrap: wrap; gap: 1rem; margin: 0 0 1.5rem; }
.legend .it { flex: 1 1 15rem; display: flex; gap: .85rem; align-items: flex-start; padding: .85rem 1rem; border: 1px solid var(--line); border-radius: 6px; }

footer {

<script>
(() => {
  const set = (t) => {
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem("flow-docs-theme", t); } catch {}
    document.querySelectorAll("[data-theme-set]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.themeSet === t)));
  };
  const ok = ["black", "black-azul", "black-vermelho", "eternos-black", "tablet-black", "noite", "gantt", "graphite", "ardosia", "white", "eternos", "papel", "teal", "indigo", "cobalto", "musgo"];
  let t = "black"; try { t = localStorage.getItem("flow-docs-theme") || "black"; } catch {}
  if (!ok.includes(t)) t = "black";
  document.documentElement.dataset.theme = t;
  addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll("[data-theme-set]").forEach((b) => b.addEventListener("click", () => set(b.dataset.themeSet)));
    set(t);
  });
})();
</script>

<script type="module">
import * as acorn from "https://esm.sh/acorn@8.14.0";

const fn = (id, title, extra = {}) => ({
  t: "fn", id, title, agent: "arquivo", resp: null,
  ins: [], outs: [], kids: [], par: false, ...extra,
});

const F = fn;
const J = (...l) => l.join("\n");
const main = (kids, extra = {}) => F("n1", "main", { file: "main.ts", kids, ...extra });

const EXAMPLES = {
  main: { num: "2.1", title: "Função: a unidade de processamento", lead: [["D","Função é a unidade de processamento do fluxo."],["P","Toda função de 1ª ordem pertence a um arquivo, que é o seu responsável de origem."]],
    code: J("async function main() {", "}"), flow: main([]) },
  filha: { num: "2.5", title: "Função filha", lead: [["P","Uma função pode ter funções filhas."],["D","Função filha é a função contida em outra, por composição."]],
    code: J("async function main() {", "  await hello();", "}", "", "async function hello() {", "}"),
    flow: main([F("n2", "hello")]) },
  paralela: { num: "2.6", title: "Função paralela", lead: [["D","Funções paralelas são irmãs que ocupam o mesmo passo."],["P","Funções paralelas executam juntas."],["T","<code>a</code> e <code>b</code> terminam antes de o passo seguinte começar."],["P","As funções podem ter funções irmãs."]],
    code: J("async function main() {", "  await Promise.all([a(), b()]);", "}", "", "async function a() {", "}", "", "async function b() {", "}"),
    flow: main([F("n2", "a"), F("n3", "b", { par: true })]) },
  sequencial: { num: "2.7", title: "Função sequencial", lead: [["P","As funções podem ser sequenciais."],["D","Funções sequenciais são irmãs em passos consecutivos."],["P","Uma função sequencial começa quando a anterior termina."],["P","Funções paralelas e sequenciais podem ser combinadas no mesmo fluxo."]],
    code: J("async function main() {", "  await a();", "  await b();", "}", "", "async function a() {", "}", "", "async function b() {", "}"),
    flow: main([F("n2", "a"), F("n3", "b")]) },
  ioGeral: { num: "2.2", title: "Funções têm entrada e saída", lead: [["P","As funções podem possuir entrada e saída."],["P","A entrada e a saída são dados."],["T","O dado que uma função devolve é a entrada das próximas."]],
    code: J("async function main() {", "  const nome = await ler();", "  await saudar(nome);", "}", "", "async function ler() {", "  const nome = \"Ana\";", "  return nome;", "}", "", "async function saudar(nome) {", "}"),
    flow: main([F("n2", "ler", { outs: ["nome"], args: { nome: '"Ana"' } }), F("n3", "saudar", { ins: ["nome"] })]) },
  entrada: { num: "2.3", title: "Função com entrada", lead: [["D","Entrada é o dado que a função recebe."],["P","Uma função tem, no máximo, uma entrada e uma saída."]],
    code: J("async function main() {", "  const nome = \"Ana\";", "  await saudar(nome);", "}", "", "async function saudar(nome) {", "}"),
    flow: main([F("n2", "saudar", { ins: ["nome"], args: { nome: '"Ana"' } })]) },
  saida: { num: "2.4", title: "Função com saída", lead: [["D","Saída é o dado que a função devolve."]],
    code: J("async function main() {", "  const nome = await ler();", "}", "", "async function ler() {", "  const nome = \"Ana\";", "  return nome;", "}"),
    flow: main([F("n2", "ler", { outs: ["nome"] })]) },
  texto: { num: "3.1", title: "Dado: texto", lead: [["D","Texto é a sequência de caracteres tratada como dado."],["P","Todo dado simples é representado por um quadrado."]], opts: { fnStates: false },
    code: J("async function main() {", "  const nome = \"Ana\";", "}"),
    flow: main([], { args: { nome: '"Ana"' } }) },
  numero: { num: "3.2", title: "Dado: número", lead: [["D","Dados são as unidades transformáveis do fluxo."],["D","Número é o dado que expressa quantidade."],["P","Todo dado simples é representado por um quadrado."]], opts: { fnStates: false },
    code: J("async function main() {", "  const total = 42;", "}"),
    flow: main([], { args: { total: '42' } }) },
  booleano: { num: "3.3", title: "Dado: booleano", lead: [["D","Booleano é o dado que admite dois valores: verdadeiro e falso."],["T","O booleano é o que decide uma seleção."]], opts: { fnStates: false },
    code: J("async function main() {", "  const ok = true;", "}"),
    flow: main([], { args: { ok: 'true' } }) },
  funcaoDado: { num: "3.4", title: "Dado: função", lead: [["D","Uma função também é um dado."],["P","Uma função guardada numa variável é tratada como dado."]], opts: { fnStates: false },
    code: J("async function main() {", "  const dobrar = (x) => x * 2;", "}"),

const GROUPS = [
  { id: "flow", n: "0.", title: "Flow e software", html: `<h3>O que é o Flow</h3>
<p>O Flow é uma linguagem de programação visual. Em vez de escrever o programa em texto, você desenha o fluxo. Como o desenho é universal, dá para transpilar para qualquer linguagem. Ele tem o que as linguagens têm (funções, dados, if, laços, tratamento de erro) e também funciona como um gerenciador de tarefas.</p>
<p>Na prática, ele transforma código em imagem. Você deixa de ler linha por linha para descobrir o que acontece e passa a enxergar o fluxo inteiro. E dá para ver todos os fluxos juntos, mais ou menos como num orquestrador de processos tipo o n8n.</p>

<h3>Por que visual</h3>
<p>Entender código dá trabalho. Com só texto, os conceitos se embolam rápido; é parecido com jogar xadrez sem ver o tabuleiro, só ouvindo as posições. Uma imagem se entende bem mais rápido que um texto. Eu não conheço outra forma de enxergar software com essa fidelidade, e o Flow faz isso sem perder nenhum recurso de programação.</p>

<h3>Uma linguagem só</h3>
<p>Hoje existem várias linguagens e vários paradigmas, e cada um tem seu jeito de fazer a mesma coisa. O Flow fica acima disso: uma única visualização, uma linguagem que serve para todas. Os componentes podem ser trocados em qualquer contexto, porque não dependem uns dos outros.</p>
<p>A ideia também não para em software. Dá para descrever a realidade do mesmo jeito, porque tudo é feito de funções e estados.</p>

<h3>Funções e estados</h3>
<p>Uma função é o processamento: ela existe sempre e não muda. Um estado é o que passa por ela: o dado muda e some ao longo do fluxo. Por isso a função é eterna e imutável, e o dado é mutável e transitório.</p>

const ANCHOR = { main: "main", filha: "filha", paralela: "paralela", sequencial: "sequencial" };
const anchor = (k) => ANCHOR[k] ?? k;

const prune = (node) => {
  if (!node || typeof node !== "object") return node;
  if (Array.isArray(node)) return node.map(prune);
  const out = {};
  for (const [k, v] of Object.entries(node)) {
    if (k === "start" || k === "end" || k === "loc" || k === "range") continue;
    out[k] = prune(v);
  }
  return out;
};

const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

const planOf = (flow, opts) => typeof FlowAst?.renderFnSvg === "function" ? FlowAst.renderFnSvg(flow, opts).svg : "";

// o lead vira lista de bullets: um por frase (ou um por item, se vier como array)
// regras numeradas como cláusulas de uma especificação: 1.1.1, 1.1.2…
const rules = (lead, num) => `<ol class="rules">${lead.map(([, t], i) => `<li><span class="ix">${esc(num)}.${i + 1}</span><span>${t}</span></li>`).join("")}</ol>`;

const paint = (key, ex, flat = false, noStates = false) => {
  const el = document.getElementById(anchor(key));
  let estree = "";
  try {
    estree = JSON.stringify(prune(acorn.parse(ex.code, { ecmaVersion: "latest", sourceType: "module" })), null, 2);
  } catch (e) {
    estree = e.message;
  }

  const flows = ex.flows ?? [ex.flow];
  const planErr = typeof FlowAst?.renderFnSvg === "function" ? "" : "fn-svg.js ausente — rode: npm run example:build";
  const flowJson = flows.map((f) => JSON.stringify(f, null, 2)).join("\n");
  const plans = flows.map((f) => `${flows.length > 1 ? `<div class="lab"><span class="kind">${esc(f.file ?? "")}</span> ${esc(f.title)}</div>` : ""}<div class="svg-host">${planOf(f, noStates ? { ...ex.opts, states: false } : ex.opts)}</div>`).join("");

  const html = `
    <h3><span class="n">${esc(ex.num)}</span>${ex.title}</h3>
    ${rules(ex.lead, ex.num)}
    <details class="pane plan" open>
      <summary class="hd"><span class="kind">Plano</span> Visão <span class="tag">renderFnSvg</span></summary>
      <div class="body">
        ${plans}
        ${planErr ? `<div class="err">${esc(planErr)}</div>` : ""}
      </div>
    </details>
    <details class="pane" open>
      <summary class="hd"><span class="kind">JS</span> Código <span class="tag">fonte</span></summary>
      <div class="body"><pre>${esc(ex.code)}</pre></div>
    </details>
    <details class="pane ast">
      <summary class="hd"><span class="kind">ESTree</span> Árvore sintática <span class="tag">Acorn</span></summary>
      <div class="body"><pre>${esc(estree)}</pre></div>
    </details>
    <details class="pane ast">
      <summary class="hd"><span class="kind">Flow</span> AST do fluxo <span class="tag">Fn</span></summary>
      <div class="body"><pre>${esc(flowJson)}</pre></div>
    </details>`;
  // capítulo "flat": plano e código fixos; as árvores (AST) continuam como acordeão fechado
  const flatten = (s) => s.replace(/<details class="pane(?! ast)([^"]*)"[^>]*>\s*<summary class="hd">([\s\S]*?)<\/summary>([\s\S]*?)<\/details>/g,
    (_, c, hd, body) => `<div class="pane flat${c}"><div class="hd">${hd}</div>${body}</div>`);
  el.innerHTML = flat ? flatten(html) : html;
};

const out = document.getElementById("out"), toc = document.getElementById("toc");
for (const g of GROUPS) {
  const keys = g.keys.filter((k) => EXAMPLES[k]);
  out.insertAdjacentHTML("beforeend", `<h2 id="${g.id}"><span class="n">${g.n}</span>${esc(g.title)}</h2>${g.lead ? `<p class="sec-lead">${g.lead}</p>` : ""}${g.html ?? ""}${g.rules ? `<ol class="rules">${g.rules.map((t, i) => `<li><span class="ix">${esc(g.n)}${i + 1}</span><span>${t}</span></li>`).join("")}</ol>` : ""}${keys.map((k) => `<section id="${anchor(k)}"></section>`).join("")}`);
  toc.insertAdjacentHTML("beforeend", `<li data-g="${g.id}"><a href="#${g.id}">${ICONS[g.id] ?? ""}<span class="gn">${esc(g.n)}</span>${esc(g.title)}</a>${keys.length ? `<ul>${keys.map((k) => `<li><a href="#${anchor(k)}">${EXAMPLES[k].num} ${EXAMPLES[k].title}</a></li>`).join("")}</ul>` : ""}</li>`);
  for (const k of keys) paint(k, EXAMPLES[k], g.id === "funcoes");
}

// menu lateral: marca a seção visível e abre os itens do capítulo corrente
{
  const links = new Map([...document.querySelectorAll(".side a")].map((a) => [a.getAttribute("href").slice(1), a]));
  const heads = [...links.keys()].map((id) => document.getElementById(id)).filter(Boolean);
  const groupOf = (id) => links.get(id)?.closest("li[data-g]");
  let cur = null;
  const mark = () => {
    let best = heads[0];
    for (const el of heads) if (el.getBoundingClientRect().top <= 120) best = el; else break;
    if (!best || best.id === cur) return;
    cur = best.id;
    links.forEach((a) => a.classList.remove("on"));
    document.querySelectorAll(".side li.open").forEach((li) => li.classList.remove("open"));
    const a = links.get(cur); a.classList.add("on");
    groupOf(cur)?.classList.add("open");
    a.scrollIntoView({ block: "nearest" });
  };
  addEventListener("scroll", mark, { passive: true });
  addEventListener("resize", mark);
  mark();
}
