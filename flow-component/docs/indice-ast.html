<style>
:root, [data-theme="black"] {
  color-scheme: dark;
  --paper: #000; --paper-2: #121212; --ink: #f2f2f2; --body: #a3a3a3;
  --accent: #ff6a52; --line: #262626;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
[data-theme="graphite"] {
  color-scheme: dark;
  --paper: #1c1c1e; --paper-2: #26262a; --ink: #ececec; --body: #a6a6ab;
  --accent: #ff8a5c; --line: #34343a;
}
[data-theme="white"] {
  color-scheme: light;
  --paper: #fff; --paper-2: #f4f1ea; --ink: #14120f; --body: #44423d;
  --accent: #e0402b; --line: #e7e3db;
}
[data-theme="sepia"] {
  color-scheme: light;
  --paper: #f6ecd9; --paper-2: #ecdfc6; --ink: #2e2416; --body: #5f5238;
  --accent: #b5471f; --line: #dccdb0;
}
[data-theme="sage"] {
  color-scheme: light;
  --paper: #eef3ec; --paper-2: #e0e9dd; --ink: #16231a; --body: #46584b;
  --accent: #2f7d4f; --line: #cfdccb;
}
[data-theme="ocean"] {
  color-scheme: dark;
  --paper: #0a1a1f; --paper-2: #11262d; --ink: #e4f1f3; --body: #8fb0b7;
  --accent: #3cc7b4; --line: #1b3640;
}
[data-theme="rose"] {
  color-scheme: light;
  --paper: #fbf1f1; --paper-2: #f4e0e1; --ink: #2a1416; --body: #6b4a4d;
  --accent: #c0334d; --line: #ebcfd1;
}
:root {
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 1.05rem/1.58 Newsreader, Georgia, serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-underline-offset: 3px; }
a:hover { color: var(--ink); }
code, pre { font-family: var(--mono); }

.top {
  display: flex; align-items: center; gap: 1rem;
  height: 3.5rem; padding: 0 1.25rem;
  border-bottom: 1px solid var(--line);
  font-family: Archivo, sans-serif;
}
.brand { font-weight: 800; letter-spacing: -.02em; color: var(--ink); text-decoration: none; }
.brand span { color: var(--accent); }
.top nav a {
  font-size: .72rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  color: var(--body); text-decoration: none; margin-right: .75rem;
}
.sp { flex: 1; }
.themes { display: flex; gap: .45rem; align-items: center; margin-right: .75rem; }
.themes button {
  width: 1.05rem; height: 1.05rem; padding: 0; border-radius: 50%; cursor: pointer;
  border: 1px solid var(--body); background: var(--c); position: relative;
}
.themes button::after { content: ""; position: absolute; inset: 3px 3px 3px 50%; border-radius: 0 50% 50% 0; background: var(--a); }
.themes button:hover { transform: scale(1.15); }
.themes button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--paper), 0 0 0 3.5px var(--ink); }
.meta { font-size: .75rem; font-weight: 600; color: var(--body); }

html { scroll-behavior: smooth; scroll-padding-top: 4.5rem; }
.layout { display: grid; grid-template-columns: 17rem minmax(0, 1fr); align-items: start; max-width: 70rem; margin: 0 auto; }
.side {
  position: sticky; top: 3.5rem; height: calc(100vh - 3.5rem); overflow-y: auto;
  padding: 1.5rem .75rem 2rem 1.25rem; border-right: 1px solid var(--line);
  font: 600 .82rem/1.35 Archivo, sans-serif;
}
.side .t { font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; color: var(--body); margin: 0 0 .6rem .5rem; }
.side ol, .side ul { list-style: none; margin: 0; padding: 0; }
.side a { display: block; padding: .3rem .5rem; border-left: 2px solid transparent; color: var(--body); text-decoration: none; border-radius: 0 4px 4px 0; }
.side a:hover { color: var(--ink); background: var(--paper-2); }
.side > ol > li > a { color: var(--ink); font-weight: 700; margin-top: .25rem; }
.side ul { display: block; margin-left: .75rem; }
.side ul a { font-weight: 500; font-size: .78rem; padding: .2rem .5rem; }
.side a.on { color: var(--accent); border-left-color: var(--accent); background: var(--paper-2); }
@media (max-width: 62rem) {
  .layout { display: block; }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .side ul { display: block; }
}
main { max-width: 46rem; margin: 0; padding: 2rem 1.75rem 4rem; }
h1 {
  margin: 0 0 .4rem;
  font: 800 clamp(1.8rem, 4vw, 2.4rem)/1.12 Archivo, sans-serif;
  letter-spacing: -.02em;
}
.lead { margin: 0 0 1.75rem; color: var(--body); max-width: 36rem; }
h2 {
  margin: 2rem 0 .75rem; padding-top: 1.25rem; border-top: 1px solid var(--line);
  font: 700 1.35rem/1.2 Archivo, sans-serif; letter-spacing: -.015em;
}
h3 { margin: 1.5rem 0 .5rem; font: 700 1.1rem/1.25 Archivo, sans-serif; }
h2 .n, h3 .n { font: 600 .8rem/1 var(--mono); color: var(--accent); margin-right: .4rem; }
.sec-lead { margin: 0 0 1rem; color: var(--body); }

.lab {
  margin: 0 0 .35rem;
  font: 700 .68rem/1 Archivo, sans-serif;
  letter-spacing: .06em; text-transform: uppercase; color: var(--body);
}
.lab .kind { color: var(--accent); margin-right: .35rem; }

.pane {
  border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
  margin: 0 0 .75rem; background: var(--paper);
}
.pane > summary.hd {
  display: flex; align-items: center; gap: .5rem; min-height: 2rem; padding: 0 .85rem;
  background: var(--paper-2);
  font: 600 .72rem/1 Archivo, sans-serif;
  letter-spacing: .04em; text-transform: uppercase; color: var(--body);
  cursor: pointer; list-style: none; user-select: none;
}
.pane > summary.hd::-webkit-details-marker { display: none; }
.pane > summary.hd::before {
  content: "▸"; color: var(--accent); font-size: .7rem; width: .7rem;
  transition: transform .12s ease;
}
.pane.flat > .hd { display: flex; align-items: center; gap: .5rem; min-height: 2rem; padding: 0 .85rem; background: var(--paper-2); border-bottom: 1px solid var(--line); font: 600 .72rem/1 Archivo, sans-serif; letter-spacing: .04em; text-transform: uppercase; color: var(--body); }
.pane[open] > summary.hd::before { transform: rotate(90deg); }
.pane[open] > summary.hd { border-bottom: 1px solid var(--line); }
.pane .hd .kind { color: var(--accent); margin-right: .2rem; }
.pane .hd .tag { margin-left: auto; font-weight: 700; color: var(--accent); font-size: .65rem; }
.pane .body { background: var(--paper); }
.pane pre {
  margin: 0; padding: .85rem 1rem; overflow: auto;
  font-size: .78rem; line-height: 1.55; color: var(--ink); white-space: pre;
}
/* ESTree e AST do fluxo ocultos; para exibir de novo, apague esta regra */
.pane.ast { display: none; }
.pane.ast pre { color: var(--body); max-height: 18rem; }
.pane.plan .body { padding: 1rem; overflow: auto; background: var(--paper-2); }
.pane.plan .svg-host { overflow: auto; }
.err { color: var(--accent); font-family: var(--mono); font-size: .78rem; padding: .5rem 0; }

.toc {
  margin: 0 0 1.75rem; padding: .85rem 1rem;
  border: 1px solid var(--line); border-radius: 6px;
  font: 600 .85rem/1.5 Archivo, sans-serif;
}
.toc .t { font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; color: var(--body); margin-bottom: .35rem; }
.toc ol { margin: 0; padding-left: 1.25rem; }
.toc ul { list-style: none; margin: .25rem 0 0; padding-left: 1rem; }


.legend { display: flex; flex-wrap: wrap; gap: 1rem; margin: 0 0 1.5rem; }
.legend .it { flex: 1 1 15rem; display: flex; gap: .85rem; align-items: flex-start; padding: .85rem 1rem; border: 1px solid var(--line); border-radius: 6px; }
.legend svg { flex: none; margin-top: .15rem; }
.legend b { display: block; font: 700 .95rem/1.2 Archivo, sans-serif; color: var(--ink); }
.legend span { color: var(--body); font-size: .95rem; }
.legend .fnc { fill: #2563eb; } .legend .dtq { fill: #dc2626; }

footer {
  margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--line);
  font: 600 .75rem/1.45 Archivo, sans-serif; color: var(--body);
}
</style>
<script>
(() => {
  const set = (t) => {
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem("flow-docs-theme", t); } catch {}
    document.querySelectorAll("[data-theme-set]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.themeSet === t)));
  };
  const ok = ["black","graphite","ocean","white","sepia","sage","rose"];
  let t = "black"; try { t = localStorage.getItem("flow-docs-theme") || "black"; } catch {}
  if (!ok.includes(t)) t = "black";
  document.documentElement.dataset.theme = t;
  addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll("[data-theme-set]").forEach((b) => b.addEventListener("click", () => set(b.dataset.themeSet)));
    set(t);
  });
})();
</script>

<script type="module">
import * as acorn from "https://esm.sh/acorn@8.14.0";

const fn = (id, title, extra = {}) => ({
  t: "fn", id, title, agent: "arquivo", resp: null,
  ins: [], outs: [], kids: [], par: false, ...extra,
});

const F = fn;
const J = (...l) => l.join("\n");
const main = (kids, extra = {}) => F("n1", "main", { file: "main.ts", kids, ...extra });

const EXAMPLES = {
  main: { num: "1.1", title: "A função <code>main</code>", lead: "Todo sistema tem um <em>entry point</em> — aqui chama-se <code>main</code>. 1ª ordem, sólida, sem entrada e sem saída.",
    code: J("async function main() {", "}"), flow: main([]) },
  filha: { num: "1.2", title: "Função filha", lead: "<code>hello</code> é filha de <code>main</code>. Tem endereço no arquivo, por isso a barra é preenchida.",
    code: J("async function main() {", "  await hello();", "}", "", "async function hello() {", "}"),
    flow: main([F("n2", "hello")]) },
  paralela: { num: "1.3", title: "Função paralela", lead: "<code>a</code> e <code>b</code> executam no mesmo passo (<code>par: true</code>, que vira <code>Promise.all</code>).",
    code: J("async function main() {", "  await Promise.all([a(), b()]);", "}", "", "async function a() {", "}", "", "async function b() {", "}"),
    flow: main([F("n2", "a"), F("n3", "b", { par: true })]) },
  sequencial: { num: "1.4", title: "Função sequencial", lead: "<code>b</code> executa no passo seguinte a <code>a</code> (<code>par: false</code>).",
    code: J("async function main() {", "  await a();", "  await b();", "}", "", "async function a() {", "}", "", "async function b() {", "}"),
    flow: main([F("n2", "a"), F("n3", "b")]) },
  entrada: { num: "1.5", title: "Função com entrada", lead: "<code>saudar</code> recebe um dado, que aparece como quadrado à esquerda da barra. <code>nome</code> já tem valor, então é sólido e o quadrado é preenchido. A entrada é sempre uma variável.",
    code: J("async function main() {", "  const nome = \"Ana\";", "  await saudar(nome);", "}", "", "async function saudar(nome) {", "}"),
    flow: main([F("n2", "saudar", { ins: ["nome"], args: { nome: '"Ana"' } })]) },
  saida: { num: "1.6", title: "Função com saída", lead: "<code>ler</code> devolve um dado, quadrado à direita da barra. O valor é atribuído a uma variável antes do <code>return</code>.",
    code: J("async function main() {", "  const nome = await ler();", "}", "", "async function ler() {", "  const nome = \"Ana\";", "  return nome;", "}"),
    flow: main([F("n2", "ler", { outs: ["nome"] })]) },
  entradaSaida: { num: "1.7", title: "Entrada e saída ligadas", lead: "A saída de uma função é a entrada da próxima. Concatenação é uma função: <code>ola</code> e <code>nome</code> vão juntos em um array e <code>concatenar</code> é uma função nativa (sem implementação no código): recebe o array e devolve só a string.",
    code: J("async function main() {", "  const nome = await ler();", "  const saudacao = await saudar(nome);", "}", "", "async function ler() {", "  const nome = \"Ana\";", "  return nome;", "}", "", "async function saudar(nome) {", "  const ola = \"Olá, \";", "  const partes = [ola, nome];", "  const saudacao = await concatenar(partes);", "  return saudacao;", "}"),
    flow: main([F("n2", "ler", { outs: ["nome"], args: { nome: '"Ana"' } }), F("n3", "saudar", { ins: ["nome"], outs: ["saudacao"], args: { ola: '"Olá, "', saudacao: '"Olá, Ana"' }, kids: [F("n4", "concatenar", { agent: "maquina", ins: ["partes"], outs: ["saudacao"], args: { saudacao: '"Olá, Ana"', partes: '{ ola: "Olá, ", nome: "Ana" }' } })] })]) },
  neta: { num: "1.8", title: "Filhas aninhadas", lead: "<code>pedido</code> é composta por <code>validar</code> e <code>cobrar</code>.",
    code: J("async function main() {", "  await pedido();", "}", "", "async function pedido() {", "  await validar();", "  await cobrar();", "}", "", "async function validar() {", "}", "", "async function cobrar() {", "}"),
    flow: main([F("n2", "pedido", { kids: [F("n3", "validar"), F("n4", "cobrar")] })]) },
  mista: { num: "1.9", title: "Paralela e depois sequencial", lead: "<code>a</code> e <code>b</code> executam no passo 0; <code>c</code> só começa depois das duas.",
    code: J("async function main() {", "  await Promise.all([a(), b()]);", "  await c();", "}", "", "async function a() {", "}", "", "async function b() {", "}", "", "async function c() {", "}"),
    flow: main([F("n2", "a"), F("n3", "b", { par: true }), F("n4", "c")]) },

  texto: { num: "2.1", title: "Dado: texto", lead: "Texto: um dado simples, representado por um quadrado.",
    code: J("async function main() {", "  const nome = await ler();", "", "  async function ler() {", "    const nome = \"Ana\";", "    return nome;", "  }", "}"),
    flow: main([F("n2", "ler", { outs: ["nome"] })]) },
  numero: { num: "2.2", title: "Dado: número", lead: "Número: também um dado simples.",
    code: J("async function main() {", "  const total = await contar();", "", "  async function contar() {", "    const total = 42;", "    return total;", "  }", "}"),
    flow: main([F("n2", "contar", { outs: ["total"] })]) },
  booleano: { num: "2.3", title: "Dado: booleano", lead: "Booleano: normalmente usado como condição de uma seleção.",
    code: J("async function main() {", "  const ok = await validar();", "", "  async function validar() {", "    const ok = true;", "    return ok;", "  }", "}"),
    flow: main([F("n2", "validar", { outs: ["ok"] })]) },
  funcaoDado: { num: "2.4", title: "Dado: função", lead: "Uma função pode ser passada como dado: <code>aplicar</code> recebe <code>dobrar</code>.",
    code: J("async function main() {", "  const dobrar = (x) => x * 2;", "  const r = await aplicar(dobrar);", "", "  async function aplicar(fn) {", "    const x = 21;", "    const r = fn(x);", "    return r;", "  }", "}"),
    flow: main([F("n2", "aplicar", { ins: ["dobrar"], outs: ["r"] })]) },
  objeto: { num: "2.5", title: "Dado: objeto (caixa chaveada)", lead: "Várias saídas formam uma caixa, desenhada como cubo: <code>{ nome, idade }</code>.",
    code: J("async function main() {", "  const { nome, idade } = await ler();", "", "  async function ler() {", "    const nome = \"Ana\";", "    const idade = 30;", "    const pessoa = { nome, idade };", "    return pessoa;", "  }", "}"),
    flow: main([F("n2", "ler", { outs: ["nome", "idade"] })]) },
  array: { num: "2.6", title: "Dado: array (caixa posicional)", lead: "Caixa posicional, acessada por posição: <code>[a, b]</code>.",
    code: J("async function main() {", "  const [a, b] = await ler();", "", "  async function ler() {", "    const a = 1;", "    const b = 2;", "    const lista = [a, b];", "    return lista;", "  }", "}"),
    flow: main([F("n2", "ler", { outs: ["a", "b"] })]) },

  dadoConcreto: { num: "2.7", title: "Dado concreto", lead: "Dado com valor: quadrado cheio, com o valor mostrado no estado.",
    code: J("async function main() {", "  const idade = 30;", "  await usar(idade);", "", "  async function usar(idade) {", "  }", "}"),
    flow: main([F("n2", "usar", { ins: ["idade"], args: { idade: "30" } })]) },
  dadoAbstrato: { num: "2.8", title: "Dado abstrato", lead: "Dado sem valor, que vem de fora do fluxo: quadrado vazado.",
    code: J("async function main(idade) {", "  await usar(idade);", "", "  async function usar(idade) {", "  }", "}"),
    flow: main([F("n2", "usar", { ins: ["idade"] })]) },
  estado: { num: "3.1", title: "Estado do fluxo", lead: "Estado é o que está disponível em cada passo (abaixo dos <code>s…</code>): deve mostrar <strong>funções e estados</strong> juntos — o que pode ser chamado e os dados já produzidos. <code>enviar</code> recebe <code>pedido</code> e <code>pagamento</code>. Dados de passos anteriores aparecem com opacidade reduzida.",
    code: J("async function main() {", "  const pedido = await receber();", "  const pagamento = await cobrar(pedido);", "  await enviar(pedido, pagamento);", "", "  async function receber() {", "    const id = 1;", "    const pedido = { id };", "    return pedido;", "  }", "  async function cobrar(pedido) {", "    const pagamento = \"pago\";", "    return pagamento;", "  }", "  async function enviar(pedido, pagamento) {", "  }", "}"),
    flow: main([F("n2", "receber", { outs: ["pedido"] }), F("n3", "cobrar", { ins: ["pedido"], outs: ["pagamento"] }), F("n4", "enviar", { ins: ["pedido", "pagamento"] })]) },
  estadoInicial: { num: "3.2", title: "Estado inicial com valor", lead: "Um dado inicializado com valor existe no estado desde o início: <code>nome = \"Ana\"</code>.",
    code: J("async function main() {", "  const nome = \"Ana\";", "  const saudacao = await saudar(nome);", "", "  async function saudar(nome) {", "    const saudacao = nome;", "    return saudacao;", "  }", "}"),
    flow: main([F("n2", "saudar", { ins: ["nome"], outs: ["saudacao"], args: { nome: '"Ana"' } })]) },
  estadoCaixa: { num: "3.3", title: "Estado com caixa (objeto)", lead: "Um objeto aparece como cubo no estado, com os campos e valores logo abaixo.",
    code: J("async function main() {", "  const cliente = { id: 1, score: 9 };", "  const pontos = await pontuar(cliente);", "", "  async function pontuar(cliente) {", "    const pontos = cliente.score;", "    return pontos;", "  }", "}"),
    flow: main([F("n2", "pontuar", { ins: ["cliente"], outs: ["pontos"], args: { cliente: "{ id: 1, score: 9 }" } })]) },

<p>O Flow é uma linguagem de programação visual. Em vez de escrever o programa em texto, você desenha o fluxo. Como o desenho é universal, dá para transpilar para qualquer linguagem. Ele tem o que as linguagens têm (funções, dados, if, laços, tratamento de erro) e também funciona como um gerenciador de tarefas.</p>
<p>Na prática, ele transforma código em imagem. Você deixa de ler linha por linha para descobrir o que acontece e passa a enxergar o fluxo inteiro. E dá para ver todos os fluxos juntos, mais ou menos como num orquestrador de processos tipo o n8n.</p>

<h3>Por que visual</h3>
<p>Entender código dá trabalho. Com só texto, os conceitos se embolam rápido; é parecido com jogar xadrez sem ver o tabuleiro, só ouvindo as posições. Uma imagem se entende bem mais rápido que um texto. Eu não conheço outra forma de enxergar software com essa fidelidade, e o Flow faz isso sem perder nenhum recurso de programação.</p>

<h3>Uma linguagem só</h3>
<p>Hoje existem várias linguagens e vários paradigmas, e cada um tem seu jeito de fazer a mesma coisa. O Flow fica acima disso: uma única visualização, uma linguagem que serve para todas. Os componentes podem ser trocados em qualquer contexto, porque não dependem uns dos outros.</p>
<p>A ideia também não para em software. Dá para descrever a realidade do mesmo jeito, porque tudo é feito de funções e estados.</p>

<h3>Funções e estados</h3>
<p>Uma função é a transformação: ela existe sempre e não muda. Um estado é o que passa por ela: o dado muda e some ao longo do fluxo. Por isso a função é eterna e imutável, e o dado é mutável e transitório.</p>

const ANCHOR = { main: "main", filha: "filha", paralela: "paralela", sequencial: "sequencial" };
const anchor = (k) => ANCHOR[k] ?? k;

const prune = (node) => {
  if (!node || typeof node !== "object") return node;
  if (Array.isArray(node)) return node.map(prune);
  const out = {};
  for (const [k, v] of Object.entries(node)) {
    if (k === "start" || k === "end" || k === "loc" || k === "range") continue;
    out[k] = prune(v);
  }
  return out;
};

const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

const planOf = (flow, opts) => typeof FlowAst?.renderFnSvg === "function" ? FlowAst.renderFnSvg(flow, opts).svg : "";

const paint = (key, ex, flat = false) => {
  const el = document.getElementById(anchor(key));
  let estree = "";
  try {
    estree = JSON.stringify(prune(acorn.parse(ex.code, { ecmaVersion: "latest", sourceType: "module" })), null, 2);
  } catch (e) {
    estree = e.message;
  }

  const flows = ex.flows ?? [ex.flow];
  const planErr = typeof FlowAst?.renderFnSvg === "function" ? "" : "fn-svg.js ausente — rode: npm run example:build";
  const flowJson = flows.map((f) => JSON.stringify(f, null, 2)).join("\n");
  const plans = flows.map((f) => `${flows.length > 1 ? `<div class="lab"><span class="kind">${esc(f.file ?? "")}</span> ${esc(f.title)}</div>` : ""}<div class="svg-host">${planOf(f, ex.opts)}</div>`).join("");

  const html = `
    <h3><span class="n">${esc(ex.num)}</span>${ex.title}</h3>
    <p class="sec-lead">${ex.lead}</p>
    <details class="pane plan" open>
      <summary class="hd"><span class="kind">Plano</span> Visão <span class="tag">renderFnSvg</span></summary>
      <div class="body">
        ${plans}
        ${planErr ? `<div class="err">${esc(planErr)}</div>` : ""}
      </div>
    </details>
    <details class="pane" open>
      <summary class="hd"><span class="kind">JS</span> Código <span class="tag">fonte</span></summary>
      <div class="body"><pre>${esc(ex.code)}</pre></div>
    </details>
    <details class="pane ast">
      <summary class="hd"><span class="kind">ESTree</span> Árvore sintática <span class="tag">Acorn</span></summary>
      <div class="body"><pre>${esc(estree)}</pre></div>
    </details>
    <details class="pane ast">
      <summary class="hd"><span class="kind">Flow</span> AST do fluxo <span class="tag">Fn</span></summary>
      <div class="body"><pre>${esc(flowJson)}</pre></div>
    </details>`;
  // capítulo "flat": plano e código fixos; as árvores (AST) continuam como acordeão fechado
  const flatten = (s) => s.replace(/<details class="pane(?! ast)([^"]*)"[^>]*>\s*<summary class="hd">([\s\S]*?)<\/summary>([\s\S]*?)<\/details>/g,
    (_, c, hd, body) => `<div class="pane flat${c}"><div class="hd">${hd}</div>${body}</div>`);
  el.innerHTML = flat ? flatten(html) : html;
};

  out.insertAdjacentHTML("beforeend", `<h2 id="${g.id}"><span class="n">${g.n}</span>${esc(g.title)}</h2>${g.lead ? `<p class="sec-lead">${g.lead}</p>` : ""}${g.html ?? ""}${keys.map((k) => `<section id="${anchor(k)}"></section>`).join("")}`);
  toc.insertAdjacentHTML("beforeend", `<li data-g="${g.id}"><a href="#${g.id}">${esc(g.title)}</a>${keys.length ? `<ul>${keys.map((k) => `<li><a href="#${anchor(k)}">${EXAMPLES[k].num} ${EXAMPLES[k].title}</a></li>`).join("")}</ul>` : ""}</li>`);
  for (const k of keys) paint(k, EXAMPLES[k], g.id === "funcoes");
}

// menu lateral: marca a seção visível e abre os itens do capítulo corrente
{
  const links = new Map([...document.querySelectorAll(".side a")].map((a) => [a.getAttribute("href").slice(1), a]));
  const heads = [...links.keys()].map((id) => document.getElementById(id)).filter(Boolean);
  const groupOf = (id) => links.get(id)?.closest("li[data-g]");
  let cur = null;
  const mark = () => {
    let best = heads[0];
    for (const el of heads) if (el.getBoundingClientRect().top <= 120) best = el; else break;
    if (!best || best.id === cur) return;
    cur = best.id;
    links.forEach((a) => a.classList.remove("on"));
    document.querySelectorAll(".side li.open").forEach((li) => li.classList.remove("open"));
    const a = links.get(cur); a.classList.add("on");
    groupOf(cur)?.classList.add("open");
    a.scrollIntoView({ block: "nearest" });
  };
  addEventListener("scroll", mark, { passive: true });
  addEventListener("resize", mark);
  mark();
}
</script>
