<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flow</title>
<meta name="description" content="Flow Oriented Programming — flow editor">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="../dist/fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <span class="brand"><img class="mark" src="favicon.svg" alt="" width="22" height="22"><span class="brand-text"><span class="brand-row"><span class="ttl">FOP - Flow Oriented Programming</span><span class="ver" title="Version 0.1">0.1</span><span class="beta" title="Under development">prototype</span></span><span class="epigraph">"Everything flows, except flow" - Heraclitus</span></span></span>
  <span class="sp"></span>
  <button type="button" class="ib" id="theme"></button>
  <button type="button" class="ib" id="reset" title="Reset the view" aria-label="Reset the view"></button>
</header>
<div class="app" id="app">
  <aside class="explorer" aria-label="File explorer">
    <div class="ex-head"><span>Explorer</span><button type="button" class="ib" id="exCollapse" title="Collapse all folders" aria-label="Collapse all folders"></button></div>
    <div class="ex-tree" id="exTree"></div>
  </aside>
  <div class="splitter" id="exSplitter" role="separator" aria-orientation="vertical" aria-label="Resize the explorer" tabindex="0" title="Drag to resize · double-click to reset"><i></i></div>
  <section class="fx" aria-label="Flow">
    <div class="fx-bar" role="toolbar" aria-label="View">
      <button type="button" class="ib" id="exToggle" title="Show / hide the explorer (Ctrl+B)" aria-label="Explorer"></button>
      <span class="fx-t" id="flowName"></span>
      <span class="sp"></span>
      <button type="button" class="ib" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo" disabled></button>
      <button type="button" class="ib" id="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled></button>
      <i class="vsep"></i>
      <button type="button" class="ib" id="zout" title="Zoom out (−)" aria-label="Zoom out"></button>
      <span class="zv" id="zv">100%</span>
      <button type="button" class="ib" id="zin" title="Zoom in (+)" aria-label="Zoom in"></button>
      <button type="button" class="ib" id="fit" title="Fit to screen (0)" aria-label="Fit to screen"></button>
      <i class="vsep"></i>
      <button type="button" class="ib" id="names" title="Name inside the bar" aria-label="Name inside the bar"></button>
      <button type="button" class="ib" id="states" aria-label="Show all available data in the states"></button>
      <button type="button" class="ib" id="expand" title="Expand all" aria-label="Expand all"></button>
      <button type="button" class="ib" id="collapse" title="Collapse all" aria-label="Collapse all"></button>
    </div>
    <main id="host"></main>
  </section>
</div>
<footer class="site-foot">
  <div class="fx-legend" aria-label="Legend">
    <span><i class="lg fa"></i>abstract function</span><span><i class="lg fc"></i>concrete function</span><span><i class="lg da"></i>abstract data</span><span><i class="lg dc"></i>concrete data</span><span><i class="lg cb"></i>object</span>
    <span><i class="lg dia"></i>selection</span><span><i class="lg lp">↻</i>repetition</span><span><i class="lg tr"></i>try</span><span><i class="lg ca"></i>catch</span>
  </div>
  <div class="foot-meta"><span>FOP</span><span class="sep">·</span><a href="LICENSE" rel="license">MIT License</a><span class="sep">·</span><a href="mailto:contact@flow-oriented-programming.com">contact@flow-oriented-programming.com</a></div>
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
