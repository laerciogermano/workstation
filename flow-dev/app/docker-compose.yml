services:
  db:
    image: postgres:18-alpine
    container_name: flowdev-pg
    environment:
      POSTGRES_USER: flow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flow_dev_local}
      POSTGRES_DB: flowdev
    ports: ["55432:5432"]
    volumes: ["flowdev-pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow -d flowdev"]
      interval: 5s
      retries: 10
volumes:
  flowdev-pgdata:
