# Contabo: /etc/nginx/sites-available/flow-ide
# Certs: /etc/letsencrypt/live/flow-ide.laerciogermano.com/
# Não sobrescrever só com :80 — senão o HTTPS cai no default (centralizador).

server {
    server_name flow-ide.laerciogermano.com flow-ide.lesgermano.com;

    root /opt/flow-ide;
    index index.html;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/flow-ide.laerciogermano.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flow-ide.laerciogermano.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name flow-ide.laerciogermano.com flow-ide.lesgermano.com;
    return 301 https://$host$request_uri;
}
