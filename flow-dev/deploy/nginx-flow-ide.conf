# Contabo: /etc/nginx/sites-available/flow-ide
# HTTPS: certbot --nginx -d flow-ide.laerciogermano.com

server {
    listen 80;
    listen [::]:80;
    server_name flow-ide.laerciogermano.com flow-ide.lesgermano.com;

    root /opt/flow-ide;
    index index.html;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
