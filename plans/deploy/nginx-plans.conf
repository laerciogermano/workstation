# Contabo: /etc/nginx/sites-available/plans
# HTTPS: certbot --nginx -d plans.laerciogermano.com

server {
    listen 80;
    listen [::]:80;
    server_name plans.laerciogermano.com plans.lesgerman.com;

    root /opt/plans;
    index index.html;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
