name: rolego-dev
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: rolego
      POSTGRES_PASSWORD: rolego
      POSTGRES_DB: rolego
    ports: ["5432:5432"]
    volumes:
      - rolego-db:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rolego"]
      interval: 2s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
volumes:
  rolego-db:
