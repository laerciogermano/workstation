# Container web: SPA + proxy para a API + /media (docs/14). TLS fica no nginx do host.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 10m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "geolocation=(self), camera=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://faro.rolego.com.br https://eu.i.posthog.com; frame-src https://accounts.google.com https://appleid.apple.com; script-src 'self' https://accounts.google.com https://appleid.cdn-apple.com" always;

  location /api/ { proxy_pass http://api:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location ~ ^/(e|o)/[^/]+$ { proxy_pass http://api:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /media/ { alias /media/; expires 365d; add_header Cache-Control "public, immutable"; }
  location /assets/ { expires 365d; add_header Cache-Control "public, immutable"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location / { try_files $uri /index.html; }
}
