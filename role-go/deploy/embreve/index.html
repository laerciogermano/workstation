<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#05070f" />
    <meta
      name="description"
      content="RoleGo — Viva o Rolê. Em breve: descubra eventos perto de você."
    />
    <title>RoleGo — Em breve</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #05070f;
        --text: #ffffff;
        --text-muted: #9ca3af;
        --gradient: linear-gradient(135deg, #8749ff 0%, #452eff 100%);
        --cyan: #00e5e5;
        --font: 'Poppins', system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: var(--font);
        color: var(--text);
        background:
          radial-gradient(ellipse at 20% 0%, rgba(135, 73, 255, 0.22), transparent 50%),
          radial-gradient(ellipse at 85% 100%, rgba(69, 46, 255, 0.2), transparent 45%),
          var(--bg);
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }

      main {
        text-align: center;
        max-width: 28rem;
      }

      .logo {
        font-size: clamp(2.75rem, 10vw, 4rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
        background: var(--gradient);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin: 0;
      }

      .slogan {
        margin: 1rem 0 0.35rem;
        font-size: 1.05rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: var(--gradient);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .tagline {
        margin: 0;
        color: var(--text-muted);
        font-size: 0.95rem;
        font-weight: 500;
        line-height: 1.5;
      }

      .badge {
        display: inline-block;
        margin-top: 2rem;
        padding: 0.65rem 1.35rem;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text);
        background: var(--gradient);
        box-shadow: 0 0 32px rgba(135, 73, 255, 0.35);
      }

      .hint {
        margin: 1.5rem 0 0;
        color: var(--text-muted);
        font-size: 0.85rem;
        font-weight: 500;
      }

      .hint span {
        color: var(--cyan);
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="logo">RoleGo</h1>
      <p class="slogan">Viva o Rolê</p>
      <p class="tagline">Chega de sofrer para decidir onde sair.</p>
      <p class="badge">Em breve</p>
      <p class="hint">Descubra o que está rolando <span>perto de você</span>.</p>
    </main>
  </body>
</html>
