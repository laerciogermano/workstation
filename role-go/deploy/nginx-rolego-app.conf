# Produção Contabo: /etc/nginx/sites-available/rolego
# Proxy para o container web (compose rolego-prod em 127.0.0.1:8090).
# Certbot: rode após DNS A apontar para este host.

server {
    listen 80;
    listen [::]:80;
    server_name rolego.com.br www.rolego.com.br;

    client_max_body_size 10m;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
