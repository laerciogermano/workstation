# Produção Contabo: /etc/nginx/sites-available/rolego
# Proxy para o container web (compose rolego-prod em 127.0.0.1:8090).
# Protótipo HTML backup: /opt/rolego/web-proto-bak · SPA E01: /opt/rolego/web-e01-vite-bak
# Certbot: NÃO remover os blocos ssl / redirect HTTP.

server {
    server_name rolego.com.br www.rolego.com.br;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/rolego.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/rolego.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.rolego.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = rolego.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name rolego.com.br www.rolego.com.br;
    return 404; # managed by Certbot
}
