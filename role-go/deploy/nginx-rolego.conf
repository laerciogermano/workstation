# Legado: static root. Produção atual = nginx-rolego-app.conf (proxy :8090).
# Backup protótipo: /opt/rolego/web-proto-bak · SPA E01: /opt/rolego/web-e01-vite-bak
# Em breve: /opt/rolego/embreve
# Não sobrescrever o live sem preservar blocos Certbot.

server {
    listen 80;
    listen [::]:80;
    server_name rolego.com.br www.rolego.com.br;

    root /opt/rolego/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
