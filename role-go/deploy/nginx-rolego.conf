# Produção Contabo: /etc/nginx/sites-available/rolego
# Root: /opt/rolego/embreve
# Domínios: rolego.com.br www.rolego.com.br

server {
    listen 80;
    listen [::]:80;
    server_name rolego.com.br www.rolego.com.br;

    root /opt/rolego/embreve;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
