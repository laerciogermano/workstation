# Produção Contabo: /etc/nginx/sites-available/rolego
# Root: /opt/rolego/web (protótipo Beta HTML — beta-docs/prototipos/index.html)
# Backup SPA E01 Vite: /opt/rolego/web-e01-vite-bak
# Em breve (rollback): /opt/rolego/embreve
# Domínios: rolego.com.br www.rolego.com.br
# Nota: em produção o Certbot acrescenta listen 443 ssl + redirects HTTP→HTTPS.
# Não sobrescrever o arquivo live sem preservar os blocos # managed by Certbot.

server {
    listen 80;
    listen [::]:80;
    server_name rolego.com.br www.rolego.com.br;

    root /opt/rolego/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
