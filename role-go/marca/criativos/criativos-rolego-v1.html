<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoleGo | Criativos v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Tokens da marca RoleGo (v1) — fonte: role-go/identidade-visual.md
   Fundo dark + gradiente roxo→azul (marca) + neon por categoria.
   ========================================================= */
:root{
  --rg-bg:#04050B;
  --rg-bg-slide:#09091A;
  --rg-surface:#000000;
  --rg-surface-2:#0F0F13;
  --rg-surface-3:#1A1A20;
  --rg-line:#1E1E25;
  --rg-text:#FFFFFF;
  --rg-muted:#9CA3AF;
  --rg-faint:#6B7286;

  --rg-violet:#8749FF;
  --rg-purple:#9E19E9;
  --rg-violet-deep:#6539CB;
  --rg-blue:#452EFF;
  --rg-blue-soft:#3B82F6;

  --rg-cyan:#00E5E5;
  --rg-magenta:#FF1F7A;
  --rg-green:#00FF00;
  --rg-yellow:#FFCC00;

  --rg-grad:linear-gradient(120deg,#8749FF 0%,#452EFF 100%);
  --rg-grad-logo:linear-gradient(100deg,#B13CFF 0%,#8749FF 42%,#4F3BFF 100%);
  --rg-grad-neon:linear-gradient(120deg,#FF1F7A 0%,#8749FF 50%,#00E5E5 100%);
  --rg-grad-cta:linear-gradient(90deg,#00E5E5 0%,#8749FF 100%);
  --rg-grad-line:linear-gradient(90deg,#00E5E5 0%,#8749FF 55%,#FF1F7A 100%);

  --rg-radius:16px;
  --rg-radius-sm:10px;
  --rg-pill:999px;
  --rg-font-head:"Poppins", system-ui, "Segoe UI", sans-serif;
  --rg-font-body:"Poppins", system-ui, "Segoe UI", sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#1B1E2B;color:var(--rg-text);font-family:var(--rg-font-body);font-size:12.5px;line-height:1.55;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
body{padding:24px 0}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- páginas A4 paisagem ---------- */
@page{size:297mm 210mm;margin:0}
.page{width:297mm;height:210mm;margin:0 auto 24px;padding:14mm 16mm 11mm;position:relative;overflow:hidden;
  background:var(--rg-bg);box-shadow:0 10px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;isolation:isolate}
.page.slide{background:var(--rg-bg-slide)}
.page::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background-image:
    radial-gradient(1.6px 1.6px at 8% 14%,rgba(255,204,0,.8),transparent),radial-gradient(1.2px 1.2px at 23% 72%,rgba(255,255,255,.55),transparent),
    radial-gradient(1.4px 1.4px at 41% 9%,rgba(0,229,229,.7),transparent),radial-gradient(1.2px 1.2px at 57% 86%,rgba(255,255,255,.45),transparent),
    radial-gradient(1.6px 1.6px at 69% 22%,rgba(255,204,0,.7),transparent),radial-gradient(1.2px 1.2px at 83% 63%,rgba(135,73,255,.9),transparent),
    radial-gradient(1.4px 1.4px at 94% 38%,rgba(255,255,255,.5),transparent),radial-gradient(1.2px 1.2px at 14% 46%,rgba(0,229,229,.55),transparent),
    radial-gradient(1.2px 1.2px at 36% 95%,rgba(255,204,0,.55),transparent),radial-gradient(1.4px 1.4px at 76% 93%,rgba(0,229,229,.6),transparent),
    radial-gradient(1.2px 1.2px at 50% 40%,rgba(255,255,255,.3),transparent),radial-gradient(1.2px 1.2px at 3% 90%,rgba(255,31,122,.7),transparent)}
.waves{position:absolute;left:0;right:0;bottom:0;z-index:-1;pointer-events:none}
.waves svg{width:100%;height:100%;display:block}
.pagelogo{position:absolute;top:13mm;right:16mm;font-size:26px}
.fl{position:absolute;z-index:0;pointer-events:none}
.fl svg.i{width:100%;height:100%;stroke-width:1.6;filter:drop-shadow(0 0 4px currentColor) drop-shadow(0 0 10px currentColor)}
.glow{position:absolute;border-radius:50%;filter:blur(70px);z-index:-1;pointer-events:none}
@media print{
  html,body{background:none;padding:0}
  .page{margin:0;box-shadow:none;break-after:page}
}

/* ---------- cabeçalho e rodapé ---------- */
.eyebrow{font-family:var(--rg-font-head);font-size:12px;font-weight:600;color:var(--rg-muted);display:flex;align-items:center;gap:10px}
.eyebrow b{font-weight:800;font-size:13px;color:#fff;padding:2px 10px;border-radius:8px;border:1.5px solid transparent;
  background:linear-gradient(var(--rg-bg),var(--rg-bg)) padding-box,var(--rg-grad-cta) border-box;box-shadow:0 0 12px rgba(0,229,229,.35)}
.chipn{display:inline-flex;align-items:center;font-family:var(--rg-font-head);font-weight:800;color:#fff;padding:4px 16px;border-radius:12px;border:2px solid transparent;
  background:linear-gradient(#06070F,#06070F) padding-box,var(--rg-grad-cta) border-box;box-shadow:0 0 18px rgba(0,229,229,.3),0 0 18px rgba(135,73,255,.3)}
h1,h2,h3,h4{font-family:var(--rg-font-head);letter-spacing:-.01em}
.sec{display:flex;align-items:stretch;gap:14px;margin:8px 0 16px}
.sec::before{content:"";width:6px;border-radius:3px;flex:none;background:linear-gradient(180deg,var(--bar,var(--rg-magenta)),var(--bar2,var(--rg-violet)));box-shadow:0 0 14px var(--bar,var(--rg-magenta))}
.sec h2{font-size:33px;line-height:1.05;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:-.005em}
.uline{height:3px;width:150px;border-radius:2px;background:var(--rg-grad-line);box-shadow:0 0 10px rgba(0,229,229,.5)}
.lockup{display:flex;align-items:center;gap:10px}
.lockup .rmark{font-family:var(--rg-font-head);font-weight:900;line-height:1;letter-spacing:-.04em;background:linear-gradient(135deg,#00E5E5 0%,#4F3BFF 50%,#B13CFF 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lockup .sl{display:flex;align-items:center;gap:6px;font-family:var(--rg-font-head);font-weight:800;font-style:italic;letter-spacing:.16em;text-transform:uppercase;color:#E3E5EC;margin-top:5px}
.lockup .sl i{width:6px;height:6px;border-radius:50%;background:#B13CFF;box-shadow:0 0 6px #B13CFF}
.sec p{font-family:var(--rg-font-head);font-size:13px;font-weight:600;color:var(--bar,var(--rg-magenta));margin-top:4px}
h3{font-size:15px;font-weight:700;line-height:1.3;margin-bottom:6px}
.lead{font-size:14px;color:#C9CDD8;max-width:620px}
.muted{color:var(--rg-muted)}
.small{font-size:11px;line-height:1.5}
.foot{margin-top:auto;padding-top:9px;border-top:1px solid var(--rg-line);display:flex;justify-content:space-between;align-items:center;
  font-size:10px;color:var(--rg-faint)}
.foot .wm{font-size:12px}
.label{font-family:var(--rg-font-head);font-size:12px;font-weight:600;color:var(--rg-muted);margin-bottom:8px}
.hl-c{color:var(--rg-cyan);font-weight:600}
.hl-m{color:var(--rg-magenta);font-weight:600}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.card{border-radius:var(--rg-radius);padding:16px;background:var(--rg-surface);border:1px solid var(--rg-line)}
.card.acc{border-left:3px solid var(--acc,var(--rg-violet))}
.card .ic{color:var(--acc,var(--rg-violet));margin-bottom:8px}
.card .ic svg.i{width:22px;height:22px;filter:drop-shadow(0 0 5px currentColor)}
ul.dots{list-style:none;display:grid;gap:6px}
ul.dots li{position:relative;padding-left:16px}
ul.dots li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--acc,var(--rg-cyan));box-shadow:0 0 6px var(--acc,var(--rg-cyan))}

/* ---------- wordmark ---------- */
.wm{display:inline-block;font-family:var(--rg-font-head);font-weight:800;font-style:italic;letter-spacing:-.02em;line-height:1;white-space:nowrap;color:#fff}
.wm.glowing{filter:drop-shadow(0 0 14px rgba(135,73,255,.55)) drop-shadow(0 0 4px rgba(0,229,229,.35))}
.rawlogo{font-family:var(--rg-font-head);font-weight:800;font-style:italic;line-height:1;color:#fff}
.slogan{font-family:var(--rg-font-head);font-weight:800;font-style:italic;letter-spacing:.16em;text-transform:uppercase;color:var(--rg-cyan)}
/* símbolo / ícone do app: "R" + ping do rolê */
.sym{position:relative;width:var(--s,96px);height:var(--s,96px);border-radius:calc(var(--s,96px)*.26);background:var(--rg-grad);
  display:grid;place-items:center;flex:none;box-shadow:0 10px 30px rgba(69,46,255,.35), inset 0 1px 0 rgba(255,255,255,.25)}
.sym span{font-family:var(--rg-font-head);font-weight:800;color:#fff;font-size:calc(var(--s,96px)*.6);line-height:1;letter-spacing:-.04em;transform:translate(-4%,2%)}
.sym i{position:absolute;right:20%;top:20%;width:calc(var(--s,96px)*.15);height:calc(var(--s,96px)*.15);border-radius:50%;background:var(--rg-cyan);
  box-shadow:0 0 0 calc(var(--s,96px)*.04) rgba(0,229,229,.28),0 0 12px var(--rg-cyan)}
.sym.mono{background:#fff;box-shadow:none}.sym.mono span{color:#05070F}.sym.mono i{background:#05070F;box-shadow:none}
.sym.dark{background:#000;border:1px solid var(--rg-line)}
.sym.dark span{background:var(--rg-grad-logo);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- botões, chips, inputs, badges ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 22px;border-radius:var(--rg-pill);
  font-family:var(--rg-font-head);font-weight:700;font-size:13px;color:#fff;white-space:nowrap}
.btn.pri{background:var(--rg-grad-cta);box-shadow:0 0 18px rgba(0,229,229,.25),0 8px 24px rgba(135,73,255,.4)}
.btn.sec{border:1.5px solid var(--rg-cyan);background:rgba(0,229,229,.06)}
.btn.sec.m{border-color:var(--rg-magenta);background:rgba(255,31,122,.06)}
.btn.ghost{color:var(--rg-cyan);padding:0 6px}
.btn.danger{background:var(--rg-magenta);box-shadow:0 8px 22px rgba(255,31,122,.4)}
.btn.sm{height:30px;padding:0 14px;font-size:11px}
.btn.dis{background:var(--rg-surface-3);color:var(--rg-faint);box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 14px;border-radius:var(--rg-pill);font-size:11.5px;font-weight:600;
  border:1px solid #3A4057;color:#C9CDD8;white-space:nowrap}
.chip.on{background:var(--rg-violet);border-color:var(--rg-violet);color:#fff}
.chip.c{border-color:var(--rg-cyan);color:var(--rg-cyan)}
.input{height:40px;border-radius:12px;background:var(--rg-surface-2);border:1px solid var(--rg-line);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--rg-muted);font-size:12px}
.input.focus{border-color:var(--rg-cyan);box-shadow:0 0 0 3px rgba(0,229,229,.15);color:#fff}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 10px;border-radius:var(--rg-pill);font-size:10.5px;font-weight:700;font-family:var(--rg-font-head)}
.badge.y{background:rgba(255,204,0,.14);color:var(--rg-yellow);border:1px solid rgba(255,204,0,.45)}
.badge.g{background:rgba(0,255,0,.1);color:var(--rg-green);border:1px solid rgba(0,255,0,.4)}
.badge.c{background:rgba(0,229,229,.1);color:var(--rg-cyan);border:1px solid rgba(0,229,229,.4)}
.badge.m{background:rgba(255,31,122,.12);color:var(--rg-magenta);border:1px solid rgba(255,31,122,.45)}
.badge.v{background:rgba(135,73,255,.16);color:#B79BFF;border:1px solid rgba(135,73,255,.5)}
.badge svg.i{width:12px;height:12px}

/* ---------- cor ---------- */
.sw{border-radius:var(--rg-radius);overflow:hidden;background:var(--rg-surface);border:1px solid var(--rg-line);display:flex;flex-direction:column}
.sw .c{height:58px;position:relative}
.sw .t{padding:10px 12px 12px}
.sw b{font-family:var(--rg-font-head);font-size:13px;display:block}
.sw code{font-family:var(--rg-font-body);font-size:11px;color:var(--rg-muted);display:block;line-height:1.5}
.sw.neon .c{box-shadow:inset 0 -14px 30px rgba(0,0,0,.25)}

/* ---------- celular ---------- */
.phone{--pc:#8749FF;width:210px;height:430px;border-radius:34px;padding:5px;background:#000;border:2px solid var(--pc);flex:none;
  box-shadow:0 0 6px var(--pc),0 0 28px -4px var(--pc),inset 0 0 6px var(--pc)}
.phone.c{--pc:#00E5E5}.phone.y{--pc:#FFCC00}.phone.m{--pc:#FF1F7A}
.phone.sm{zoom:.72}
.scr .island{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:58px;height:17px;border-radius:10px;background:#000;z-index:3}
.scr .sb{display:flex;justify-content:space-between;align-items:center;font-size:9.5px;font-weight:600;padding:0 6px 0 8px;height:17px;margin-bottom:6px}
.scr .hd{display:flex;align-items:center;justify-content:space-between;height:24px;margin-bottom:8px;font-weight:700;font-size:12px}
.scr .hd svg.i{width:15px;height:15px}
.scr svg.i{width:12px;height:12px}
.av{width:var(--a,26px);height:var(--a,26px);border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:calc(var(--a,26px)*.42);color:#fff;flex:none;
  border:1.5px solid #05060C;box-shadow:0 0 0 1.5px var(--ac,#FF1F7A),0 0 8px var(--ac,#FF1F7A)}
.seg{display:flex;background:#121216;border-radius:999px;padding:3px;font-size:9px;font-weight:600;color:var(--rg-muted)}
.seg span{flex:1;text-align:center;padding:4px 0;border-radius:999px}.seg .on{background:var(--rg-grad-cta);color:#fff}
.lrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #18181D;font-size:10px;line-height:1.25}
.chip.xs{height:20px;padding:0 9px;font-size:9px;gap:4px}
.rbtn{border-radius:50%;display:grid;place-items:center;flex:none}
.opt{border-radius:12px;padding:8px 10px;border:1.5px solid var(--oc,#00E5E5);box-shadow:0 0 12px -2px var(--oc,#00E5E5);background:#000}
.phone .scr{text-align:left;width:100%;height:100%;border-radius:27px;background:#000;overflow:hidden;position:relative;display:flex;flex-direction:column;padding:12px 14px}
.phone .st{display:flex;justify-content:space-between;font-size:9px;font-weight:600;color:#fff;padding:0 6px 8px}
.phone .notch{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:62px;height:16px;border-radius:10px;background:#000}
.tabbar{margin-top:auto;display:flex;justify-content:space-around;padding-top:8px;border-top:1px solid var(--rg-line);color:var(--rg-faint)}
.tabbar svg.i{width:17px;height:17px}.tabbar .on{color:var(--rg-violet)}

/* pôster abstrato de evento */
.poster{border-radius:14px;position:relative;overflow:hidden;background:
  radial-gradient(120% 90% at 15% 10%,#FF1F7A 0%,transparent 55%),
  radial-gradient(90% 80% at 90% 30%,#00E5E5 0%,transparent 55%),
  radial-gradient(120% 120% at 60% 110%,#452EFF 0%,transparent 60%),#2A0F5E}
.poster.b{background:radial-gradient(110% 90% at 80% 0%,#8749FF 0%,transparent 60%),radial-gradient(100% 90% at 0% 100%,#00E5E5 0%,transparent 55%),#0B1240}
.poster.c{background:radial-gradient(100% 100% at 20% 0%,#FFCC00 0%,transparent 50%),radial-gradient(110% 100% at 100% 80%,#FF1F7A 0%,transparent 60%),#3A0B3F}
.poster::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.06) 0 2px,transparent 2px 14px)}

.qr{display:grid;grid-template-columns:repeat(21,1fr);background:#fff;padding:8px;border-radius:10px;aspect-ratio:1}
.qr i{aspect-ratio:1}.qr i.k{background:#05070F}

.hr-neon{height:2px;border:0;background:var(--rg-grad-neon);opacity:.8;border-radius:2px}
.kpi b{font-family:var(--rg-font-head);font-size:26px;font-weight:800;line-height:1;display:block}
table.t{width:100%;border-collapse:collapse;font-size:11.5px}
table.t th{text-align:left;font-family:var(--rg-font-head);font-weight:600;color:var(--rg-muted);font-size:11px;padding:6px 8px;border-bottom:1px solid var(--rg-line)}
table.t td{padding:7px 8px;border-bottom:1px solid #191F36;vertical-align:middle}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-right:6px}
.no{position:relative}
.no::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(to top right,transparent calc(50% - 1.5px),var(--rg-magenta) calc(50% - 1.5px),var(--rg-magenta) calc(50% + 1.5px),transparent calc(50% + 1.5px))}
/* ===== criativos 4:5 (540×675 → PNG 1080×1350 @2x) ===== */
html,body{background:#1B1E2B}
body{padding:24px;display:flex;flex-wrap:wrap;gap:24px;justify-content:center}
body.solo{padding:0;gap:0;background:#000}
body.solo .post:not(.on){display:none}
.post{width:540px;height:675px;position:relative;overflow:hidden;isolation:isolate;background:var(--rg-bg);display:flex;flex-direction:column;padding:34px 36px 32px}
.post.slide{background:var(--rg-bg-slide)}
.post::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:
 radial-gradient(1.6px 1.6px at 8% 14%,rgba(255,204,0,.8),transparent),radial-gradient(1.2px 1.2px at 23% 72%,rgba(255,255,255,.55),transparent),
 radial-gradient(1.4px 1.4px at 41% 9%,rgba(0,229,229,.7),transparent),radial-gradient(1.2px 1.2px at 57% 86%,rgba(255,255,255,.45),transparent),
 radial-gradient(1.6px 1.6px at 69% 22%,rgba(255,204,0,.7),transparent),radial-gradient(1.2px 1.2px at 83% 63%,rgba(135,73,255,.9),transparent),
 radial-gradient(1.4px 1.4px at 94% 38%,rgba(255,255,255,.5),transparent),radial-gradient(1.2px 1.2px at 14% 46%,rgba(0,229,229,.55),transparent),
 radial-gradient(1.2px 1.2px at 3% 90%,rgba(255,31,122,.7),transparent)}
.photo{position:absolute;left:0;right:0;top:0;z-index:-1;background-size:cover;background-repeat:no-repeat}
.photo::after{content:"";position:absolute;inset:0;background:
 linear-gradient(180deg,rgba(4,5,11,.15) 0%,rgba(4,5,11,0) 30%,rgba(4,5,11,.8) 62%,#04050B 88%),
 linear-gradient(110deg,rgba(0,229,229,.22),rgba(69,46,255,.18) 50%,transparent 80%)}
.hl{font-family:var(--rg-font-head);font-weight:800;font-style:italic;text-transform:uppercase;line-height:.98;letter-spacing:-.015em}
.hl .g{display:inline-block;vertical-align:top;background:var(--rg-grad-cta);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.08em}
.hbar{display:flex;gap:16px}
.hbar::before{content:"";width:7px;border-radius:4px;flex:none;background:linear-gradient(180deg,var(--rg-cyan),var(--rg-violet));box-shadow:0 0 16px var(--rg-cyan)}
.sub{font-size:17px;line-height:1.4;color:#E3E5EC;font-weight:500}
.post .btn{height:52px;font-size:17px;padding:0 30px}
.post .btn svg.i{width:20px;height:20px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>

/* QR ilustrativo (não codifica URL): padrão determinístico com os três marcadores */
function qr(el){
  if(!el) return; const n=21; let s=7;
  const rnd=()=>((s=(s*9301+49297)%233280)/233280);
  const finder=(r,c)=>{for(const [R,C] of [[0,0],[0,n-7],[n-7,0]]){const y=r-R,x=c-C;if(y>=0&&y<7&&x>=0&&x<7)return (y==0||y==6||x==0||x==6||(y>=2&&y<=4&&x>=2&&x<=4))?1:0;}return -1};
  let h="";for(let r=0;r<n;r++)for(let c=0;c<n;c++){const f=finder(r,c);const on=f===-1?(rnd()>.52):f;h+=on?'<i class="k"></i>':'<i></i>'}
  el.innerHTML=h;
}

/* Texto em gradiente → SVG. O Chrome desenha uma caixa fina em volta de
   background-clip:text ao gerar PDF; com <text fill="url(#grad)"> isso some. */
function gradText(){
  const ns="http://www.w3.org/2000/svg", ctx=document.createElement("canvas").getContext("2d");
  let n=0;
  document.querySelectorAll("body *").forEach(el=>{
    const cs=getComputedStyle(el);
    if(cs.webkitBackgroundClip!=="text"||!cs.backgroundImage.includes("gradient")) return;
    const w=el.offsetWidth, h=el.offsetHeight, fs=parseFloat(cs.fontSize);
    ctx.font=`${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const m=ctx.measureText(el.textContent);
    const asc=m.fontBoundingBoxAscent, desc=m.fontBoundingBoxDescent;
    const lh=cs.lineHeight==="normal"?asc+desc:parseFloat(cs.lineHeight);
    const pt=parseFloat(cs.paddingTop), pl=parseFloat(cs.paddingLeft);
    const base=pt+(lh-(asc+desc))/2+asc;
    const ang=parseFloat((cs.backgroundImage.match(/(-?[\d.]+)deg/)||[0,90])[1])*Math.PI/180;
    const stops=[...cs.backgroundImage.matchAll(/(rgba?\([^)]*\))\s*([\d.]+%)?/g)];
    const id="gt"+(n++), dx=Math.sin(ang)/2, dy=-Math.cos(ang)/2;
    const svg=document.createElementNS(ns,"svg");
    svg.setAttribute("width",w);svg.setAttribute("height",h);
    svg.style.cssText="display:block;overflow:visible";
    let g=`<defs><linearGradient id="${id}" x1="${.5-dx}" y1="${.5-dy}" x2="${.5+dx}" y2="${.5+dy}">`;
    stops.forEach((s,i)=>g+=`<stop offset="${s[2]||(i/(stops.length-1)*100+"%")}" stop-color="${s[1]}"/>`);
    g+="</linearGradient></defs>";
    let t="";
    el.childNodes.forEach(c=>{
      const txt=(c.textContent||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
      t+=c.nodeType===3?txt:`<tspan font-weight="${getComputedStyle(c).fontWeight}">${txt}</tspan>`;
    });
    svg.innerHTML=g+`<text x="${pl}" y="${base}" fill="url(#${id})" style="font-family:${cs.fontFamily.replace(/"/g,"'")};font-size:${fs}px;font-weight:${cs.fontWeight};font-style:${cs.fontStyle};letter-spacing:${cs.letterSpacing};text-transform:${cs.textTransform}">${t}</text>`;
    el.style.width=w+"px";el.style.height=h+"px";el.style.padding="0";
    el.style.background="none";el.style.webkitBackgroundClip="border-box";el.style.backgroundClip="border-box";
    el.replaceChildren(svg);
  });
}

document.querySelectorAll(".waves").forEach((el,k)=>{
  const W=1200,H=200;let p="";
  for(let j=0;j<9;j++){
    const y=60+j*13, a=18+j*2.5, ph=j*.5+k;
    let d=`M0 ${y}`;for(let x=0;x<=W;x+=20)d+=` L${x} ${(y+Math.sin(x/170+ph)*a).toFixed(1)}`;
    p+=`<path d="${d}" stroke="url(#wv${k})" stroke-width="${j%3?1:1.6}" opacity="${(.25+j*.07).toFixed(2)}" fill="none"/>`;
  }
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="wv${k}" x1="0" x2="1"><stop offset="0" stop-color="#00E5E5"/><stop offset=".5" stop-color="#8749FF"/><stop offset="1" stop-color="#FF1F7A"/></linearGradient></defs>${p}</svg>`;
});

/* ======== wordmark: "Role" + "Go", com o "o" virando pin de localização (ping do ícone no miolo) ======== */
function buildLogos(){
  const ns="http://www.w3.org/2000/svg";let n=0;
  document.querySelectorAll(".wm").forEach(el=>{
    const fs=parseFloat(getComputedStyle(el).fontSize), c=el.classList;
    const white=c.contains("white"), black=c.contains("black"), light=c.contains("onlight");
    const roleC=el.dataset.role||(black?"#05070F":light?"#0B0B1A":"#fff");
    const cols=(el.dataset.g||(white?"#fff,#fff":black?"#05070F,#05070F":"#00E5E5,#8749FF,#FF1F7A")).split(",");
    const dotC=black?"#fff":"#00E5E5", outline=el.hasAttribute("data-outline"), thin=el.hasAttribute("data-thin");
    const id="lg"+(n++), svg=document.createElementNS(ns,"svg"), st=`font-family:Poppins;font-weight:800;font-style:italic;font-size:${fs}px;letter-spacing:-.02em`;
    svg.style.cssText="display:block;overflow:visible";
    svg.innerHTML=`<defs><linearGradient id="${id}" gradientUnits="userSpaceOnUse"></linearGradient></defs><text style="${st}"><tspan>Role</tspan><tspan>Go</tspan></text><text style="${st}">o</text>`;
    el.replaceChildren(svg);
    const [t,probe]=svg.querySelectorAll("text"), [t1,t2]=t.querySelectorAll("tspan"), base=fs*.86;
    t.setAttribute("y",base);
    if(thin) t2.style.fontWeight="400";
    const paint=(node,col)=>{ if(outline){node.setAttribute("fill","none");node.setAttribute("stroke",col);node.setAttribute("stroke-width",fs*.025);} else node.setAttribute("fill",col); };
    paint(t1,roleC); paint(t2,`url(#${id})`);
    const wRole=t1.getComputedTextLength(), wAll=t.getComputedTextLength(), wo=probe.getComputedTextLength();
    probe.remove();
    /* pin: o "o" ganha uma ponta embaixo (inclinada como o itálico); o ping do ícone fica no miolo */
    const cx=wAll-wo/2+fs*.01, cy=base-fs*.285, R=fs*.285;
    const pt=a=>{a*=Math.PI/180;return [cx+R*Math.cos(a)-R*Math.sin(a)*.19, cy+R*Math.sin(a)];};
    const [ax,ay]=pt(28),[bx,by]=pt(152), tx=cx-fs*.075, ty=base+fs*.2, end=wAll+fs*.04;
    const g=svg.querySelector("linearGradient");
    g.setAttribute("x1",wRole);g.setAttribute("x2",wAll);g.setAttribute("y1",0);g.setAttribute("y2",0);
    g.innerHTML=cols.map((cl,i)=>`<stop offset="${cols.length>1?i/(cols.length-1):0}" stop-color="${cl}"/>`).join("");
    const tail=document.createElementNS(ns,"path");
    tail.setAttribute("d",`M${ax} ${ay} L${tx} ${ty} L${bx} ${by}${outline?"":" Z"}`);tail.setAttribute("stroke-linejoin","round");
    if(outline){tail.setAttribute("fill","none");tail.setAttribute("stroke",`url(#${id})`);tail.setAttribute("stroke-width",fs*.025);}
    else{tail.setAttribute("fill",`url(#${id})`);tail.setAttribute("stroke",`url(#${id})`);tail.setAttribute("stroke-width",fs*.01);}
    svg.appendChild(tail);
    const ping=document.createElementNS(ns,"circle");
    ping.setAttribute("cx",cx-fs*.005);ping.setAttribute("cy",cy);ping.setAttribute("r",fs*.045);ping.setAttribute("fill",dotC);
    if(!outline) svg.appendChild(ping);
    svg.setAttribute("width",end);svg.setAttribute("height",fs*1.08);
  });
}
document.fonts.load("italic 800 40px Poppins").then(()=>document.fonts.ready).then(()=>{buildLogos();gradText();});
