<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="RoleGo"><title>RoleGo</title><style>
.rgi-ro,.rgi-gg{animation:rgi-rise 420ms cubic-bezier(0,0,.2,1) both}
