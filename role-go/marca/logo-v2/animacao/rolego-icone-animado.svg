.rgi-px{animation:rgi-px 640ms cubic-bezier(.2,0,0,1) 420ms both}
.rgi-py{animation:rgi-py 640ms linear 420ms both}
.rgi-ps{transform-box:view-box;transform-origin:175.9px 115.1px;animation:rgi-ps 640ms cubic-bezier(.2,0,0,1) 420ms both}
.rgi-rp{transform-box:view-box;transform-origin:165.4px 174.5px;opacity:0;animation:rgi-rp 700ms cubic-bezier(0,0,.2,1) 1020ms both}
.rgi-rp2{animation-delay:1180ms}
