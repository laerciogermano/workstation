<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gestão de CDPs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Newsreader:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #ffffff;
      --paper-2: #f4f1ea;
      --ink: #14120f;
      --body: #44423d;
      --accent: #e0402b;
      --line: #e7e3db;
      --ok: #1b7f4a;
      --radius: 6px;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --font-display: "Archivo", system-ui, sans-serif;
      --font-body: "Newsreader", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-body);
    }
    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line);
      padding-bottom: 1rem;
      margin-bottom: 1.25rem;
    }
    h1 {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(1.7rem, 3vw, 2.25rem);
      letter-spacing: -0.02em;
      margin: 0;
    }
    .meta {
      color: var(--body);
      margin: 0.35rem 0 0;
      font-size: 0.95rem;
    }
    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    button, .btn {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.85rem;
      padding: 0.55rem 0.9rem;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: #fff;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 140ms var(--ease), color 140ms var(--ease), transform 140ms var(--ease);
    }
    button:hover, .btn:hover { transform: translateY(-1px); }
    button.secondary, .btn.secondary {
      background: var(--paper);
      color: var(--ink);
    }
    button.ghost, .btn.ghost {
      background: transparent;
      border-color: var(--line);
      color: var(--ink);
    }
    button.danger { border-color: var(--accent); color: var(--accent); background: var(--paper); }
    button:disabled { opacity: 0.45; cursor: wait; transform: none; }
    #flash {
      min-height: 1.25rem;
      margin: 0 0 1rem;
      font-family: var(--font-display);
      font-size: 0.85rem;
      color: var(--body);
      white-space: pre-wrap;
    }
    #flash.ok { color: var(--ok); }
    #flash.err { color: var(--accent); }
    .list {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--paper);
    }
    .row {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) 90px 90px minmax(0, 1fr) auto;
      gap: 0.75rem;
      align-items: center;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--line);
    }
    .row:last-child { border-bottom: 0; }
    .row:hover { background: var(--paper-2); }
    .row.head {
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--body);
      background: var(--paper-2);
    }
    .row.head:hover { background: var(--paper-2); }
    .name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.98rem;
      margin: 0;
    }
    .id {
      color: var(--body);
      font-size: 0.82rem;
      margin: 0.15rem 0 0;
      font-variant-numeric: tabular-nums;
    }
    .port {
      font-family: var(--font-display);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .badge::before {
      content: "";
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: var(--line);
    }
    .badge.up { color: var(--ok); }
    .badge.up::before { background: var(--ok); }
    .badge.down { color: var(--body); }
    .badge.down::before { background: #b7b2a8; }
    .row-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: flex-end; }
    .row-actions button { padding: 0.4rem 0.65rem; font-size: 0.78rem; }
    .empty {
      padding: 2rem 1rem;
      text-align: center;
      color: var(--body);
      font-size: 1.05rem;
    }
    dialog {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0;
      width: min(560px, calc(100vw - 2rem));
      background: var(--paper);
      color: var(--ink);
    }
    dialog::backdrop { background: rgba(20, 18, 15, 0.35); }
    .dlg {
      padding: 1.25rem 1.25rem 1.4rem;
      display: grid;
      gap: 0.9rem;
    }
    .dlg h2 {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
      margin: 0;
    }
    label {
      display: grid;
      gap: 0.35rem;
      font-family: var(--font-display);
      font-size: 0.78rem;
      font-weight: 700;
    }
    input, textarea {
      font: inherit;
      font-family: var(--font-body);
      font-size: 0.95rem;
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      color: var(--ink);
    }
    textarea { min-height: 4rem; resize: vertical; }
    .hint { font-weight: 400; color: var(--body); font-size: 0.78rem; }
    .dlg-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.25rem; }
    .cam-block {
      border-top: 1px solid var(--line);
      padding-top: 0.9rem;
      display: grid;
      gap: 0.9rem;
    }
    .cam-block h3 {
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 700;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--body);
    }
    @media (max-width: 820px) {
      .row, .row.head {
        grid-template-columns: 1fr 1fr;
      }
      .row.head span:nth-child(n+3) { display: none; }
      .row > :nth-child(3),
      .row > :nth-child(4) { grid-column: 1 / -1; }
      .row-actions { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Gestão de CDPs</h1>
        <p class="meta" id="count">—</p>
      </div>
      <div class="actions">
        <button type="button" class="secondary" id="refresh">Atualizar</button>
        <button type="button" id="create">Criar CDP</button>
      </div>
    </header>
    <div id="flash" aria-live="polite"></div>
    <div class="list" id="list" aria-live="polite"></div>
  </div>

  <dialog id="editor">
    <form class="dlg" id="form" method="dialog">
      <h2 id="editor-title">Criar CDP</h2>
      <input type="hidden" id="mode" value="create" />
      <label>
        Nome
        <input id="name" required autocomplete="off" />
      </label>
      <label id="id-field">
        ID
        <input id="id" autocomplete="off" placeholder="slug (opcional)" />
        <span class="hint">Se vazio, gera a partir do nome.</span>
      </label>
      <label>
        Porta
        <input id="port" type="number" min="1" max="65535" required />
      </label>
      <label>
        URL padrão
        <input id="defaultUrl" type="url" placeholder="https://…" />
      </label>
      <label>
        Observações
        <textarea id="obs"></textarea>
      </label>
      <div class="cam-block" id="cam-block" hidden>
        <h3>Câmera</h3>
        <label>
          Vídeo (caminho absoluto)
          <input id="video" type="text" placeholder="/Users/…/oferta.mp4" />
        </label>
        <label>
          Nome da webcam
          <input id="label" type="text" value="FaceTime HD Camera" />
        </label>
        <div class="dlg-actions">
          <button type="button" class="secondary" id="apply-cam">Aplicar câmera</button>
          <button type="button" class="ghost" id="clear-cam">Limpar câmera</button>
        </div>
      </div>
      <div class="dlg-actions">
        <button type="submit" id="save">Salvar</button>
        <button type="button" class="secondary" id="cancel">Cancelar</button>
      </div>
    </form>
  </dialog>

  <script>
    const $ = (id) => document.getElementById(id);
    const flash = (msg, cls = '') => {
      const el = $('flash');
      el.className = cls;
      el.textContent = msg || '';
    };

    let defaults = { video: '', label: 'FaceTime HD Camera' };
    let cdps = [];
    let busy = false;

    async function api(path, opts = {}) {
      const r = await fetch(path, {
        headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
        ...opts,
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || r.statusText || 'erro');
      return data;
    }

    function setBusy(on) {
      busy = on;
      document.querySelectorAll('button').forEach((b) => {
        if (b.id === 'cancel') return;
        if (on) b.disabled = true;
        else b.disabled = false;
      });
    }

    function render() {
      const up = cdps.filter((c) => c.status === 'up').length;
      $('count').textContent = `${cdps.length} CDPs · ${up} up · ${cdps.length - up} down`;
      const root = $('list');
      if (!cdps.length) {
        root.innerHTML = '<div class="empty">Nenhum CDP ainda. Crie o primeiro.</div>';
        return;
      }
      root.innerHTML = `
        <div class="row head">
          <span>CDP</span><span>Status</span><span>Porta</span><span>URL</span><span></span>
        </div>
        ${cdps.map((c) => `
          <div class="row" data-id="${escapeAttr(c.id)}">
            <div>
              <p class="name">${escapeHtml(c.name || c.id)}</p>
              <p class="id">${escapeHtml(c.id)}</p>
            </div>
            <div><span class="badge ${c.status}">${c.status}</span></div>
            <div class="port">${c.displayPort ?? '—'}</div>
            <div class="id">${escapeHtml(c.defaultUrl || '—')}</div>
            <div class="row-actions">
              ${c.status === 'up'
                ? `<button type="button" class="secondary" data-act="stop">Parar</button>`
                : `<button type="button" data-act="start">Executar</button>`}
              <button type="button" class="ghost" data-act="edit">Editar</button>
              <button type="button" class="danger" data-act="remove">Remover</button>
            </div>
          </div>
        `).join('')}
      `;
    }

    function escapeHtml(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
    function escapeAttr(s) {
      return escapeHtml(s).replace(/'/g, '&#39;');
    }

    async function loadList({ quiet } = {}) {
      const data = await api('/api/cdps');
      cdps = data.cdps || [];
      if (data.defaults) defaults = data.defaults;
      render();
      if (!quiet) flash('');
    }

    function openCreate() {
      $('mode').value = 'create';
      $('editor-title').textContent = 'Criar CDP';
      $('id-field').hidden = false;
      $('id').value = '';
      $('id').disabled = false;
      $('name').value = '';
      $('port').value = suggestPort();
      $('defaultUrl').value = '';
      $('obs').value = '';
      $('cam-block').hidden = true;
      $('editor').showModal();
      $('name').focus();
    }

    function suggestPort() {
      const used = new Set(cdps.map((c) => Number(c.preferredPort || c.displayPort)).filter(Boolean));
      let p = 9240;
      while (used.has(p)) p += 1;
      return p;
    }

    async function openEdit(id) {
      const c = cdps.find((x) => x.id === id);
      if (!c) return;
      $('mode').value = 'edit';
      $('editor-title').textContent = `Editar · ${c.name || c.id}`;
      $('id-field').hidden = false;
      $('id').value = c.id;
      $('id').disabled = true;
      $('name').value = c.name || '';
      $('port').value = c.preferredPort || c.displayPort || '';
      $('defaultUrl').value = c.defaultUrl || '';
      $('obs').value = c.obs || '';
      $('cam-block').hidden = false;
      try {
        const cam = await api('/api/camera?id=' + encodeURIComponent(id));
        $('video').value = cam.video || defaults.video || '';
        $('label').value = cam.label || defaults.label || 'FaceTime HD Camera';
      } catch {
        $('video').value = defaults.video || '';
        $('label').value = defaults.label || 'FaceTime HD Camera';
      }
      $('editor').showModal();
      $('name').focus();
    }

    $('list').addEventListener('click', async (ev) => {
      const btn = ev.target.closest('button[data-act]');
      if (!btn || busy) return;
      const row = btn.closest('[data-id]');
      const id = row?.dataset.id;
      if (!id) return;
      const act = btn.dataset.act;
      try {
        if (act === 'edit') return openEdit(id);
        setBusy(true);
        if (act === 'start') {
          flash(`executando ${id}…`);
          await api(`/api/cdps/${encodeURIComponent(id)}/start`, { method: 'POST', body: '{}' });
          flash(`${id} up`, 'ok');
        } else if (act === 'stop') {
          flash(`parando ${id}…`);
          await api(`/api/cdps/${encodeURIComponent(id)}/stop`, { method: 'POST', body: '{}' });
          flash(`${id} down`, 'ok');
        } else if (act === 'remove') {
          if (!confirm(`Remover meta do CDP “${id}”? (perfil no disco permanece)`)) return;
          flash(`removendo ${id}…`);
          await api(`/api/cdps/${encodeURIComponent(id)}`, { method: 'DELETE', body: '{}' });
          flash(`${id} removido`, 'ok');
        }
        await loadList({ quiet: true });
      } catch (e) {
        flash(String(e.message || e), 'err');
      } finally {
        setBusy(false);
      }
    });

    $('form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const mode = $('mode').value;
      const payload = {
        name: $('name').value.trim(),
        port: Number($('port').value),
        defaultUrl: $('defaultUrl').value.trim(),
        obs: $('obs').value.trim(),
      };
      try {
        setBusy(true);
        if (mode === 'create') {
          if ($('id').value.trim()) payload.id = $('id').value.trim();
          flash('criando…');
          await api('/api/cdps', { method: 'POST', body: JSON.stringify(payload) });
          flash('CDP criado', 'ok');
        } else {
          const id = $('id').value.trim();
          flash('salvando…');
          await api(`/api/cdps/${encodeURIComponent(id)}`, {
            method: 'PATCH',
            body: JSON.stringify(payload),
          });
          flash('CDP atualizado', 'ok');
        }
        $('editor').close();
        await loadList({ quiet: true });
      } catch (e) {
        flash(String(e.message || e), 'err');
      } finally {
        setBusy(false);
      }
    });

    $('apply-cam').addEventListener('click', async () => {
      const id = $('id').value.trim();
      try {
        setBusy(true);
        flash('aplicando câmera…');
        await api('/api/camera', {
          method: 'POST',
          body: JSON.stringify({
            id,
            video: $('video').value.trim(),
            label: $('label').value.trim(),
          }),
        });
        flash('câmera aplicada', 'ok');
        await loadList({ quiet: true });
      } catch (e) {
        flash(String(e.message || e), 'err');
      } finally {
        setBusy(false);
      }
    });

    $('clear-cam').addEventListener('click', async () => {
      const id = $('id').value.trim();
      try {
        setBusy(true);
        flash('limpando câmera…');
        await api('/api/camera/clear', {
          method: 'POST',
          body: JSON.stringify({ id }),
        });
        $('video').value = defaults.video || '';
        $('label').value = defaults.label || 'FaceTime HD Camera';
        flash('câmera limpa', 'ok');
        await loadList({ quiet: true });
      } catch (e) {
        flash(String(e.message || e), 'err');
      } finally {
        setBusy(false);
      }
    });

    $('create').addEventListener('click', openCreate);
    $('cancel').addEventListener('click', () => $('editor').close());
    $('refresh').addEventListener('click', () => {
      loadList().catch((e) => flash(String(e.message || e), 'err'));
    });

    loadList().catch((e) => flash(String(e.message || e), 'err'));
    setInterval(() => {
      if (busy || $('editor').open) return;
      loadList({ quiet: true }).catch(() => {});
    }, 4000);
  </script>
</body>
</html>
