# Redroid — Android em container para o ConnectMax.
# Requer Linux com módulos binder (ashmem opcional se use_memfd=true).
# NÃO exponha a porta ADB na internet pública.
# Multi-agent: COMPOSE_PROJECT_NAME + REDROID_CONTAINER_NAME + ADB_PORT por nome.

services:
  redroid:
    image: ${REDROID_IMAGE:-redroid/redroid:15.0.0_64only-latest}
    container_name: ${REDROID_CONTAINER_NAME:-connectmax-redroid}
    restart: unless-stopped
    privileged: true
    stdin_open: true
    tty: true
    pull_policy: always
    ports:
      # ADB só em localhost — seguro para desenvolvimento local
      - "${ADB_HOST:-127.0.0.1}:${ADB_PORT:-5555}:5555"
    volumes:
      # Volume nomeado (filesystem Linux nativo). Bind ./data no Mac/Colima
      # (virtiofs) quebra o /data do Android (SQLITE_CANTOPEN).
      # Com COMPOSE_PROJECT_NAME por agent, o volume fica isolado por projeto.
      - redroid-data:/data
    command:
      - "androidboot.redroid_width=${REDROID_WIDTH:-720}"
      - "androidboot.redroid_height=${REDROID_HEIGHT:-1280}"
      - "androidboot.redroid_dpi=${REDROID_DPI:-320}"
      - "androidboot.redroid_fps=${REDROID_FPS:-30}"
      - "androidboot.redroid_gpu_mode=${REDROID_GPU_MODE:-guest}"
      - "androidboot.use_memfd=true"
      # Identidade aparente do aparelho (esconde "redroid15_arm64_only" em apps)
      - "ro.product.brand=${DEVICE_BRAND:-google}"
      - "ro.product.manufacturer=${DEVICE_MANUFACTURER:-Google}"
      # Sem espaços no valor: o parser do Android corta em whitespace
      - "ro.product.model=${DEVICE_MODEL:-Pixel8}"
      - "ro.product.name=${DEVICE_NAME:-shiba}"
      - "ro.product.device=${DEVICE_DEVICE:-shiba}"
      - "ro.product.marketname=${DEVICE_MARKETNAME:-Pixel8}"

volumes:
  redroid-data:
